pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = '看字助手'
include ':app', ':libausbc', ':libuvc', ':libnative'
project(':libausbc').projectDir = file('third_party/AndroidUSBCamera/libausbc')
project(':libuvc').projectDir = file('third_party/AndroidUSBCamera/libuvc')
project(':libnative').projectDir = file('third_party/AndroidUSBCamera/libnative')

include ':ppocr-sdk'
project(':ppocr-sdk').projectDir = file('third_party/PaddleOCR/deploy/ppocr-android/ppocr-sdk')
