plugins { id 'com.android.application' }

android {
    namespace 'com.vobichngan.kanzi'
    compileSdk 36
    signingConfigs {
        release {
            def ksPath = System.getenv("KANZI_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("KANZI_KEYSTORE_PASSWORD")
                keyAlias System.getenv("KANZI_KEY_ALIAS")
                keyPassword System.getenv("KANZI_KEY_PASSWORD")
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    defaultConfig {
        applicationId 'com.vobichngan.kanzi'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.4.0'
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.github.ernestp.AndroidUSBCamera:libausbc:3.6.0'
}
