plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.vobichngan.kanzi'
    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            def ksPath = System.getenv("KANZI_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("KANZI_KEYSTORE_PASSWORD")
                keyAlias System.getenv("KANZI_KEY_ALIAS")
                keyPassword System.getenv("KANZI_KEY_PASSWORD")
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    // The neural TTS runtime has been renamed to a private ELF SONAME in
    // CI. Never pickFirst libonnxruntime.so: doing so broke OCR in #303.
    // The NDK runtime uses the SDK's already-known-good shared C++ binary.
    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }
    defaultConfig {
        applicationId 'com.vobich.kanzi'
        minSdk 26
        targetSdk 35
        versionCode 40
        versionName '0.9.9'
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation project(':libausbc')
    implementation project(':ppocr-sdk')
    // Optional locally bundled PP-DocLayout-S; matches OCR SDK version.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.21.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    // JNI runtime only; all voice MODEL files are downloaded on user request.
    // CI fetches the official, SHA256-pinned sherpa-onnx AAR before Gradle.
    implementation files('libs/sherpa-onnx-2.0.1.aar')
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'commons-io:commons-io:2.16.1'
}
