name: Isolated cross-row orientation shadow audit (NO APK)
on:
  push:
    branches: [test/phone-ocr-single-frame-diagnostic-20261103]
    paths:
      - 'app/src/main/java/com/vobichngan/kanzi/CrossRowOrientationAudit.java'
      - 'scripts/CrossRowOrientationAuditSmokeTest.java'
      - '.github/workflows/cross-row-orientation-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-java-geometry-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run synthetic risk/true-vertical safety regression only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cross-row-classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/cross-row-classes" \
            app/src/main/java/com/vobichngan/kanzi/CrossRowOrientationAudit.java \
            scripts/CrossRowOrientationAuditSmokeTest.java
          java -cp "$RUNNER_TEMP/cross-row-classes" CrossRowOrientationAuditSmokeTest \
            | tee "$RUNNER_TEMP/cross-row-smoke.log"
          grep -q '^CROSS_ROW_ORIENTATION_SHADOW_TEST=PASS assertions=19$' \
            "$RUNNER_TEMP/cross-row-smoke.log"
          echo 'Synthetic pure geometry only: no OCR inference, no user's picture, no app build, no APK.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Explicit hard-negative: true vertical + price-column geometry can false alarm, so no automatic text change.' >> "$GITHUB_STEP_SUMMARY"
