name: Publish verified 0.7.0 test APK as browser download
on:
  # Manual only: publishing must happen after the matching build SHA and both
  # V1/V2 signatures have been verified. Never publish a hard-coded old run.
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit verified build selection
        run: |
          echo "This workflow is intentionally manual. Select/download only an artifact from a successful build whose SHA and V1/V2/certificate checks have been inspected."
          exit 1
