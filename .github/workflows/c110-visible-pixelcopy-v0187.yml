name: Blue Star v1.0.87 C110 Visible Preview PixelCopy
on:
  push:
    branches: [ 'exp/c110-visible-preview-pixelcopy-v0187-20261124' ]
    paths:
      - 'cloud-vision-app/app/**'
      - 'cloud-vision-app/docs/C110_VISIBLE_PIXELCOPY_V0187.md'
      - '.github/workflows/c110-visible-pixelcopy-v0187.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validated-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: cloud-vision-app/third_party/AndroidUSBCamera
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify v1.0.87 exact scope, 1:1 surface ROI, no 2MP resampling and original cloud call
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='7f19414fb9c5b290d18428055dd7f767b606d4cf'
          root='cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/'
          expected={
            '.github/workflows/c110-visible-pixelcopy-v0187.yml',
            'cloud-vision-app/docs/C110_VISIBLE_PIXELCOPY_V0187.md',
            'cloud-vision-app/app/build.gradle',
            'cloud-vision-app/tests/C110ZoomGeometryTest.java',
            *{root+n for n in ['C110FrameReader.java','C110ZoomFrames.java',
                               'C110CameraActivity.java']}
          }
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed==expected,('Unexpected source changes',sorted(changed^expected))
          old=lambda n:subprocess.check_output(
              ['git','show',base+':'+root+n],text=True)
          src=lambda n:Path(root+n).read_text()
          reader=src('C110FrameReader.java')
          zoom=src('C110ZoomFrames.java')
          camera=src('C110CameraActivity.java')
          gradle=Path('cloud-vision-app/app/build.gradle').read_text()
          assert 'PixelCopy.request(video,sourceRect,image,status->' in reader
          assert 'Bitmap.createBitmap(visible.width,visible.height,' in reader
          assert 'new Rect(visible.left,visible.top,' in reader
          assert 'visible.left+visible.width,visible.top+visible.height' in reader
          assert 'C110ZoomFrames.visiblePreviewRegion(surfaceW,surfaceH,' in reader
          assert 'C110ZoomFrames.cropPreviewBitmap(fresh' not in reader
          assert '2_073_600' not in reader
          assert 'Math.sqrt' not in reader
          assert 'if((long)visible.width*visible.height>9_000_000L)' in reader
          assert 'visible.compress(Bitmap.CompressFormat.JPEG,100,bytes)' in reader
          assert 'recognizeJpeg(id,jpeg,started,null,previewDiag)' in reader
          assert 'previewDiag.begin("c110_preview")' in reader
          for phrase in ['"surface_width_px"','"surface_height_px"',
              '"crop_left_px"','"crop_top_px"','"visible_width_px"',
              '"visible_height_px"','"width_px"','"height_px"',
              '"bytes"','"encode_ms"']:
              assert phrase in reader,phrase
          assert 'frameCaptureFeedback.run();' in reader
          assert 'visiblePreviewRegion(int sourceWidth,int sourceHeight,' in zoom
          assert 'C110ZoomGeometry.centeredCover(sourceWidth,sourceHeight' in zoom
          assert 'C110ZoomGeometry.centered(sourceWidth,sourceHeight' in zoom
          assert 'if(region.full(original.getWidth(),original.getHeight()))return original;' in zoom
          assert camera.replace('PixelCopy reads the underlying unscaled Surface. C110FrameReader\n        // now requests just this screen-visible ROI directly, preserving pixels.',
             'PixelCopy reads the underlying unscaled Surface, so C110FrameReader\n        // applies the EXACT same center fraction before cloud upload.')==old('C110CameraActivity.java')
          # Not one line in proven RTSP startup, home Wi-Fi, OEM shutter, TTS,
          # phone Camera2, USB, or cloud protocol modified.
          assert "versionCode 96" in gradle
          assert "versionName '1.0.87-c110-visible-pixelcopy'" in gradle
          assert "applicationIdSuffix '.c110plusquick159'" in gradle
          assert 'org.videolan.android:libvlc-all:3.6.5' in gradle
          assert 'CloudVisionClient.recognize(jpeg,service,task,' in reader
          assert 'photoCloudIo.submit(()->recognizeJpegNetwork(' in reader
          assert 'C110WifiCamera.requireCellular(activity)' in reader
          assert 'if(frameCaptureFeedback!=null)frameCaptureFeedback.run();' in reader
          print('PASS 7-file surgical patch: source Rect->1:1 bitmap, no 2MP predownscale, no duplicate crop')
          print('PASS JPEG Q100 exactly once and byte[] forwarded unchanged to original cloud OCR/TTS')
          print('PASS video/zoom UI/wifi/shutter/mobile/USB unchanged, privacy-limited preview diagnostics')
          PY
      - name: Run vendor allow-list, task and C110 pure Java regressions
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-tests
          javac -d /tmp/bluestar-tests "$BASE/CloudProviderPolicy.java" cloud-vision-app/tests/CloudProviderPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudProviderPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/CloudProviderPolicy.java" "$BASE/CloudThinkingPolicy.java" cloud-vision-app/tests/CloudThinkingPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudThinkingPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/VisionModelCatalog.java" "$BASE/OcrModelCatalog.java" cloud-vision-app/tests/CloudServerListTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudServerListTest
          javac -d /tmp/bluestar-tests "$BASE/VoiceAction.java" cloud-vision-app/tests/VoiceActionSharedTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.VoiceActionSharedTest
          javac -d /tmp/bluestar-tests "$BASE/ProviderKeyReusePolicy.java" cloud-vision-app/tests/ProviderKeyReusePolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.ProviderKeyReusePolicyTest
          javac -d /tmp/bluestar-tests "$BASE/TaskOrder.java" cloud-vision-app/tests/TaskOrderTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.TaskOrderTest
          javac -d /tmp/bluestar-tests "$BASE/FollowupPrompt.java" cloud-vision-app/tests/FollowupPromptTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.FollowupPromptTest
          javac -d /tmp/bluestar-tests "$BASE/C110ZoomGeometry.java" cloud-vision-app/tests/C110ZoomGeometryTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.C110ZoomGeometryTest
          javac -d /tmp/bluestar-tests "$BASE/C110PhotoPolicy.java" cloud-vision-app/tests/C110PhotoPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.C110PhotoPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/OcrLineChunks.java" "$BASE/OcrSpeedExperiment.java" cloud-vision-app/tests/OcrSpeedExperimentTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.OcrSpeedExperimentTest
      - name: Run independent pure-Java phone upload-size tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-phone-upload-tests
          javac -d /tmp/bluestar-phone-upload-tests "$BASE/PhoneStillUploadPolicy.java" cloud-vision-app/tests/PhoneStillUploadPolicyTest.java
          java -cp /tmp/bluestar-phone-upload-tests com.vobich.bluestar.cloudprobe.PhoneStillUploadPolicyTest
      - name: Run C110 1440P toggle and original-byte restoration policy tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-c110-upload-toggle-tests
          javac -d /tmp/bluestar-c110-upload-toggle-tests "$BASE/C110PhotoUploadPolicy.java" cloud-vision-app/tests/C110PhotoUploadPolicyTest.java
          java -cp /tmp/bluestar-c110-upload-toggle-tests com.vobich.bluestar.cloudprobe.C110PhotoUploadPolicyTest
      - name: Pure-Java first pairing and auto-reconnect regression tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-wifi-pair
          javac -d /tmp/bluestar-wifi-pair "$BASE/C110WifiPairingPolicy.java" cloud-vision-app/tests/C110WifiPairingPolicyTest.java
          java -cp /tmp/bluestar-wifi-pair com.vobich.bluestar.cloudprobe.C110WifiPairingPolicyTest
      - name: Apply already-proven pinned UVC patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_usbmonitor.py cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/java/com/jiangdg/usb/USBMonitor.java
          python3 cloud-vision-app/scripts/patch_pinned_uvc.py
          grep -q BSG_CLOUD_RAW5_GATED cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/jni/UVCCamera/UVCPreview.cpp
          grep -q BSG_CLOUD_CLOSE_BARRIER cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/camera/CameraUVC.kt
      - name: Generate unchanged Blue Star launcher assets
        run: |
          set -euo pipefail
          cd cloud-vision-app
          java scripts/GenerateLauncherIcons.java
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-$density/ic_launcher.png"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile full Android arm64 app
        shell: bash
        run: |
          set -euo pipefail
          cd cloud-vision-app
          gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug
      - name: Verify APK actual package, launcher, native libraries, sound and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp cloud-vision-app/app/build/outputs/apk/debug/app-debug.apk out/BlueStar_Guide_C110_Visible_Preview_1.0.87.apk
          APK=out/BlueStar_Guide_C110_Visible_Preview_1.0.87.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          unzip -Z1 "$APK" >out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libUVCCamera.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlc.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlcjni.so' out/entries.txt
          grep -Fxq 'res/raw/c_metal_clack_ding.mp3' out/entries.txt
          grep -Fxq 'res/raw/voice_send_whoosh.wav' out/entries.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" >out/badging.txt
          grep -Fq "package: name='com.vobich.bluestar.c110plusquick159'" out/badging.txt
          grep -Fq "versionName='1.0.87-c110-visible-pixelcopy'" out/badging.txt
          grep -Fq "launchable-activity: name='com.vobich.bluestar.cloudprobe.HomeActivity'" out/badging.txt
          test "$(grep -c '^launchable-activity:' out/badging.txt)" -eq 1
          (cd out && sha256sum BlueStar_Guide_C110_Visible_Preview_1.0.87.apk >SHA256SUMS.txt)
          cat out/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          BYTES=$(stat -c%s "$APK")
          echo "New v1.0.87 APK bytes: $BYTES" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline v1.0.86 APK bytes: 53550575" >> "$GITHUB_STEP_SUMMARY"
          echo "Compared to v1.0.86: $((BYTES-53550575)) bytes (negative means smaller)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: BlueStar_Guide_C110_Visible_Preview_1.0.87
          path: out/*
          retention-days: 14
      - name: Publish ONLY if every test and package verification passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=bluestar-c110-visible-preview-20261124-v0187
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release" >&2
            exit 1
          fi
          gh release create "$TAG" out/BlueStar_Guide_C110_Visible_Preview_1.0.87.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Blue Star v1.0.87 C110 Preview Visible Region PixelCopy" \
            --notes "v1.0.87 C110 Preview What You See: A single PixelCopy(source Rect, target bitmap at 1:1 ROI pixels) captures only the actual center visible/zoomed viewport without the previous 2.07MP full screenshot downscale or second bitmap crop. C110 1x, 2x, 4x and vertical fullscreen reuse the already proven centered/centeredCover zoom geometry; no extra pixel resize or hallucinated offscreen text. JPEG quality 100 once (JPEG remains lossy by definition), forwarded byte-for-byte to the unchanged cloud OCR, models and TTS. Privacy-limited c110_preview diagnostic now records Surface dimensions, crop rectangle, final visible JPEG width/height/bytes, encoding and cloud timing. Original C110 1001 shutter+JPEG, LibVLC3.6.5 playback, Wi-Fi pairing, phone Camera2, USB, feedback tones, and all other settings are preserved. Exact seven-file diff, pure-Java geometry tests across 1x/2x/4x and portrait, cloud/provider/USB/Wi-Fi regressions, full Gradle ARM64 APK, launcher/native libs/ding resource/SHA256 verified. Device QA still required to confirm actual SurfaceView scaling and OCR accuracy; do not uninstall existing APK, cover-install to keep keys and camera pairing."
