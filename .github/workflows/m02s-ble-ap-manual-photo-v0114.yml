name: Blue Star M02S BLE AP Startup Manual Shutter Wi-Fi AutoFetch v0.1.14
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-ble-ap-manual-shutter-autofetch-v0114-20261114']
    paths:
      - 'experiments/m02s-wifi-only-lab/**'
      - '.github/workflows/m02s-ble-ap-manual-photo-v0114.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify exact BLE AP-only command; unit tests and build
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=experiments/m02s-wifi-only-lab/app/src/main/java
          WIRE="$SOURCE/com/vobichngan/bluestar/m02slab/M02sApWire.java"
          grep -Fq '0x39, 0x30, 0x69' "$WIRE"
          grep -Fq 'Arrays.equals(AP_REQUEST, bytes)' "$WIRE"
          if grep -R -E 'M02sBleWire[.]photoThumbnail|e09BlePhoto[(]|[.]removeFile[(]|DELETE_MEDIA' "$SOURCE" ; then
            echo 'Unauthorized shutter/erase API in one-time AP starter' >&2
            exit 1
          fi
          gradle -p experiments/m02s-wifi-only-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify manifest, standalone APK signing and package
        shell: bash
        run: |
          set -euo pipefail
          APK=experiments/m02s-wifi-only-lab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02sbleapmanual' versionCode='15' versionName='0.1.14'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          for p in BLUETOOTH_SCAN BLUETOOTH_CONNECT ACCESS_NETWORK_STATE ACCESS_WIFI_STATE CHANGE_NETWORK_STATE CHANGE_WIFI_STATE NEARBY_WIFI_DEVICES ACCESS_FINE_LOCATION INTERNET; do
            grep -q "android.permission.${p}" "$RUNNER_TEMP/permissions.txt"
          done
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or photo storage permission' >&2
            exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_BLE_AP_ManualShutter_WiFi_0.1.14_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload standalone signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-BLE-AP-ManualPhoto-v0114-APK
          path: release/BlueStar_M02S_BLE_AP_ManualShutter_WiFi_0.1.14_Android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable browser download URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.txt" <<'EOF'
          M02S v0.1.14 independent experiment: manual physical shutter with automatic full-resolution photo download via Wi-Fi. User confirmed M02S has no separate Wi-Fi enable button; the pure-Wi-Fi v0.1.13 therefore cannot initiate the glasses AP. This version reuses the already successfully tested OEM one-time Bluetooth AA13 0x39/0x30 AP startup, AA14 0x25 target SSID, fresh AP scan, and Android16 local-only WifiNetworkSpecifier connection to the exact BLE-confirmed AP. It DOES NOT contain/send any BLE shutter or photo-transfer commands. The user presses the glasses shutter manually after pre-shot baseline setup; then app polls read-only original OEM /app/getfilelist at about 450ms, requires a newly added filename and two stable snapshots, then HTTP GETs the full JPEG via the exact verified Network into RAM. Supports three sequential shots/120s. No cloud, no file/gallery write, no media delete or firmware update, no unsolicited repeat BLE commands or AP retries. Logs do not include SSID, passwords, device MAC, photo filenames or photo bytes.
          The original M02S v0.1.10 test already returned real 3200x2400 JPEGs (HTTP 475~758ms), but it has NOT proven that the eyewear permits physical shutter while AP mode remains active. This is precisely the question for this APK. 3 seconds is a target only; timing from the physical button cannot be observed by the app without a BLE shutter notification, which it intentionally does not use for photo control. If this AP/physical shutter conflicts at firmware level, it may be impossible to fix by software. No OCR/TTS included in this transportation experiment.
          The work follows previously verified Android code and cross-checks the public MIT project sctg-development/ai-smart-glasses-e09-reverse (WifiMediaManager.swift, Constants.swift). Attribution retained in experiments/m02s-wifi-only-lab/E09_SOURCE_LICENSE.md. Separate app com.vobichngan.bluestar.m02sbleapmanual versionName0.1.14 versionCode15; official Blue Star Guide RC25, old v0.1.12/v0.1.13, Windows OCR, and original HeyCyan untouched.
          EOF
          gh release create bluestar-m02s-ble-ap-manualphoto-v0114-20261114 \
            release/BlueStar_M02S_BLE_AP_ManualShutter_WiFi_0.1.14_Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S BLE AP Startup + Manual Shutter Wi-Fi Photo v0.1.14 — experimental" \
            --prerelease --notes-file "$RUNNER_TEMP/release-notes.txt"
      - name: Verify release published and downloadable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view bluestar-m02s-ble-ap-manualphoto-v0114-20261114 \
            --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
