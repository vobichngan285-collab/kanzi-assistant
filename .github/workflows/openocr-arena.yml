name: BlueStar OpenOCR Adaptive
on:
  push:
    branches: [exp/openocr-adaptive-20261126]
    paths: ['openocr-lab/**','.github/workflows/openocr-arena.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reuse exact Arena v0.2.0 assets and validate
        run: |
          set -euo pipefail
          BASE=https://github.com/vobichngan285-collab/kanzi-assistant/releases/download/bluestar-openocr-arena-v020-20261126
          for f in BlueStar_OpenOCR_Arena_0.2.0.apk arena-assets.sha256 openocr-report.json OpenOCR-LICENSE.txt YOLO-LICENSE.txt; do curl -fL --retry 3 "$BASE/$f" -o "$f"; done
          echo '110073c1420e1e4717f772322e310bd1a74eca1245e4bf2a16dfd58fb6f3a364  BlueStar_OpenOCR_Arena_0.2.0.apk' | sha256sum -c -
          echo '0d3c036f062b35849bf7d8d87798cd6cff7c70ee4780651814718bd3c6e062e5  arena-assets.sha256' | sha256sum -c -
          echo 'f1d36ed055b95ffdc61f42dd9553907e5dd945030d0eae3b42d4ed8e69fc41a1  openocr-report.json' | sha256sum -c -
          echo 'c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4  OpenOCR-LICENSE.txt' | sha256sum -c -
          echo '0d96a4ff68ad6d4b6f1f30f713b18d5184912ba8dd389f86aa7710db079abcb0  YOLO-LICENSE.txt' | sha256sum -c -
          mkdir -p openocr-lab/app/src/main/assets
          for m in rep.onnx yolo26n-text.onnx repvit-db.onnx chars.txt; do unzip -p BlueStar_OpenOCR_Arena_0.2.0.apk "assets/$m" > "openocr-lab/app/src/main/assets/$m"; done
          mv arena-assets.sha256 original-assets.sha256
          grep -E '  (rep\.onnx|yolo26n-text\.onnx|repvit-db\.onnx|chars\.txt)$' original-assets.sha256 > arena-assets.sha256
          test "$(wc -l < arena-assets.sha256)" = 4
          (cd openocr-lab/app/src/main/assets && sha256sum -c ../../../../../arena-assets.sha256)
          python -m pip install onnxruntime==1.22.0 numpy
          python openocr-lab/arena_validate.py
      - name: Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build offline APK
        working-directory: openocr-lab
        run: gradle --no-daemon --max-workers=2 :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify and package
        run: |
          set -euo pipefail
          APK=openocr-lab/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | tee badging.txt
          grep -F "package: name='com.vobich.bluestar.openocrlab.adaptive' versionCode='8' versionName='0.3.0'" badging.txt
          ! grep -F android.permission.INTERNET badging.txt
          unzip -Z1 "$APK" > archive.txt
          grep -Fx lib/arm64-v8a/libonnxruntime.so archive.txt
          ! grep -E '^lib/(x86|x86_64|armeabi-v7a)/' archive.txt
          for m in rep; do unzip -p "$APK" "assets/$m.onnx" | sha256sum | grep -F "$(jq -r --arg m "$m" '.[$m].onnx_sha256' openocr-report.json)"; done
          unzip -p "$APK" assets/yolo26n-text.onnx | sha256sum | grep -F "$(jq -r .detector_sha256 openocr-report.json)"
          unzip -p "$APK" assets/chars.txt | sha256sum | grep -F "$(jq -r .dict_sha256 openocr-report.json)"
          ! grep -Fx assets/svtr.onnx archive.txt
          while read -r hash file; do unzip -p "$APK" "assets/$file" | sha256sum | grep -F "$hash"; done < arena-assets.sha256
          mkdir -p release
          cp "$APK" release/BlueStar_OpenOCR_Adaptive_0.3.0.apk
          cp openocr-lab/README.md openocr-report.json release/
          cp OpenOCR-LICENSE.txt YOLO-LICENSE.txt arena-assets.sha256 arena-validation.json release/
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: openocr-arena
          path: release/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openocr-arena
          path: release
      - name: Publish verified experiment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS.txt)
          TAG=bluestar-openocr-adaptive-v030-20261126
          if ! gh release view "$TAG" >/dev/null 2>&1; then gh release create "$TAG" --target "$GITHUB_SHA" --title "蓝星 OpenOCR 自适应裁剪 v0.3.0" --notes-file release/README.md --prerelease --draft; fi
          gh release view "$TAG" --json targetCommitish | jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha'
          for i in 1 2 3; do gh release upload "$TAG" release/* --clobber && break; test "$i" != 3; sleep 5; done
          gh release edit "$TAG" --draft=false --prerelease
