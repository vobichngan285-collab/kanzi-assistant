name: Blue Star M02S Fresh AP Scan and Failure Reason Lab v0.1.10
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-ap-freshscan-failurecode-v0110-20261114']
    paths:
      - 'experiments/m02s-wifi-lab/**'
      - '.github/workflows/m02s-wifi-hold-lab.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and standalone Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p experiments/m02s-wifi-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify independent APK, permissions, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="experiments/m02s-wifi-lab/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02sapreadylab' versionCode='11' versionName='0.1.10'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.BLUETOOTH_SCAN' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.NEARBY_WIFI_DEVICES' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_WIFI_STATE' "$RUNNER_TEMP/permissions.txt"
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or media access in transport-only lab' >&2; exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_AP_FreshScan_0.1.10_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-FreshAP-v0110-APK
          path: release/BlueStar_M02S_AP_FreshScan_0.1.10_Android.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct-browser APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/note.txt" <<'EOF'
          Blue Star M02S fresh Wi-Fi scan after BLE shutter, Android16 local-only network failure reason experiment v0.1.10.
          Verified baseline: v0.1.3 BLE camera shutter, v0.1.5/v0.1.6 Android AP target onAvailable and real private gateway, HTTP200 JSON photo list and 3200x2400 JPEG original downloaded in 532ms. v0.1.8 real shutter but AP onUnavailable; v0.1.9 real shutter and unique matching recent AP scan, BSSID-pinned request then immediate SSID-only retry both onUnavailable, neither reaching photo GET.
          Fixes: no longer mistake pre-AP-request cached scan timestamps (even <30 seconds old) for a newly visible hotspot. After BLE 0x25 target SSID, request one Android foreground Wi-Fi scan, observe SCAN_RESULTS_AVAILABLE_ACTION/EXTRA_RESULTS_UPDATED, compare ScanResult.timestamp elapsed microseconds to the request timestamp, require exact SSID and valid unique BSSID. Wait 1.8 sec after first freshly observed target then submit only ONE previously successful SSID-only WPA2 local-only network request. If Android cannot provide evidence of a new target scan within 12sec, stop with an explicit diagnostic instead of blindly connecting. Fresh beacon existence does not guarantee AP is accepting clients.
          On Android14+/Android16, register WifiManager.LocalOnlyConnectionFailureListener to capture specific failure reason (association/authentication/IP provisioning/not found/no response/user reject/unknown) while retaining ConnectivityManager NetworkCallback onAvailable and onUnavailable. A one-second grace period allows late error details before shutdown. Never blindly retry immediately, re-shoot, or make up vendor Wi-Fi/firmware commands. Never copy unsupported interpretations of AA14 0x42, 0x45 or 0x53.
          Reuses the same single BLE 0x22/0x30 shutter, 5-second BLE command interval, verified official 0x39/0x30 and 0x25 SSID handling, original AP-only photo GET and memory preview. First latest photo has no pre-shot baseline and requires user to verify the scene. No passwords/SSIDs/BSSIDs/photos/paths in logs, no cloud/media writes/deletes/firmware changes.
          Separate installable package com.vobichngan.bluestar.m02sapreadylab v0.1.10; original RC25, Windows OCR, HeyCyan, earlier experiment releases remain unchanged. CI unit tests, Android build, permission and signing checks do not prove real eyewear success. The goal of permanent low-latency BLE+Wi-Fi co-existence is not yet verified.
          EOF
          gh release create bluestar-m02s-ap-freshscan-v0110-20261114 \
            release/BlueStar_M02S_AP_FreshScan_0.1.10_Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S Fresh AP Scan and Failure Reason v0.1.10 — independent experiment" \
            --prerelease --notes-file "$RUNNER_TEMP/note.txt"
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bluestar-m02s-ap-freshscan-v0110-20261114 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
