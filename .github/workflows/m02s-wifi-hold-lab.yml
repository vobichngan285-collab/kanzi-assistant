name: Blue Star M02S AP Permission Fix Lab v0.1.5
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-ap-permission-fix-v015-20261114']
    paths:
      - 'experiments/m02s-wifi-lab/**'
      - '.github/workflows/m02s-wifi-hold-lab.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and standalone Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p experiments/m02s-wifi-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify independent APK, permissions, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="experiments/m02s-wifi-lab/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02sapfixlab' versionCode='6' versionName='0.1.5'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.BLUETOOTH_SCAN' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.NEARBY_WIFI_DEVICES' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_WIFI_STATE' "$RUNNER_TEMP/permissions.txt"
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or media access in transport-only lab' >&2; exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_AP_Permission_Fix_0.1.5_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-ApPermissionFix-v015-APK
          path: release/BlueStar_M02S_AP_Permission_Fix_0.1.5_Android.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct-browser APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/note.txt" <<'EOF'
          Blue Star M02S AP Permission Fix Lab v0.1.5 — independent Android 16 test APK.
          Real vivo X200 Pro v0.1.4 log: BLE LE 1M, AA13 0x39/0x30 AP request and AA14 0x25 SSID UTF-8 parsing all succeeded, but Android request of a dedicated AP Wi-Fi network threw SecurityException before any network approval dialog.
          Root-cause candidate: previous manifest omitted the normal permission android.permission.CHANGE_NETWORK_STATE, which is required for ConnectivityManager.requestNetwork. Added permission; CI checks installed APK declaration. Also checks network state, Wi-Fi state and existing Bluetooth/Wi-Fi permissions.
          AP request now records three stages (construct WifiNetworkSpecifier, construct NetworkRequest, invoke requestNetwork) plus manifest-grant status. On SecurityException or argument/state failure, log sanitized stage and exception class ONLY; NEVER include Android/OEM exception message, SSID or passphrase. Added unit tests for diagnostic stage reporting and privacy.
          Reuses verified original BLE GATT handshake, AA14 notification, 0x25 SSID in-memory decoding and unique P2P target matching; no speculative writes, repeat scans, photo download or uploading. Formal Blue Star Guide, HeyCyan APK and earlier v0.1.0-v0.1.4 labs left untouched.
          Brand-new package com.vobichngan.bluestar.m02sapfixlab for side-by-side installation. Android 16 AP connection, approval dialog, network IP and HTTP remain UNTESTED until the user performs a genuine phone test. CI success proves compile, JUnit, permissions, signature and release only.
          EOF
          gh release create bluestar-m02s-ap-permission-fix-v015-20261114 \
            release/BlueStar_M02S_AP_Permission_Fix_0.1.5_Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S AP Permission Fix Lab v0.1.5 — Android 16 requestNetwork permission" \
            --prerelease --notes-file "$RUNNER_TEMP/note.txt"
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bluestar-m02s-ap-permission-fix-v015-20261114 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
