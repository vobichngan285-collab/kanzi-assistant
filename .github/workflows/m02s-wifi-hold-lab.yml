name: Blue Star M02S BLE Protocol Observer v0.1.2
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-ble-protocol-lab-20261114']
    paths:
      - 'experiments/m02s-wifi-lab/**'
      - '.github/workflows/m02s-wifi-hold-lab.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and standalone Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p experiments/m02s-wifi-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify independent APK, permissions, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="experiments/m02s-wifi-lab/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02sprotolab' versionCode='3' versionName='0.1.2'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.BLUETOOTH_SCAN' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.NEARBY_WIFI_DEVICES' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or media access in transport-only lab' >&2; exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_BLE_Protocol_Lab_0.1.2_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-BleProtocol-v012-APK
          path: release/BlueStar_M02S_BLE_Protocol_Lab_0.1.2_Android.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct-browser APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/note.txt" <<'EOF'
          Blue Star M02S BLE Protocol Observer v0.1.2 — independent Android 16 test APK.
          The user's actual M02S BLE connection succeeded in 112ms (status=0,newState=2), discovering AE00 and AA12 vendor services. This isolated lab retains the already validated explicit LE 1M connect behavior.
          Lists UUIDs, properties and descriptors for vendor AE00 and AA12 service characteristics without reading values. With explicit button press it enables notifications/indications ONLY through the standard Bluetooth CCCD descriptor (0x2902), sequentially one at a time with 5s callback timeout, then logs up to 40 BLE notifications for 60 seconds with capped 20-byte hexadecimal previews. Use glasses physical shutter once during listening to identify unsolicited status updates. Notification content may contain sensitive device data; review before sharing logs.
          Never writes vendor-specific control characteristic, never sends guessed shutter or Wi-Fi wake commands, and does not upload/download images or alter eyewear firmware. Runtime GATT success and actual notification values require vivo X200 Pro device test.
          Unique new package ID (com.vobichngan.bluestar.m02sprotolab) preserves both prior experiments and formal Blue Star Guide; the untouched original HeyCyan APK is not modified. Existing nonessential Wi-Fi diagnostic controls retained.
          APK static comparison: user-provided official app includes 0000ae00/ae01/ae02 and 0000aa12/aa13 UUID strings, but their purpose and M02S-specific command payloads are NOT yet proven. No speculative commands are sent.
          EOF
          gh release create bluestar-m02s-ble-protocol-v012-20261114 \
            release/BlueStar_M02S_BLE_Protocol_Lab_0.1.2_Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S BLE Protocol Lab v0.1.2 — AE00 AA12 notification listening" \
            --prerelease --notes-file "$RUNNER_TEMP/note.txt"
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bluestar-m02s-ble-protocol-v012-20261114 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
