name: Blue Star M02S Original Photo Verification Lab v0.1.6
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-photo-direct-download-v016-20261114']
    paths:
      - 'experiments/m02s-wifi-lab/**'
      - '.github/workflows/m02s-wifi-hold-lab.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and standalone Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p experiments/m02s-wifi-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify independent APK, permissions, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="experiments/m02s-wifi-lab/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02sphotolab' versionCode='7' versionName='0.1.6'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.BLUETOOTH_SCAN' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.NEARBY_WIFI_DEVICES' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_WIFI_STATE' "$RUNNER_TEMP/permissions.txt"
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or media access in transport-only lab' >&2; exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_Photo_Verification_0.1.6_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-PhotoVerify-v016-APK
          path: release/BlueStar_M02S_Photo_Verification_0.1.6_Android.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct-browser APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/note.txt" <<'EOF'
          Blue Star M02S Original Photo Verification Lab v0.1.6 — independent Android 16 experiment.
          User physically confirmed M02S BLE shutter, AA14 0x25 SSID, Android AP Wi-Fi onAvailable and private gateway, then GET /app/getfilelist HTTP 200 in 99 ms, 635 bytes. Sixteen further GET requests all returned HTTP 200 (29-278 ms). A 63-second gap occurred when app was backgrounded, so uninterrupted 120-second interval polling is not proven.
          Real OEM HeyCyan v1.0.24-c APK DEX traced: AP file list uses GET /app/getfilelist and PhotoApBean.info[].files[] JSON fields name/size/createtimestr/type; legacy P2P instead parses XML and is not used. OEM AP original image download uses root URL + FileItem.name, thumbnail is a separate /app/getthumbnail?file= endpoint and not required for this experiment. This APK only tests one original image at a time, never sends fileDownloadFinish or disconnect commands.
          New button to parse AP JSON list; one-shot auto-download of latest photo only if latest is unambiguous using trustworthy parsed timestamps or a sole candidate. If the timestamps are missing or tied, only explicit user selection of an anonymously numbered candidate can trigger one download. No guessed list ordering.
          Remote URL is constrained to the verified AP Network and its actual private gateway (no fallback network, no redirects). Filenames must be safe relative image paths, and HTTP requests are read-only GET. Maximum JSON size 256 KiB; maximum image 32 MiB; check JPEG/PNG/WebP magic and extension match, limit decoded dimensions, show preview in RAM. No media library writes, cloud upload, photo deletion, firmware change, or automatic Wi-Fi disconnect.
          New independent appId com.vobichngan.bluestar.m02sphotolab, keeps formal Blue Star Guide RC25, HeyCyan and all prior v0.1.x labs untouched.
          NOTE: Actual original-photo download has not been tested on physical glasses yet, so only the Android build, local tests and integrity checks are validated by CI. User must still supply real photo-list schema / HTTP results.
          EOF
          gh release create bluestar-m02s-photo-verification-v016-20261114 \
            release/BlueStar_M02S_Photo_Verification_0.1.6_Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S Original Photo Verification v0.1.6 — AP file list and one-photo RAM preview" \
            --prerelease --notes-file "$RUNNER_TEMP/note.txt"
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bluestar-m02s-photo-verification-v016-20261114 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
