name: Blue Star M02S OEM AP Scan Recovery Lab v0.1.9
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-oem-ap-scan-recovery-v019-20261114']
    paths:
      - 'experiments/m02s-wifi-lab/**'
      - '.github/workflows/m02s-wifi-hold-lab.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and standalone Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p experiments/m02s-wifi-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify independent APK, permissions, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="experiments/m02s-wifi-lab/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02soemaplab' versionCode='10' versionName='0.1.9'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.BLUETOOTH_SCAN' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.NEARBY_WIFI_DEVICES' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_WIFI_STATE' "$RUNNER_TEMP/permissions.txt"
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or media access in transport-only lab' >&2; exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_OEM_AP_Recovery_0.1.9_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-OEM-AP-v019-APK
          path: release/BlueStar_M02S_OEM_AP_Recovery_0.1.9_Android.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct-browser APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/note.txt" <<'EOF'
          Blue Star M02S OEM-style AP scan and limited connection recovery experiment v0.1.9, independent Android16 app.
          Verified baselines: v0.1.3 real BLE shutter, v0.1.5/0.1.6 real target AP onAvailable+private gateway, original JPEG 3200x2400 / 481424B / 532ms. v0.1.8 real shutter with photo responses 0x22 and 0x42, then repeated Android onUnavailable within 5-6s, no image download. Avoid revisiting successful photo and HTTP tests.
          Based on user-provided HeyCyan v1.0.24-c APK static analysis: OEM Lxxh performs target scan, scan stability/wait, optional BSSID pinning, and already-connected target handling. v0.1.9 implements a minimal, independent scan/preflight flow instead of copying the entire OEM application. Exact BLE-confirmed SSID only; read Wi-Fi scan results from foreground, reject scans older than 30s; select a unique BSSID only if the exact target is found; when ambiguous/unavailable fall back to the v0.1.6 verified SSID-only WifiNetworkSpecifier request; reuse an already-connected exact target Wi-Fi Network only with verified private gateway. On Android onUnavailable, scan up to 6s and allow at most one different BSSID/SSID-only retry only if the unique exact target is freshly visible. No unbounded retry or repeat shutter. Log only counts, callback stage and strategies; SSID/BSSID, passwords and photos never logged.
          Reuses intact original BLE 0x22/0x30, 0x39/0x30 and 0x25 parsing, user-confirmed dedicated AP-only HTTP GET, fresh-file selection and in-memory original-image preview. First post-shot latest image remains unverified without pre-shot baseline; user must inspect the scene. AP release on completion is only phone-side; eyewear mode reset is not proven.
          Separate package com.vobichngan.bluestar.m02soemaplab. No camera/media storage permissions, cloud calls, unknown firmware commands, photos written, or changes to formal Blue Star Guide RC25, Windows OCR, HeyCyan or old v0.1.3-v0.1.8 packages/releases.
          CI tests/APK compile/zipalign/v2-signature, package/version/permissions, release asset publication. Actual phone test is still REQUIRED; this version makes no claims of fully solved AP state or always-on Wi-Fi.
          EOF
          gh release create bluestar-m02s-oem-ap-recovery-v019-20261114 \
            release/BlueStar_M02S_OEM_AP_Recovery_0.1.9_Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S OEM-Style AP Scan Recovery v0.1.9 — independent experiment" \
            --prerelease --notes-file "$RUNNER_TEMP/note.txt"
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bluestar-m02s-oem-ap-recovery-v019-20261114 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
