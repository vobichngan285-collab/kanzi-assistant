name: Blue Star M02S One-Click Capture & Fetch Lab v0.1.7
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-oneclick-shot-fetch-v017-20261114']
    paths:
      - 'experiments/m02s-wifi-lab/**'
      - '.github/workflows/m02s-wifi-hold-lab.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and standalone Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p experiments/m02s-wifi-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify independent APK, permissions, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="experiments/m02s-wifi-lab/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02soneclicklab' versionCode='8' versionName='0.1.7'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.BLUETOOTH_SCAN' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.NEARBY_WIFI_DEVICES' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_WIFI_STATE' "$RUNNER_TEMP/permissions.txt"
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or media access in transport-only lab' >&2; exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_OneClick_Capture_0.1.7_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-OneClick-v017-APK
          path: release/BlueStar_M02S_OneClick_Capture_0.1.7_Android.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct-browser APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/note.txt" <<'EOF'
          Blue Star M02S One-Click Capture & Fetch Lab v0.1.7 — standalone Android 16 experiment.
          The user's v0.1.6 vivo X200 Pro + M02S-3584 real-world success: BLE LE1M 85ms, OEM AP Wi-Fi command 0x39/0x30 and SSID 0x25, Android onAvailable + actual private gateway, AP JSON /app/getfilelist parsed 5 eligible photos, and an unambiguous newest JPEG successfully downloaded: HTTP 200, 481424 bytes, original 3200x2400, 532ms, rendered in memory. This verified download is not yet an automated capture-fetch cycle.
          This v0.1.7 adds a single button used only after BLE+AP are connected. It reads a pre-shot AP JSON file list snapshot, subscribes AA14 if the monitor has expired, sends the previously verified *one* OEM remote-shutter frame 0x22/0x30 via GATT AA13 (5-second cooldown; no repeat if uncertain), and only after successful GATT write acknowledgement checks the local AP list for a filename absent from the pre-shot snapshot. It rejects unchanged old photos and ambiguous multiple fresh files. New image file size must be positive and identical across two consecutive list observations; then it reuses the verified local-only HTTP original-image download and in-RAM preview. Polling has a 45-second elapsed-time deadline; user can cancel, and Wi-Fi loss or BLE disconnection aborts. BLE success alone cannot be claimed as photo capture, and AP is not reconnected unnecessarily.
          All list/photo HTTP GETs are pinned to the known verified dedicated AP Android Network and private actual gateway; no redirects/guessed URLs. Strict filename constraints, 256KB list/32MB original-photo caps, JPEG/PNG/WebP signature+extension/dimension checks. Zero media file writes, photo uploads, firmware commands, OEM download-finish commands or auto Wi-Fi shutdowns. Names/timestamps/SSID/secret/raw data are not logged; diagnostics contain only anonymized counts and status. Existing v0.1.6 manual list/photo controls remain.
          Independent package com.vobichngan.bluestar.m02soneclicklab. Formal Blue Star Guide RC25, OEM HeyCyan, Windows OCR, and v0.1.0-v0.1.6 experimental code/release remain untouched.
          CI unit tests (including new fresh-file/no-old-photo/stability policy), Android SDK36 build, APK package and permissions checks, v2 signature, zipalign, archive integrity and prerelease asset publication. CI cannot prove end-to-end real shutter + new photo: physical user test is required.
          EOF
          gh release create bluestar-m02s-oneclick-capture-v017-20261114 \
            release/BlueStar_M02S_OneClick_Capture_0.1.7_Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S One-Click Capture & Fetch Lab v0.1.7 — verified fresh photo only" \
            --prerelease --notes-file "$RUNNER_TEMP/note.txt"
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bluestar-m02s-oneclick-capture-v017-20261114 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
