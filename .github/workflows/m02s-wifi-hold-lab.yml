name: Blue Star M02S Target WiFi Connector Lab v0.1.4
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-wifi-target-connect-v014-20261114']
    paths:
      - 'experiments/m02s-wifi-lab/**'
      - '.github/workflows/m02s-wifi-hold-lab.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and standalone Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p experiments/m02s-wifi-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify independent APK, permissions, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="experiments/m02s-wifi-lab/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02swifitargetlab' versionCode='5' versionName='0.1.4'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.BLUETOOTH_SCAN' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.NEARBY_WIFI_DEVICES' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or media access in transport-only lab' >&2; exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_Target_WiFi_0.1.4_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-TargetWifi-v014-APK
          path: release/BlueStar_M02S_Target_WiFi_0.1.4_Android.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct-browser APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/note.txt" <<'EOF'
          Blue Star M02S Target Wi-Fi Connector Lab v0.1.4 — independent Android APK.
          Based on real vivo X200 Pro GATT success, remote M02S shutter success, and one 0x25 payload after a verified OEM 0x39 Wi-Fi request. A previous Wi-Fi Direct discovery result was an unrelated HP printer, NOT eyewear.
          Re-opened the user's official HeyCyan APK v1.0.24-c and verified OEM decoding: AA14 0x25 payload goes via WifiCmdBean.recoverByBytes, which converts all payload bytes into an UTF-8 SSID; response listener then chooses AP or P2P based on CustomerCmdBean.project contains 'T' (project value not yet available for user's M02S). Original P2P matching checks deviceName.contains(ssid); original AP path uses Android Wi-Fi request for target SSID with a vendor-default pairing passphrase.
          Explicit buttons select ONE path (P2P or AP), sending only previously confirmed OEM 0x39/0x31 or 0x39/0x30 bytes. On checksum-valid AA14 0x25, decode target SSID in memory only. P2P discovery filters by actual SSID and refuses unrelated devices or ambiguous multiple matches; groupFormed + phone not group owner + valid private group-owner IP are needed before treating it as linked. AP requests the exact SSID via Android WifiNetworkSpecifier and requires Android user approval; only onAvailable means AP connection, and local gateway is derived from actual link routes, not guessed.
          SSID and pairing secret are never added to log, clipboard, or persistent storage. HTTP file-list probes are strictly disabled until target Wi-Fi connection and private device address are confirmed. Read-only fingerprint/size probes; no photo download, media permission, cloud upload, file deletion, firmware update, or automatic retries. Wi-Fi scans/requests do not auto-fallback to the other mode.
          New independent app package com.vobichngan.bluestar.m02swifitargetlab and branch. Formal Blue Star Guide RC25, OEM APK, v0.1.0-v0.1.3 labs and Windows OCR are untouched.
          Real Android 16 AP/P2P Wi-Fi connection, exact SSID, device HTTP server and link persistence still require the user's real-device testing; GitHub Actions success only proves compile, tests, APK integrity, signature and release publication.
          EOF
          gh release create bluestar-m02s-target-wifi-v014-20261114 \
            release/BlueStar_M02S_Target_WiFi_0.1.4_Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S Target Wi-Fi Lab v0.1.4 — SSID-matched P2P/AP connection" \
            --prerelease --notes-file "$RUNNER_TEMP/note.txt"
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bluestar-m02s-target-wifi-v014-20261114 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
