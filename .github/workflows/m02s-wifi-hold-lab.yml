name: Blue Star M02S E09 BLE JPEG and RTSP Lab v0.1.11
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-e09-ble-photo-rtsp-v0111-20261114']
    paths:
      - 'experiments/m02s-wifi-lab/**'
      - '.github/workflows/m02s-wifi-hold-lab.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and standalone Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p experiments/m02s-wifi-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify independent APK, permissions, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="experiments/m02s-wifi-lab/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02se09lab' versionCode='12' versionName='0.1.11'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.BLUETOOTH_SCAN' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.NEARBY_WIFI_DEVICES' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_WIFI_STATE' "$RUNNER_TEMP/permissions.txt"
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or media access in transport-only lab' >&2; exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_E09_BLE_RTSP_0.1.11_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-E09-BLE-RTSP-v0111-APK
          path: release/BlueStar_M02S_E09_BLE_RTSP_0.1.11_Android.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct-browser APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/note.txt" <<'EOF'
          Blue Star M02S v0.1.11 independent protocol experiment using upstream MIT-licensed Eyevue E09 reverse engineering project.
          Original upstream: https://github.com/sctg-development/ai-smart-glasses-e09-reverse (MIT / Ronan Le Meillat / SCTG Development), source LICENSE retained in experiments/m02s-wifi-lab/E09_SOURCE_LICENSE.md.
          Directly adapted upstream BleProbe.swift AA15 photo frames: TAKE_PHOTO 0x22/0x31 and AA15 0x52 0x58 start 0x97, offset-indexed chunk 0x98, end 0x99. Android assembler validates JPEG SOI/EOI and contiguous bytes, max 2MB/15 sec, in-memory Bitmap preview only; original E09 hardware often returns small ~12KB preview, not confirmed with M02S.
          Directly adapted upstream AdditionalValidations.swift APP_LIVE(0x67/0x30), BLE Wi-Fi SSID reply 0x25, and documented RTSP /h264. Android only connects to exact BLE-confirmed AP, verified Android Network and real private gateway. Probe RTSP OPTIONS and DESCRIBE using only Network socket; optional Android MediaPlayer SurfaceView playback uses temporary per-process Network binding and restores on stop.
          Independent explicitly user-triggered NON-DELETING end-transfer command (0x44/0x30/0x01) matches upstream Constants.swift; destructive variant (0x44/0x30/0x00) is NEVER allowed by exact command whitelist. No OTA. No automatic repetitive probes/photo. No files/photo/SSID/password logged, saved, uploaded, or deleted. Existing v0.1.10 once-successful shot -> AP -> original photo pipeline remains untouched as fallback, not used to misrepresent E09 features.
          The E09 reverse engineering is for different physical glasses; matching AA12/AA13/AA14/AA15 services and /app/getfilelist does NOT establish that M02S supports high-quality BLE photo, APP_LIVE, or the non-deleting finish effect. Fresh APK is a compatibility experiment, not a claim of low-latency video success. Fully separate package com.vobichngan.bluestar.m02se09lab, v0.1.11, old experiment APKs/Releases, official HeyCyan, Blue Star Guide RC25 and Windows OCR untouched.
          EOF
          gh release create bluestar-m02s-e09-ble-rtsp-v0111-20261114 \
            release/BlueStar_M02S_E09_BLE_RTSP_0.1.11_Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S E09 BLE Photo and RTSP v0.1.11 — open-source-based experiment" \
            --prerelease --notes-file "$RUNNER_TEMP/note.txt"
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bluestar-m02s-e09-ble-rtsp-v0111-20261114 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
