name: Blue Star M02S BLE-First AP-Fetch Lab v0.1.8
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-ble-first-ap-fetch-v018-20261114']
    paths:
      - 'experiments/m02s-wifi-lab/**'
      - '.github/workflows/m02s-wifi-hold-lab.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and standalone Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p experiments/m02s-wifi-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify independent APK, permissions, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="experiments/m02s-wifi-lab/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02sblefirstlab' versionCode='9' versionName='0.1.8'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.BLUETOOTH_SCAN' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.NEARBY_WIFI_DEVICES' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_WIFI_STATE' "$RUNNER_TEMP/permissions.txt"
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or media access in transport-only lab' >&2; exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_BLE_First_AP_Fetch_0.1.8_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-BLE-First-v018-APK
          path: release/BlueStar_M02S_BLE_First_AP_Fetch_0.1.8_Android.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct-browser APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/note.txt" <<'EOF'
          Blue Star M02S BLE-first capture → AP-fetch experiment v0.1.8 for Android 16, independent standalone package.
          Verified device baselines: v0.1.3 BLE AA13 0x22/0x30 produced real shutter sound and 0x22/0x42 response; v0.1.6 successfully parsed the AP photo list and downloaded/displayed an original 3200x2400 JPEG (481424B, 532ms). User observed v0.1.7 preconnected-AP shot made no sound and no new photo appeared in 45s; specific causal reason is still unproven.
          v0.1.8 starts with BLE/AA14 and requires no active app AP session, sends the verified shutter frame once, separately captures prioritized 0x22/0x42 photo-related notifications even after generic notification log throttling, waits at least 5s between BLE writes, then sends verified 0x39/0x30 to request AP information, connects by exact decoded SSID using WifiNetworkSpecifier and the Android-confirmed dedicated Network and real private gateway, checks official /app/getfilelist twice for stable candidate, and fetches one original image into RAM. Auto-releases the phone AP Network request after completion/cancel; eyewear may remain in AP mode and physical follow-up testing is required.
          No AP pre-shot file-list baseline exists on a fresh launch: the first shot may preview only the uniquely latest candidate, explicitly UNVERIFIED as newly captured. Next successful run compares against the previous in-memory AP list. Never label a static old file a proven fresh shot; reject ambiguous files. No auto-repeat shutter/AP attempts. 256KB AP JSON and 32MB image caps, strict relative name and content checks, no redirects, no cloud, no file writes, no deletes, no speculative firmware commands.
          Separate app ID com.vobichngan.bluestar.m02sblefirstlab; official Blue Star Guide RC25, Windows OCR, and v0.1.0-v0.1.7 branches and releases unchanged.
          CI tests, SDK36 build, package/version/permission/signing/zipalign/ZIP validation and browser-downloadable prerelease asset. Hardware shutter/AP interaction and exit from glasses AP mode require one phone field test; no claims of real-device success.
          EOF
          gh release create bluestar-m02s-ble-first-ap-fetch-v018-20261114 \
            release/BlueStar_M02S_BLE_First_AP_Fetch_0.1.8_Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S BLE-First Capture then AP Fetch v0.1.8 — standalone experiment" \
            --prerelease --notes-file "$RUNNER_TEMP/note.txt"
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bluestar-m02s-ble-first-ap-fetch-v018-20261114 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
