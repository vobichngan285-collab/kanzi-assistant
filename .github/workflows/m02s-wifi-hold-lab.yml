name: Blue Star M02S Verified BLE Commands Lab v0.1.3
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-verified-ble-commands-20261114']
    paths:
      - 'experiments/m02s-wifi-lab/**'
      - '.github/workflows/m02s-wifi-hold-lab.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and standalone Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p experiments/m02s-wifi-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify independent APK, permissions, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="experiments/m02s-wifi-lab/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02scommandlab' versionCode='4' versionName='0.1.3'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.BLUETOOTH_SCAN' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.NEARBY_WIFI_DEVICES' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or media access in transport-only lab' >&2; exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_Verified_Commands_0.1.3_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-VerifiedCommands-v013-APK
          path: release/BlueStar_M02S_Verified_Commands_0.1.3_Android.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct-browser APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/note.txt" <<'EOF'
          Blue Star M02S Verified BLE Commands Lab v0.1.3 — independent Android APK.
          User-confirmed in vivo BLE GATT LE 1M success (143ms), AA14 notification reception, and AE00/AA12 characteristics.
          Interoperability-only, specific commands reverse traced in USER-SUPPLIED official HeyCyan APK v1.0.24-c: SendCommandViaBle.takePhoto(int) -> command 0x22, TAKE_PHOTO_THUMBNAIL=0x30; getWifiInfo(int) -> command 0x39, GET_WIFI_P2P=0x31, GET_WIFI_AP=0x30. Datagram encodes AB 55, length=3, command, one-byte parameter and (cmd+param)&0xff checksum. BleCore uses AA13 (with response) for commands and AA14 for command notifications.
          Explicit buttons ONLY, cannot transmit unrecognized commands. Remote photo truly requests a photo; AP/P2P wifi info requests may cause the glasses to activate a transport, but this has not been verified on M02S. Requires the GATT AA14 standard CCCD notification subscription to succeed first. Prevents overlapping writes, enforces at least 5s between actions, logs Bluetooth write status and sanitized response frame summaries; never auto retries.
          Wi-Fi response SSID/password payload is hidden from copied logs. No original photos copied or uploaded; no firmware changes or arbitrary vendor writes. Formal Blue Star Guide, previous labs and original HeyCyan APK are untouched.
          Compilation/unit tests/v2-signed APK are CI-verified. REAL device command acceptance, photo generation, Wi-Fi on/off, and transfer time remain UNTESTED until user runs the APK.
          EOF
          gh release create bluestar-m02s-verified-commands-v013-20261114 \
            release/BlueStar_M02S_Verified_Commands_0.1.3_Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S Verified BLE Commands Lab v0.1.3 — shutter and Wi-Fi request" \
            --prerelease --notes-file "$RUNNER_TEMP/note.txt"
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bluestar-m02s-verified-commands-v013-20261114 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
