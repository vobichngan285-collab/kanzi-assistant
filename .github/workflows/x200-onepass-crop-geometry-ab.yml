name: One-pass Small crop border geometry paired A/B on 36 public real photos
on:
  push:
    branches: [test/x200-single-crop-geometry-ab-20261104]
    paths:
      - 'scripts/x200_onepass_crop_border_ab.py'
      - '.github/workflows/x200-onepass-crop-geometry-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  small-rec-matched-crop:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1e0c227f33fb0fbef4c681024972d107b09bfc99
          path: original-ocr-study
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original dependencies and validate new driver
        run: |
          python3 -m pip install --quiet 'numpy==1.26.4' 'onnxruntime==1.21.1' 'opencv-python-headless==4.10.0.84' 'Pillow==11.1.0' 'PyYAML==6.0.2' 'requests==2.32.3' pyclipper
          python3 -m py_compile scripts/x200_onepass_crop_border_ab.py
      - name: Download SHA-pinned original Small DET+REC
        run: |
          set -euo pipefail
          mkdir -p /tmp/kanzi-crop-geometry/models /tmp/kanzi-crop-geometry/results
          curl -fL --retry 3 --retry-delay 2 --max-time 240 'https://huggingface.co/PaddlePaddle/PP-OCRv6_small_det_onnx/resolve/main/inference.onnx' -o /tmp/kanzi-crop-geometry/models/det.onnx
          curl -fL --retry 3 --retry-delay 2 --max-time 240 'https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/main/inference.onnx' -o /tmp/kanzi-crop-geometry/models/small_rec.onnx
          curl -fL --retry 3 --retry-delay 2 --max-time 240 'https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/main/inference.yml' -o /tmp/kanzi-crop-geometry/models/small_rec.yml
          echo 'd73e0058b7a8086bbd57f3d10b8bcd4ff95363f67e06e2762b5e814fe9c9410e  /tmp/kanzi-crop-geometry/models/det.onnx' | sha256sum -c -
          echo '5435fd747c9e0efe15a96d0b378d5bd157e9492ed8fd80edf08f30d02fa24634  /tmp/kanzi-crop-geometry/models/small_rec.onnx' | sha256sum -c -
          echo 'ab078671bb49f06228eadccd34f1bb501e157f7a047095ffb943ba81512c77d1  /tmp/kanzi-crop-geometry/models/small_rec.yml' | sha256sum -c -
      - name: Same Small, same 122 GT regions, original crop vs modest outward crop
        run: |
          set -euo pipefail
          PYTHONPATH=original-ocr-study/scripts python3 -u scripts/x200_onepass_crop_border_ab.py \
            | tee /tmp/kanzi-crop-geometry/results/run.log
          grep -q '^SMALL_CROP_PADDING_PAIRED_COMPLETED' /tmp/kanzi-crop-geometry/results/run.log
          cat /tmp/kanzi-crop-geometry/results/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x200-onepass-crop-geometry-anonymous-numeric-ab
          path: /tmp/kanzi-crop-geometry/results/
          retention-days: 7
          if-no-files-found: warn
