name: #315 OCR low-score box value - independent 132-scene holdout
on:
  push:
    branches: [test/ocr-111-boxes-audit-20261103]
    paths:
      - scripts/ocr_box_value_deep_dive.py
      - .github/workflows/ocr-holdout-low-score.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install standalone CPU model runtimes
        run: |
          python3 -m pip install --quiet 'numpy==1.26.4' 'onnxruntime==1.21.1' 'opencv-python-headless==4.10.0.84' 'Pillow==11.1.0' 'PyYAML==6.0.2' requests pyclipper
      - name: Retrieve SHA-fixed #315 model and dictionary
        run: |
          set -euo pipefail
          mkdir -p /tmp/holdout-models
          curl -fL --retry 3 'https://huggingface.co/PaddlePaddle/PP-OCRv6_small_det_onnx/resolve/5994b4f/inference.onnx' -o /tmp/holdout-models/det.onnx
          curl -fL --retry 3 'https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/3d2d345/inference.onnx' -o /tmp/holdout-models/rec.onnx
          curl -fL --retry 3 'https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/b8f84f0b80c529de40b4fbb3544b84fa7233a513/inference.yml?download=true' -o /tmp/holdout-models/rec.yml
          echo 'd73e0058b7a8086bbd57f3d10b8bcd4ff95363f67e06e2762b5e814fe9c9410e  /tmp/holdout-models/det.onnx' | sha256sum -c -
          echo '5435fd747c9e0efe15a96d0b378d5bd157e9492ed8fd80edf08f30d02fa24634  /tmp/holdout-models/rec.onnx' | sha256sum -c -
      - name: Evaluate 132 never-seen real scenes (no tuning on holdout)
        run: |
          set -euo pipefail
          mkdir -p /tmp/holdout-results
          python3 -u scripts/ocr_box_value_deep_dive.py \
            /tmp/holdout-models/det.onnx \
            /tmp/holdout-models/rec.onnx \
            /tmp/holdout-models/rec.yml \
            --holdout --out /tmp/holdout-results \
            | tee /tmp/holdout-results/console.log
          grep -q 'DATA_SPLIT=INDEPENDENT_HOLDOUT' /tmp/holdout-results/console.log
          grep -q 'CORRECT_315_BOX_VALUE_DEEP_DIVE=PASS' /tmp/holdout-results/console.log
          echo 'Independent split indices 500, 720, disjoint from threshold exploration.' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/holdout-results/thresholds.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload metrics and text predictions only; no photo bytes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-315-low-score-132-photo-holdout
          path: /tmp/holdout-results/
          retention-days: 10
          if-no-files-found: warn
