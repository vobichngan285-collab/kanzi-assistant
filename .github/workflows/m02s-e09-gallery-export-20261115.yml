name: Blue Star M02S E09 AA15 JPEG Gallery Export
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-e09-ble-jpeg-gallery-export-20261115']
    paths:
      - 'experiments/m02s-wifi-lab/**'
      - '.github/workflows/m02s-e09-gallery-export-20261115.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and standalone Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p experiments/m02s-wifi-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify manual E09 export is byte-preserving and opt-in
        shell: bash
        run: |
          set -euo pipefail
          SRC="experiments/m02s-wifi-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/MainActivity.java"
          grep -Fq 'button("保存刚收到的蓝牙JPEG到手机相册（原始画质）", this::exportE09BleJpeg)' "$SRC"
          grep -Fq 'lastE09PhotoForExport = jpeg;' "$SRC"
          grep -Fq 'final byte[] jpeg = lastE09PhotoForExport.clone();' "$SRC"
          grep -Fq 'out.write(jpeg);' "$SRC"
          grep -Fq 'MediaStore.Images.Media.IS_PENDING' "$SRC"
          grep -Fq 'Environment.DIRECTORY_PICTURES + "/BlueStarE09"' "$SRC"
          grep -Fq 'if (lastE09PhotoForExport == null' "$SRC"
          grep -Fq 'button("E09 RTSP直播建连", this::startE09Live)' "$SRC"
          grep -Fq 'button("播放RTSP画面", this::playE09Preview)' "$SRC"
          grep -Fq 'M02sBleWire.e09BlePhoto()' "$SRC"
          ! grep -Fq 'Bitmap.compress(' "$SRC"
          # The original BLE assembler has not changed from the tested baseline
          git show b7f42f8ce8887c7417426f1b8a1ad6c8e584cd66:experiments/m02s-wifi-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/M02sE09PhotoAssembler.java | sha256sum | cut -d' ' -f1 > /tmp/original-assembler.sha
          sha256sum experiments/m02s-wifi-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/M02sE09PhotoAssembler.java | cut -d' ' -f1 > /tmp/current-assembler.sha
          diff -u /tmp/original-assembler.sha /tmp/current-assembler.sha
          echo "E09 export opt-in and byte preserving; original assembler unchanged"

      - name: Verify independent APK, permissions, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="experiments/m02s-wifi-lab/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02se09exportlab' versionCode='14' versionName='0.1.12-export'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.BLUETOOTH_SCAN' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.NEARBY_WIFI_DEVICES' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_WIFI_STATE' "$RUNNER_TEMP/permissions.txt"
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or media access in transport-only lab' >&2; exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_E09_BLE_JPEG_Export_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-E09-BLE-JPEG-Export-APK
          path: release/BlueStar_M02S_E09_BLE_JPEG_Export_Android.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct-browser APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/note.txt" <<'EOF'
          E09 AA15 BLE JPEG photo gallery export based solely on the user's real successful v0.1.12 test, 320x180 image in 3061ms.
          The proven E09 0x22/0x31 BLE, AA15 PHOTO_START/CHUNK/END JPEG assembler, Android Bitmap decoding, and E09 APP_LIVE RTSP experimental paths are unchanged.
          Only addition: user taps a dedicated button to store the decoder-accepted original JPEG bytes, without Bitmap recompression/resizing/sharpening, to Android Pictures/BlueStarE09 through MediaStore (Android 10+ scoped storage). Default behavior still RAM-only; exported media stays local; no camera/media-read permission or cloud upload; no deletion from eyewear.
          Separate package com.vobichngan.bluestar.m02se09exportlab, versionName 0.1.12-export, does not replace v0.1.12, official HeyCyan, Blue Star Guide RC25 or Windows OCR. RTSP playback has not been confirmed on the actual M02S.
          Upstream open-source E09 reverse engineering MIT license and attribution remain preserved.
          EOF
          gh release create bluestar-m02s-e09-gallery-export-20261115 \
            release/BlueStar_M02S_E09_BLE_JPEG_Export_Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S E09 Bluetooth JPEG Gallery Export — v0.1.12 baseline" \
            --prerelease --notes-file "$RUNNER_TEMP/note.txt"
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bluestar-m02s-e09-gallery-export-20261115 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
