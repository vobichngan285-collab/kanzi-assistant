name: Strict OCR reading-order JVM tests

on:
  push:
    branches:
      - feature/strict-offline-ocr-order-guard
  pull_request:
    paths:
      - 'app/src/main/java/com/vobichngan/kanzi/StrictOcrOrderGuard.java'
      - 'app/src/main/java/com/vobichngan/kanzi/LayoutReadingPlanner.java'
      - 'app/src/main/java/com/vobichngan/kanzi/LayoutFrameScheduler.java'
      - 'app/src/main/java/com/vobichngan/kanzi/LayoutSceneFingerprint.java'
      - 'app/src/main/java/com/vobichngan/kanzi/LayoutAiReuseCoordinator.kt'
      - 'app/src/main/java/com/vobichngan/kanzi/PaddleOcrEngine.kt'
      - 'scripts/StrictOcrOrderGuardSmokeTest.java'
      - 'scripts/LayoutReadingPlannerSmokeTest.java'
      - 'scripts/LayoutOrderingDeterminismSmokeTest.java'
      - 'scripts/DenseTwoPageReadingSmokeTest.java'
      - 'scripts/BookDiagnostic52RegressionTest.java'
      - 'scripts/BookDiagnostic46RegressionTest.java'
      - 'app/src/main/java/com/vobichngan/kanzi/RealtimeSceneTracker.java'
      - 'app/src/main/java/com/vobichngan/kanzi/TextFlowRebuilder.java'
      - 'app/src/main/java/com/vobichngan/kanzi/ReadingOrder.java'
      - 'scripts/RealtimeTextFlowSmokeTest.java'
      - 'scripts/RealtimeSceneTrackerSmokeTest.java'
      - 'scripts/LayoutSceneFingerprintSmokeTest.java'
      - 'scripts/LayoutFrameSchedulerSmokeTest.java'
      - '.github/workflows/strict-ocr-order-tests.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile pure Java reading-order components
        run: |
          mkdir -p build/order-tests
          javac -encoding UTF-8 -d build/order-tests \
            app/src/main/java/com/vobichngan/kanzi/ReadingOrder.java \
            app/src/main/java/com/vobichngan/kanzi/TextFlowRebuilder.java \
            app/src/main/java/com/vobichngan/kanzi/LayoutRegion.java \
            app/src/main/java/com/vobichngan/kanzi/StrictOcrOrderGuard.java \
            app/src/main/java/com/vobichngan/kanzi/LayoutReadingPlanner.java \
            app/src/main/java/com/vobichngan/kanzi/LayoutFrameScheduler.java \
            app/src/main/java/com/vobichngan/kanzi/LayoutSceneFingerprint.java \
            app/src/main/java/com/vobichngan/kanzi/RealtimeSceneTracker.java \
            scripts/StrictOcrOrderGuardSmokeTest.java \
            scripts/LayoutReadingPlannerSmokeTest.java \
            scripts/LayoutOrderingDeterminismSmokeTest.java \
            scripts/DenseTwoPageReadingSmokeTest.java \
            scripts/BookDiagnostic52RegressionTest.java \
            scripts/BookDiagnostic46RegressionTest.java \
            scripts/RealtimeSceneTrackerSmokeTest.java \
            scripts/RealtimeTextFlowSmokeTest.java \
            scripts/LayoutFrameSchedulerSmokeTest.java \
            scripts/LayoutSceneFingerprintSmokeTest.java
      - name: Run strict OCR preservation test
        run: java -cp build/order-tests StrictOcrOrderGuardSmokeTest
      - name: Run layout reading-order test
        run: java -cp build/order-tests LayoutReadingPlannerSmokeTest
      - name: Test deterministic region order and repeated OCR box objects
        run: java -cp build/order-tests LayoutOrderingDeterminismSmokeTest
      - name: Test dense double-page OCR order
        run: java -cp build/order-tests DenseTwoPageReadingSmokeTest
      - name: Test real 52-box book geometry without copying book text
        run: java -cp build/order-tests BookDiagnostic52RegressionTest
      - name: Test real single-page 46 boxes with footnotes and page number
        run: java -cp build/order-tests BookDiagnostic46RegressionTest
      - name: Verify new-target acquisition and same-target suppression
        run: java -cp build/order-tests RealtimeSceneTrackerSmokeTest
      - name: Verify real-time top-first coherent text flows
        run: java -cp build/order-tests RealtimeTextFlowSmokeTest
      - name: Run layout frame scheduler test
        run: java -cp build/order-tests LayoutFrameSchedulerSmokeTest
      - name: Verify layout scene fingerprint
        run: java -cp build/order-tests LayoutSceneFingerprintSmokeTest
