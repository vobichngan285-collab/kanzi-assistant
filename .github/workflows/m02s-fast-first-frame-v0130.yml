name: Blue Star M02S First-Frame Speed Benchmark v0.1.30
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-fast-first-frame-v0130-20261115']
    paths:
      - 'experiments/m02s-wifi-only-lab/**'
      - '.github/workflows/m02s-fast-first-frame-v0130.yml'
permissions:
  contents: write

concurrency:
  group: m02s-fast-first-frame-v0130
  cancel-in-progress: true

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check full-cycle OEM protocol and run JVM tests + Android build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('experiments/m02s-wifi-only-lab/app/src')
          java=root/'main/java/com/vobichngan/bluestar/m02slab'
          tests=root/'test/java/com/vobichngan/bluestar/m02slab'
          starter=(java/'M02sApStarter.java').read_text()
          main=(java/'MainActivity.java').read_text()
          wire=(java/'M02sApWire.java').read_text()
          policy=(java/'M02sOemImportPolicy.java').read_text()
          listing=(java/'M02sPhotoListReader.java').read_text()
          for required in (
              '0x44,(byte)mode', 'MAX_OEM_BATCH_IMAGES = 24',
              'Branch.ZERO', 'Branch.FULL', 'Branch.PARTIAL',
              'public static boolean authorizedFinish(byte[] frame)'
          ): assert required in policy, required
          for required in (
              'requestOemFinish(int total, int done, OemFinishCallback cb)',
              'M02sOemImportPolicy.finishFrame(total,done)',
              'M02sOemImportPolicy.authorizedFinish(frame)',
              'awaitingOldWifiLoss', 'checkOldWifiGone(generation)',
              'connectivity.unregisterNetworkCallback(old)',
              'setSsidPattern(new PatternMatcher(',
              'builder.setBssid(MacAddress.fromString(freshBssid))',
              'scanRequestedAtUs = bleCommandAtMs * 1000L'
          ): assert required in starter, required
          for required in (
              'downloadOemSession(', 'M02sPhotoListReader.sameSnapshot(previousFullList,list)',
              'originalsCompletedThisRound=count;',
              'starter.requestOemFinish(originalCount,done,ok ->',
              'M02sOemImportPolicy.canCompleteWholeList(',
              'lastDownloadedRemoteName=latest.remoteName'
          ): assert required in main, required
          assert main.count('starter.requestPhotoTransfer()') == 1
          assert main.count('starter.requestOemFinish(') == 1
          assert 'partialFinishOptIn' not in main and 'partialCheckbox' not in main
          assert 'requestPartialOneFinish' not in starter
          assert 'partialOneFinishRequest' not in wire
          assert 'sameSnapshot(Result first, Result second)' in listing
          block=main.split('@Override public void photoActionEnded()',1)[1].split('@Override public void deviceProjectReported',1)[0]
          assert 'requestPhotoTransfer(' not in block
          assert 'if (fastAutoImportEnabled && starter.standby())' in block
          assert 'startPhotoTransfer(true);' in block
          begin=main.split('@Override public void photoActionCandidate()',1)[1].split('@Override public void photoActionEnded()',1)[0]
          assert 'startPhotoTransfer(' not in begin
          assert 'fastMode.setChecked(false);' in main
          assert 'starter.setFastConnectionOptIn(enabled);' in main
          assert 'lastJpegInRam=earlyOriginal;' in main
          assert 'latestOriginalReadyAtMs=imageReadyAt;' in main
          assert '实体快门开始→高清就绪=' in main
          assert 'M02sFastDownloadPlan.plan(list,latest,fullBatch)' in main
          assert 'M02sFastDownloadPlanTest' in str([p.stem for p in tests.glob('*.java')])
          assert 'fastConnectionForThisImport' in starter
          assert 'canConnectWithSettling(' in starter
          policy_scan=(java/'M02sApReadinessPolicy.java').read_text()
          assert 'firstObservedAtMs, nowMs, 1800L' in policy_scan
          assert 'now,650L)' in starter
          assert 'fastOptInSettlesAt650ButDefaultStillRequires1800' in (tests/'M02sApReadinessPolicyTest.java').read_text()
          assert main.count('startPhotoTransfer(true)') == 1
          assert main.count('starter.requestPhotoTransfer()') == 1
          print('PASS: latest JPEG before historical downloads, fast opt-in after 0x45 fall, manual default, OEM FULL unchanged')
          assert 'M02sOemImportPolicy.finishFrame' in (tests/'M02sOemImportPolicyTest.java').read_text()
          recovery=(java/'M02sWifiRecoveryPolicy.java').read_text()
          recover_test=(tests/'M02sWifiRecoveryPolicyTest.java').read_text()
          for required in ('wifiSsidOnlyFallbackAttempted', 'wifiRecoveryClosing',
                           'requestZeroFinishAfterWifiFailure(OemFinishCallback cb)',
                           'requestOemFinishInternal(0,0,cb,true)',
                           'closeFailedWifiSession(int token,String reason)',
                           'connectWifi(token,false,true)',
                           'M02sWifiRecoveryPolicy.canTrySsidOnly(',
                           'callback.recoverableImportFailure(',
                           'awaitZeroImportIdleAfterExit(token)',
                           'awaitingZeroImportIdle',
                           'zeroImportIdleTimeout'):
              assert required in starter, required
          assert starter.count('connectWifi(token,false,true)') == 1
          assert 'if (!valid(token) || networkCallback != this) return;' in starter
          assert 'networkCallback = null;' in starter
          assert 'canTrySsidOnly' in recovery and 'onceOnlyAfterFreshBssidPinnedRequestFails' in recover_test
          assert 'photoReadyForManualImport=true;' in main
          assert 'recoverableImportFailure(String message)' in main
          assert main.count('starter.requestPhotoTransfer()') == 1
          assert main.count('starter.requestOemFinish(') == 1
          assert 'startupRecoveryLoop' not in starter
          assert 'onUnavailable' in starter
          assert 'app/src' not in recovery
          print('PASS: one bounded fallback, OEM ZERO GATT close, preserve photo and BLE; v28 full path unchanged')
          assert 'stableInventoryNeedsAllItemNamesAndSizesMatching' in (tests/'M02sPhotoListReaderTest.java').read_text()
          print('PASS OEM exit frame full/partial/zero; vivo matcher preserved; no auto shutter; next cycle gated')
          PY
          gradle -p experiments/m02s-wifi-only-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Check APK signing, package, permission and zip integrity
        shell: bash
        run: |
          set -euo pipefail
          APK=experiments/m02s-wifi-only-lab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/apksig.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apksig.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02sfastframe30' versionCode='31' versionName='0.1.30'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          for p in BLUETOOTH_SCAN BLUETOOTH_CONNECT ACCESS_NETWORK_STATE ACCESS_WIFI_STATE CHANGE_NETWORK_STATE NEARBY_WIFI_DEVICES ACCESS_FINE_LOCATION INTERNET; do
            grep -q "android.permission.${p}" "$RUNNER_TEMP/permissions.txt"
          done
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo "Unexpected media or camera permission" >&2
            exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_FastFirstFrame_0.1.30_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload standalone signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-Fast-First-Frame-v0130-APK
          path: release/BlueStar_M02S_FastFirstFrame_0.1.30_Android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct-link APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.txt" <<'EOF'
          v0.1.30 independent first-frame latency experiment, derived exclusively from v0.1.29. Target is user requested 3–5 seconds shutter-to-speech, but THIS APK ONLY DELIVERS THE LATEST HIGH-RES JPEG EARLY AND BENCHMARKS IT. No OCR or text-to-speech is included; do NOT claim the 5-second target is achieved until device and OCR/TTS are tested.
          Normal manual mode defaults OFF for fast auto import and uses the same tested v0.1.29 1800ms fresh-BSSID stable scan, vivo exact-SSID Pattern+unique BSSID, one SSID-only contingency on onUnavailable, OEM ZERO recovery retaining BLE, OEM HTTP twice-stable list, verified high-resolution JPEG and OEM 0x44 FULL transfer finish with old Android Network release.
          New: latest candidate is downloaded FIRST and immediately placed in RAM/UI for future OCR without awaiting old photos, while the full list of older images (when <=24 eligible) still downloads to completion before the proven OEM FULL frame. On partial failure only actual completed images count. UI logs independent shutter-start->first-original, shutter-finish->first-original, import-request->first-original and Wi-Fi-ready->first-original timings.
          An explicit user-checked fast auto-import experiment (OFF every launch) issues exactly one 0x39/0x30 only on physical 0x45 shutter 1->0 completion candidate, with no fixed 250ms timer or AP while shutter is held. Only fast opt-in reduces fresh-BSSID settle threshold from 1800ms to 650ms; still verifies Android onAvailable, trusted gateway, OEM HTTP 200 and stable inventory. No auto retries or continuous Wi-Fi. On failure use the existing bounded v0.1.29 BLE-preserving ZERO exit and manual re-import. Users can turn the experiment off to retain the proven manual workflow.
          Historic all-image FULL GATT finish may clear eyewear media; previous user permission applies. No remote BLE shutter, no cloud, gallery write, OTA or Windows repo edits. Max 24-image full batch remains; beyond that the previous PARTIAL behavior applies, not proof of infinite continuous operation.
          EOF
          TAG=bluestar-m02s-fast-first-frame-v0130-20261115
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/BlueStar_M02S_FastFirstFrame_0.1.30_Android.apk \
              release/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            echo "Existing pre-release assets verified and refreshed for latest source commit"
          else
            gh release create "$TAG" \
              release/BlueStar_M02S_FastFirstFrame_0.1.30_Android.apk \
              release/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Blue Star M02S Fast First-Frame v0.1.30 — JPEG benchmark only, no OCR" \
              --prerelease --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi
      - name: Verify public release and download asset URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view bluestar-m02s-fast-first-frame-v0130-20261115 \
            --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
