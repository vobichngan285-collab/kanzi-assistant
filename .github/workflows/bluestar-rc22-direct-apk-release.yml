name: Publish verified RC22 reading shelf APK
on:
  push:
    branches: [feat/bluestar-122-reading-library-20261108]
    paths: ['.github/workflows/bluestar-rc22-direct-apk-release.yml']

permissions:
  actions: read
  contents: write

jobs:
  publish-verified-rc22:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Require exact successful RC22 Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=42391373779
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha')" = 525693600ae1a0891c7fbb8c0c2c9d27954d94da
      - name: Download official original CI APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download 42391373779 \
            --repo "$GITHUB_REPOSITORY" \
            --name blue-star-guide-1-0-21-rc22-arm64 --dir verified
          test -s verified/BlueStar_Guide_1.0.21_RC22_arm64.apk
          test -s verified/SHA256SUMS.txt
          test -s verified/badging.txt
          test -s verified/apk-entries.txt
      - name: Verify unchanged APK bytes native UVC audio app ID and version
        run: |
          set -euo pipefail
          cd verified
          sha256sum -c SHA256SUMS.txt
          unzip -tq BlueStar_Guide_1.0.21_RC22_arm64.apk >/dev/null
          unzip -Z1 BlueStar_Guide_1.0.21_RC22_arm64.apk | grep -Fxq 'lib/arm64-v8a/libUVCCamera.so'
          unzip -Z1 BlueStar_Guide_1.0.21_RC22_arm64.apk | grep -Fxq 'res/raw/c_metal_clack_ding.mp3'
          unzip -Z1 BlueStar_Guide_1.0.21_RC22_arm64.apk | grep -Fxq 'res/raw/voice_send_whoosh.wav'
          grep -Fq "package: name='com.vobich.bluestar.rc22'" badging.txt
          grep -Fq "versionCode='31'" badging.txt
          grep -Fq "versionName='1.0.21-rc22'" badging.txt
          grep -Fq "application-label:'Blue Star Guide'" badging.txt
          grep -q 'application-icon-' badging.txt
          if grep -Ei 'inference\.onnx|paddle|ppocr|sherpa|layout.*onnx' apk-entries.txt; then
            echo "Unexpected on-device OCR model found" >&2
            exit 1
          fi
          echo "APK_SIZE_BYTES=$(stat -c%s BlueStar_Guide_1.0.21_RC22_arm64.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SHA256=$(sha256sum BlueStar_Guide_1.0.21_RC22_arm64.apk | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only verified CI APK without rebuilding or resigning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=blue-star-guide-cloud-rc22-20261108
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing RC22 Release; refuse overwrite." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "verified/BlueStar_Guide_1.0.21_RC22_arm64.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target 525693600ae1a0891c7fbb8c0c2c9d27954d94da \
            --title "Blue Star Guide 1.0.21 RC22 - Reading mode, local book shelf and full-page OCR" \
            --notes "Blue Star Guide v1.0.21 RC22 adds standalone Reading mode as a fourth bottom navigation button between AI chat and Settings. Dark-blue reading shelf with white text and large Next Page button: create books, photograph a page, physically close selected Camera2 or native USB camera after fresh frame acquisition, recognize whole book page using selected OCR model with dedicated full-page prompt, reuse previously verified C complete-line streaming TTS, and atomically store only text on the device with explicit chapter headings and numbered pages. Camera remains closed while reading; Next Page wakes camera for a new frame and closes it again. Saved pages can be reopened and spoken by available local TTS offline without camera or cloud OCR; TXT export through Android document picker. No automatic audio or photo storage. Distinct secure app-private library; exporting a book before uninstall provides a user-owned backup. Long output max tokens bounded at 3800, explicit finish_reason length truncation rejected, never mark truncated pages saved. User-selected OCR models unchanged; original voice chat, task grid, native UVC, sounds and settings preserved. Exact Android CI run 42391373779 success with source SHA 525693600ae1a0891c7fbb8c0c2c9d27954d94da validates Android ARM64 build, reading static scope/security, chapter/reading queue unit tests, original regression tests, UVC shared library and audio/icon APK checks. Only the checksum-verified original CI APK is published without resigning or rebuilding. Separate com.vobich.bluestar.rc22 versionCode31 versionName1.0.21-rc22, so enter own API key and source preferences; do not share API keys. On-phone camera close/reopen, voice and reading accuracy await actual vivo X200 Pro and USB device tests." \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'BlueStar_Guide_1.0.21_RC22_arm64.apk'
          echo "Direct browser URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BlueStar_Guide_1.0.21_RC22_arm64.apk" >> "$GITHUB_STEP_SUMMARY"
