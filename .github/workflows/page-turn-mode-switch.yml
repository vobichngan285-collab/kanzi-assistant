name: OCR page-turn and reading-mode switch regression (isolated)
on:
  push:
    branches: [fix/ocr-page-switch-resume-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reading-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile small frame and speech mode policies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kanzi-page-mode-test
          javac -Xlint:all -encoding UTF-8 -d /tmp/kanzi-page-mode-test \
            app/src/main/java/com/vobichngan/kanzi/FrameChangeGate.java \
            app/src/main/java/com/vobichngan/kanzi/FastScanFrameGate.java \
            app/src/main/java/com/vobichngan/kanzi/ReadingModeRules.java \
            scripts/FastScanFrameGateSmokeTest.java \
            scripts/ReadingModeRulesSmokeTest.java
      - name: Verify first page, second page, speech preemption and old frame suppression
        shell: bash
        run: |
          set -euo pipefail
          java -ea -cp /tmp/kanzi-page-mode-test FastScanFrameGateSmokeTest | tee /tmp/page-mode-results.txt
          java -ea -cp /tmp/kanzi-page-mode-test ReadingModeRulesSmokeTest | tee -a /tmp/page-mode-results.txt
          python3 scripts/verify_page_turn_mode_switch.py | tee -a /tmp/page-mode-results.txt
          python3 scripts/verify_book_reading_fast_path.py | tee -a /tmp/page-mode-results.txt
          python3 scripts/verify_preview_ocr_isolation.py | tee -a /tmp/page-mode-results.txt
          grep -q 'FAST_SCAN_FRAME_GATE=PASS' /tmp/page-mode-results.txt
          grep -q 'READING_MODE_RULES=PASS' /tmp/page-mode-results.txt
          grep -q 'MODE_SWITCH_AUTO_RESUME_STATE=PASS' /tmp/page-mode-results.txt
      - name: Ensure no changes to OCR model or UVC source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin release/v0.8.0-ocr-engine-rework
          git diff --quiet FETCH_HEAD -- \
            app/src/main/java/com/vobichngan/kanzi/PaddleOcrEngine.kt \
            app/src/main/java/com/vobichngan/kanzi/FrameChangeGate.java
      - name: Upload test report (no APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-turn-mode-switch-isolated-results
          path: /tmp/page-mode-results.txt
          if-no-files-found: warn
