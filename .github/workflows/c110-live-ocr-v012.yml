name: BlueStar C110 Manual Frame OCR v0.1.2
on:
  push:
    branches: [exp/c110-live-ocr-v012-20261128]
    paths: ['openocr-lab/**','.github/workflows/c110-live-ocr-v012.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lightbringer/clipper-java
          ref: 5ef8c0a467023c495e44e582e9cbd8ca7308a590
          path: clipper-upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: openocr-lab/third_party/AndroidUSBCamera
          persist-credentials: false
      - name: Generate headless UVC and scoped OCR cancellation
        run: python3 openocr-lab/create_live_uvc.py
      - name: Vendor pinned Clipper Java source
        run: |
          set -euo pipefail
          test "$(git -C clipper-upstream rev-parse HEAD)" = 5ef8c0a467023c495e44e582e9cbd8ca7308a590
          mkdir -p openocr-lab/app/src/main/java/de/lighti/clipper
          cp clipper-upstream/Clipper/src/de/lighti/clipper/*.java openocr-lab/app/src/main/java/de/lighti/clipper/
          cp clipper-upstream/license.txt Clipper-Java-LICENSE.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reuse verified v0.1.3 and arena model assets
        run: |
          set -euo pipefail
          BASE=https://github.com/vobichngan285-collab/kanzi-assistant/releases/download/bluestar-openocr-yolo-columns-v013-20261126
          ARENA=https://github.com/vobichngan285-collab/kanzi-assistant/releases/download/bluestar-openocr-arena-v020-20261126
          curl -fL --retry 3 "$BASE/BlueStar_OpenOCR_Columns_0.1.3.apk" -o previous.apk
          curl -fL --retry 3 "$BASE/openocr-report.json" -o openocr-report.json
          curl -fL --retry 3 "$BASE/OpenOCR-LICENSE.txt" -o OpenOCR-LICENSE.txt
          curl -fL --retry 3 "$ARENA/BlueStar_OpenOCR_Arena_0.2.0.apk" -o arena.apk
          curl -fL --retry 3 "$ARENA/arena-assets.sha256" -o arena-assets.sha256
          curl -fL --retry 3 "$ARENA/YOLO-LICENSE.txt" -o YOLO-LICENSE.txt
          echo '84441c55b23f621452404df0398a04ae49d84e6e9d95987cc537f7920fa8e890  previous.apk' | sha256sum -c -
          echo 'f1d36ed055b95ffdc61f42dd9553907e5dd945030d0eae3b42d4ed8e69fc41a1  openocr-report.json' | sha256sum -c -
          echo 'c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4  OpenOCR-LICENSE.txt' | sha256sum -c -
          echo '110073c1420e1e4717f772322e310bd1a74eca1245e4bf2a16dfd58fb6f3a364  arena.apk' | sha256sum -c -
          echo '0d3c036f062b35849bf7d8d87798cd6cff7c70ee4780651814718bd3c6e062e5  arena-assets.sha256' | sha256sum -c -
          mkdir -p openocr-lab/app/src/main/assets
          for m in rep.onnx chars.txt; do unzip -p previous.apk "assets/$m" > "openocr-lab/app/src/main/assets/$m"; done
          unzip -p arena.apk assets/repvit-db.onnx > openocr-lab/app/src/main/assets/repvit-db.onnx
          grep -E '  repvit-db.onnx$' arena-assets.sha256 > db-asset.sha256
          cd openocr-lab/app/src/main/assets
          echo "$(jq -r .rep.onnx_sha256 ../../../../../openocr-report.json)  rep.onnx" | sha256sum -c -
          echo "$(jq -r .dict_sha256 ../../../../../openocr-report.json)  chars.txt" | sha256sum -c -
          sha256sum -c ../../../../../db-asset.sha256
      - name: Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.1.13356709'
      - name: Build offline APK
        working-directory: openocr-lab
        run: gradle --no-daemon --max-workers=2 :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify and package
        run: |
          set -euo pipefail
          APK=openocr-lab/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | tee badging.txt
          grep -F "package: name='com.vobich.bluestar.uvcliveocr012' versionCode='3' versionName='0.1.2'" badging.txt
          ! grep -F android.permission.INTERNET badging.txt
          unzip -Z1 "$APK" > archive.txt
          grep -Fx lib/arm64-v8a/libonnxruntime.so archive.txt
          grep -Fx lib/arm64-v8a/libopencv_java4.so archive.txt
          grep -Fx lib/arm64-v8a/libUVCCamera.so archive.txt
          "$BT/aapt" dump permissions "$APK" | tee permissions.txt
          ! grep -F android.permission.INTERNET permissions.txt
          grep -F android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE permissions.txt
          ! grep -E '^lib/(x86|x86_64|armeabi-v7a)/' archive.txt
          unzip -p "$APK" assets/rep.onnx | sha256sum | grep -F "$(jq -r .rep.onnx_sha256 openocr-report.json)"
          ! grep -Fx assets/yolo26n-text.onnx archive.txt
          unzip -p "$APK" assets/chars.txt | sha256sum | grep -F "$(jq -r .dict_sha256 openocr-report.json)"
          unzip -p "$APK" assets/repvit-db.onnx | sha256sum | grep -F "$(cut -d ' ' -f1 db-asset.sha256)"
          ! grep -E '^assets/(svtr.onnx|yolo26[smlx]-text.onnx)$' archive.txt
          mkdir -p release
          cp "$APK" release/BlueStar_C110_Live_OCR_0.1.2.apk
          cp openocr-lab/README.md openocr-report.json OpenOCR-LICENSE.txt Clipper-Java-LICENSE.txt db-asset.sha256 release/
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: c110-live-ocr
          path: release/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: c110-live-ocr
          path: release
      - name: Publish verified experiment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS.txt)
          TAG=bluestar-c110-live-ocr-v012-20261128
          if ! gh release view "$TAG" >/dev/null 2>&1; then gh release create "$TAG" --target "$GITHUB_SHA" --title "蓝星 C110 实时离线OCR v0.1.2" --notes "独立实验：可关闭原生预览、手动最新原始1440P截帧、冻结OCR、独立自动对照，无网络。真机待验收。" --prerelease --draft; fi
          gh release view "$TAG" --json targetCommitish | jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha'
          for i in 1 2 3; do gh release upload "$TAG" release/* && break; test "$i" != 3; sleep 5; done
          gh release edit "$TAG" --draft=false --prerelease
