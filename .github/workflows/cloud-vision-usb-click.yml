name: Blue Star Cloud Vision - 2.0 UI dual camera no-OCR
on:
  push:
    branches: [exp/cloud-vision-usb-click-v1-20261106]
    paths:
      - 'cloud-vision-app/**'
      - '.github/workflows/cloud-vision-usb-click.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Checkout independent experiment source
        uses: actions/checkout@v4
      - name: Checkout pinned AUSBC UVC stack
        uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: cloud-vision-app/third_party/AndroidUSBCamera
      - name: Static scope/security audit (no local OCR, no API keys, no network)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('cloud-vision-app/app/src/main/AndroidManifest.xml').read_text()
          app = Path('cloud-vision-app/app/build.gradle').read_text()
          activity = Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/MainActivity.java').read_text()
          tasks = Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/TaskCatalog.java').read_text()
          assert 'android.permission.INTERNET' not in manifest
          assert 'android.permission.CAMERA' in manifest
          assert 'com.vobich.bluestar.cloudprobe' in app
          for bad in ['ppocr-sdk', 'PaddleOCR', 'onnxruntime', 'sherpa-onnx']:
              assert bad.lower() not in app.lower()
          assert 'setRenderMode(CameraRequest.RenderMode.NORMAL)' in activity
          assert 'now-current.atMs>1400L' in activity
          assert '暂时没有连接云端人工智能' in activity
          assert 'TextToSpeech.QUEUE_FLUSH' in activity
          assert 'final String OCR = "ocr"' not in tasks or 'static final String OCR = "ocr"' in tasks
          assert 'selected_task_id' in tasks and 'custom_tasks' in tasks
          assert 'extends CameraActivity' in activity
          assert 'InternalCameraController' in activity
          assert 'attachPhonePreviewAfterUsbInit();' in activity
          assert 'private void switchCameraSource(boolean phone)' in activity
          assert 'showCameraSourceSelector()' in activity
          assert '"手机后置摄像头","手机前置摄像头"' in activity
          assert 'setPreviewWidth(1920).setPreviewHeight(1080)' in activity
          assert 'new FrameLayout(this)' in activity and 'Gravity.BOTTOM' in activity
          assert 'TaskCatalog.upsert(this' in activity
          assert 'PaddleOcrEngine' not in activity
          camera2=Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/InternalCameraController.java').read_text()
          assert 'CameraManager' in camera2 and 'CameraCaptureSession' in camera2
          assert 'Nv21Rotation.rotate(' in camera2
          assert "versionCode 2" in app and "versionName '0.2.0-dual-camera'" in app
          print('DUAL_CAMERA_ORIGINAL_UI_NO_LOCAL_OCR_AUDIT=PASS')
          PY
      - name: Patch pinned Android 16 USB permission and native sampling safely
        run: |
          set -euo pipefail
          python3 scripts/patch_usbmonitor.py cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/java/com/jiangdg/usb/USBMonitor.java
          python3 cloud-vision-app/scripts/patch_pinned_uvc.py
          grep -q BSG_CLOUD_RAW5_GATED cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/jni/UVCCamera/UVCPreview.cpp
          grep -q BSG_CLOUD_CLOSE_BARRIER cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/camera/CameraUVC.kt
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use GitHub runner Android SDK (as verified by earlier 1.0.10 CI)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build isolated arm64 debug APK
        run: |
          cd cloud-vision-app
          gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug
      - name: Verify generated APK and checksum
        run: |
          set -euo pipefail
          mkdir -p cloud-vision-artifact
          cp cloud-vision-app/app/build/outputs/apk/debug/app-debug.apk cloud-vision-artifact/BlueStar_CloudVision_DualCamera_Probe_v0.2.0_arm64.apk
          test -s cloud-vision-artifact/BlueStar_CloudVision_DualCamera_Probe_v0.2.0_arm64.apk
          (cd cloud-vision-artifact && sha256sum *.apk > SHA256SUMS.txt)
          unzip -l cloud-vision-artifact/*.apk | grep -q 'lib/arm64-v8a/libUVCCamera.so'
          ! unzip -Z1 cloud-vision-artifact/*.apk | grep -Ei 'inference\.onnx|paddle|ppocr|sherpa|layout.*onnx'
          echo 'Native USB + stock Camera2 source compiled; vivo X200 Pro dual-source and cloud API NOT tested.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload experimental APK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: blue-star-cloud-dual-camera-probe-020-arm64
          path: cloud-vision-artifact/*
          retention-days: 7
