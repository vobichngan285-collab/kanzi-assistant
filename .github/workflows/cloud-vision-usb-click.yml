name: Blue Star Guide 1.0.3 - RC4 Camera Diagnostics and Voice
on:
  push:
    branches: [exp/cloud-vision-usb-click-v1-20261106, fix/bluestar-101-voice-ui-usb-20261106, fix/bluestar-102-press-to-talk-target-icon-20261106, fix/bluestar-103-demand-capture-diagnostics-20261106]
    paths:
      - 'cloud-vision-app/**'
      - '.github/workflows/cloud-vision-usb-click.yml'
  workflow_dispatch:
concurrency:
  group: blue-star-cloud-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  arm64-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Checkout independent experiment source
        uses: actions/checkout@v4
      - name: Checkout pinned AUSBC UVC stack
        uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: cloud-vision-app/third_party/AndroidUSBCamera
      - name: Static scope/security audit (no local OCR, no embedded API keys)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('cloud-vision-app/app/src/main/AndroidManifest.xml').read_text()
          app = Path('cloud-vision-app/app/build.gradle').read_text()
          activity = Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/MainActivity.java').read_text()
          tasks = Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/TaskCatalog.java').read_text()
          assert 'android.permission.INTERNET' in manifest
          assert 'android.permission.CAMERA' in manifest
          assert 'android.permission.RECORD_AUDIO' in manifest
          assert 'android.permission.VIBRATE' in manifest
          assert 'android:label="Blue Star Guide"' in manifest
          assert 'android:name="com.vobich.bluestar.cloudprobe.MainActivity"' in manifest
          assert "applicationId 'com.vobich.bluestar'" in app
          assert 'TaskDesktopOverlay.show(' in activity
          assert 'startButton.setOnTouchListener(' in activity
          assert 'handleVoiceButtonTouch(' in activity
          assert 'voiceRecorder.finish();' in activity
          assert 'voiceRecorder.cancel();' in activity
          assert 'vibrationForVoiceStart();' in activity
          assert 'playVoiceSendSound();' in activity
          assert 'routeSpokenRequest(' in activity
          assert 'VoiceAction.classify(' in activity
          assert 'TargetVisionClient.inspect(' in activity
          assert 'setFindingTarget(' in activity
          assert 'PREF_FINDING_TARGET' in activity
          assert 'new VoicePressState()' in activity
          assert 'rms>420' not in Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/VoiceRecorder.java').read_text()
          assert '6500' not in Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/VoiceRecorder.java').read_text()
          assert 'requestFreshFrame();' in activity
          assert 'pendingPhoneFrameToken' in activity
          assert 'beginCapturedFrame(' in activity
          assert 'if(!findingTarget.isEmpty())setFindingTarget("");' in activity
          assert 'setFindingTarget("");' in activity
          assert 'new RuntimeDiagnostics(this)' in activity
          assert 'copyRuntimeDiagnostics()' in activity
          assert 'exportRuntimeDiagnostics()' in activity
          assert 'clearRuntimeDiagnostics()' in activity
          assert 'diagnostics.event("cloud"' in activity
          assert 'R.raw.metal_sharp_click' not in activity
          diagnostic=Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/RuntimeDiagnostics.java').read_text()
          assert 'MAX_SESSIONS=50' in diagnostic and 'MAX_EVENTS=24' in diagnostic
          assert 'SEVEN_DAYS=7L' in diagnostic
          assert 'raw.matches("[a-zA-Z0-9_]{1,32}")' in diagnostic
          settings=Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/LargeSettingsScreen.java').read_text()
          assert 'row("运行诊断"' in settings and 'private void diagnostics()' in settings
          assert 'row("上次识别结果"' in settings
          assert settings.index('row("运行诊断"')>settings.index('row("上次识别结果"')
          assert 'CloudAsrClient.recognize(' in activity
          assert 'new VoiceRecorder()' in activity
          assert 'new LargeSettingsScreen(' in activity
          assert 'SpeechFilter.apply(' in activity
          assert 'ToneGenerator' not in activity
          assert 'R.raw.c_metal_clack_ding' in activity
          assert 'R.raw.voice_send_whoosh' in activity
          assert 'R.raw.metal_lid_click' not in activity
          assert 'R.drawable.bluestar_globe' in activity
          assert 'R.drawable.bluestar_icon' not in activity
          assert 'android:label="Blue Star Guide"' in manifest
          assert 'FrameCompressor.encodeAdjustedJpeg(' in activity
          assert 'loadCameraProfile();' in activity
          assert 'setCameraZoom(' in activity
          assert 'PREF_USB_PREVIEW_VIVID' not in activity
          assert '"逛商场"' not in tasks and '"场景识别"' not in tasks
          assert '"朗读文字"' in tasks and '"餐厅菜单"' in tasks
          assert '"医院科室"' in tasks and '"店铺招牌"' in tasks and '"商品信息"' in tasks
          assert 'TaskCatalog.updatePreset(' in activity
          assert 'android:icon="@mipmap/ic_launcher"' in manifest
          assert 'com.vobich.bluestar.cloudprobe' in app
          for bad in ['ppocr-sdk', 'PaddleOCR', 'onnxruntime', 'sherpa-onnx']:
              assert bad.lower() not in app.lower()
          assert 'setRenderMode(CameraRequest.RenderMode.NORMAL)' in activity
          assert 'now-usbShot.atMs>1400L' in activity
          assert 'CloudVisionClient.recognize(jpeg,key,task,model,' in activity
          assert 'FrameCompressor.choose(' in activity
          assert 'recordTtsProgress(' in activity
          assert 'tts.setOnUtteranceProgressListener' in activity
          assert 'SpeechChunker' in Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/CloudVisionClient.java').read_text()
          assert 'showImagePolicySelector()' in activity
          assert 'showVisionModelSelector()' in activity
          assert 'TextToSpeech.QUEUE_FLUSH' in activity
          assert 'final String OCR = "ocr"' not in tasks or 'static final String OCR = "ocr"' in tasks
          assert 'selected_task_id' in tasks and 'custom_tasks' in tasks
          assert 'extends CameraActivity' in activity
          assert 'InternalCameraController' in activity
          assert 'attachPhonePreviewAfterUsbInit();' in activity
          assert 'private void switchCameraSource(boolean phone)' in activity
          assert 'showCameraSourceSelector()' in activity
          assert '"手机后置摄像头","手机前置摄像头"' in activity
          assert 'setPreviewWidth(1920).setPreviewHeight(1080)' in activity
          assert 'new FrameLayout(this)' in activity and 'Gravity.BOTTOM' in activity
          assert 'TaskCatalog.upsert(this' in activity
          assert 'PaddleOcrEngine' not in activity
          camera2=Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/InternalCameraController.java').read_text()
          assert 'CameraManager' in camera2 and 'CameraCaptureSession' in camera2
          assert 'Nv21Rotation.rotate(' in camera2
          assert "versionCode 13" in app and "versionName '1.0.3-rc4'" in app
          assert Path('cloud-vision-app/app/src/main/res/drawable-nodpi/bluestar_globe.png').is_file()
          assert not list(Path('cloud-vision-app/app/src/main/res').rglob('ic_launcher.webp'))
          assert not list(Path('cloud-vision-app/app/src/main/res').rglob('bluestar_icon.webp'))
          assert Path('cloud-vision-app/app/src/main/res/raw/c_metal_clack_ding.mp3').is_file()
          assert Path('cloud-vision-app/app/src/main/res/raw/voice_send_whoosh.wav').is_file()
          assert not Path('cloud-vision-app/app/src/main/res/raw/metal_lid_click.wav').exists()
          assert not Path('cloud-vision-app/app/src/main/res/raw/metal_sharp_click.wav').exists()
          print('DUAL_CAMERA_CLOUD_AI_NO_LOCAL_OCR_AUDIT=PASS')
          PY
      - name: Unit checks for speech chunks and image resolution policy
        run: |
          set -euo pipefail
          mkdir -p /tmp/bluestar-unit
          javac -encoding UTF-8 -d /tmp/bluestar-unit \
            cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/SpeechChunker.java \
            cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/ImageQualityPolicy.java \
            cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/Nv21Rotation.java \
            cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/Nv21ImageOps.java \
            cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/SpeechFilter.java \
            cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/VoiceWav.java \
            cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/VoiceAction.java \
            cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/VoicePressState.java \
            cloud-vision-app/tests/VoiceFlowTest.java \
            cloud-vision-app/tests/CloudOptimizationTest.java
          java -cp /tmp/bluestar-unit com.vobich.bluestar.cloudprobe.CloudOptimizationTest
          java -cp /tmp/bluestar-unit com.vobich.bluestar.cloudprobe.VoiceFlowTest
      - name: Patch pinned Android 16 USB permission and native sampling safely
        run: |
          set -euo pipefail
          python3 scripts/patch_usbmonitor.py cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/java/com/jiangdg/usb/USBMonitor.java
          python3 cloud-vision-app/scripts/patch_pinned_uvc.py
          grep -q BSG_CLOUD_RAW5_GATED cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/jni/UVCCamera/UVCPreview.cpp
          grep -q BSG_CLOUD_CLOSE_BARRIER cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/camera/CameraUVC.kt
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use GitHub runner Android SDK (as verified by earlier 1.0.10 CI)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Rebuild all five launcher PNG densities from verified source
        run: |
          set -euo pipefail
          cd cloud-vision-app
          java scripts/GenerateLauncherIcons.java
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-$d/ic_launcher.png"
            test ! -e "app/src/main/res/mipmap-$d/ic_launcher.webp"
          done
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build isolated arm64 debug APK
        run: |
          cd cloud-vision-app
          gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug
      - name: Verify generated APK and checksum
        run: |
          set -euo pipefail
          mkdir -p cloud-vision-artifact
          cp cloud-vision-app/app/build/outputs/apk/debug/app-debug.apk cloud-vision-artifact/BlueStar_Guide_1.0.3_RC4_arm64.apk
          test -s cloud-vision-artifact/BlueStar_Guide_1.0.3_RC4_arm64.apk
          (cd cloud-vision-artifact && sha256sum *.apk > SHA256SUMS.txt)
          unzip -Z1 cloud-vision-artifact/*.apk > cloud-vision-artifact/apk-entries.txt
          grep -Fxq 'lib/arm64-v8a/libUVCCamera.so' cloud-vision-artifact/apk-entries.txt
          cd cloud-vision-app
          java scripts/VerifyPackagedLauncher.java ../cloud-vision-artifact/BlueStar_Guide_1.0.3_RC4_arm64.apk
          python3 scripts/verify_audio_assets.py ../cloud-vision-artifact/BlueStar_Guide_1.0.3_RC4_arm64.apk
          cd ..
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging cloud-vision-artifact/BlueStar_Guide_1.0.3_RC4_arm64.apk > cloud-vision-artifact/badging.txt
          grep -F "application-label:'Blue Star Guide'" cloud-vision-artifact/badging.txt
          grep -F "package: name='com.vobich.bluestar'" cloud-vision-artifact/badging.txt
          grep -q 'application-icon-' cloud-vision-artifact/badging.txt
          grep -Fxq 'res/raw/c_metal_clack_ding.mp3' cloud-vision-artifact/apk-entries.txt
          grep -Fxq 'res/raw/voice_send_whoosh.wav' cloud-vision-artifact/apk-entries.txt
          ! grep -Ei 'inference\.onnx|paddle|ppocr|sherpa|layout.*onnx' cloud-vision-artifact/apk-entries.txt
          echo 'Blue Star Guide 1.0.3 RC4: checked globe launcher PNG densities, exact selected C clack MP3, separate voice whoosh, fresh Camera2 photo capture, bounded privacy diagnostics, target auto-exit. vivo X200 Pro true runtime acceptance still required.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload 1.0 release candidate APK (debug-signed, device testing)
        uses: actions/upload-artifact@v4
        with:
          name: blue-star-guide-1-0-3-rc4-arm64
          path: cloud-vision-artifact/*
          retention-days: 7
