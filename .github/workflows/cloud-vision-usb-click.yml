          grep -q BSG_UVC_PICTURE_CONTROLS_114 cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/camera/CameraUVC.kt
          grep -q BSG_USB_AUTOSWITCH_115 cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/base/CameraActivity.kt
          grep -q BSG_UVC_FPS_61_FIRST cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/camera/CameraUVC.kt
          grep -q BSG_UVC_FPS_61_REPROBE cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/jni/UVCCamera/UVCPreview.cpp
          grep -q 'if (shouldAutoOpenUsbCameraForApp(device)) openCamera(mCameraView)' cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/base/CameraActivity.kt
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use GitHub runner Android SDK (as verified by earlier 1.0.10 CI)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Rebuild all five launcher PNG densities from verified source
        run: |
          set -euo pipefail
          cd cloud-vision-app
          java scripts/GenerateLauncherIcons.java
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-$d/ic_launcher.png"
            test ! -e "app/src/main/res/mipmap-$d/ic_launcher.webp"
          done
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build isolated arm64 debug APK
        run: |
          cd cloud-vision-app
          gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug
      - name: Verify generated APK and checksum
        run: |
          set -euo pipefail
          mkdir -p cloud-vision-artifact
          cp cloud-vision-app/app/build/outputs/apk/debug/app-debug.apk cloud-vision-artifact/BlueStar_Guide_1.0.24_RC25_arm64.apk
          test -s cloud-vision-artifact/BlueStar_Guide_1.0.24_RC25_arm64.apk
          (cd cloud-vision-artifact && sha256sum *.apk > SHA256SUMS.txt)
          unzip -Z1 cloud-vision-artifact/*.apk > cloud-vision-artifact/apk-entries.txt
          grep -Fxq 'lib/arm64-v8a/libUVCCamera.so' cloud-vision-artifact/apk-entries.txt
          cd cloud-vision-app
          java scripts/VerifyPackagedLauncher.java ../cloud-vision-artifact/BlueStar_Guide_1.0.24_RC25_arm64.apk
          python3 scripts/verify_audio_assets.py ../cloud-vision-artifact/BlueStar_Guide_1.0.24_RC25_arm64.apk
          cd ..
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging cloud-vision-artifact/BlueStar_Guide_1.0.24_RC25_arm64.apk > cloud-vision-artifact/badging.txt
          grep -F "application-label:'Blue Star Guide'" cloud-vision-artifact/badging.txt
          grep -F "package: name='com.vobich.bluestar.rc25'" cloud-vision-artifact/badging.txt
          grep -q 'application-icon-' cloud-vision-artifact/badging.txt
          grep -Fxq 'res/raw/c_metal_clack_ding.mp3' cloud-vision-artifact/apk-entries.txt
          grep -Fxq 'res/raw/voice_send_whoosh.wav' cloud-vision-artifact/apk-entries.txt
          ! grep -Ei 'inference\.onnx|paddle|ppocr|sherpa|layout.*onnx' cloud-vision-artifact/apk-entries.txt
          echo 'RC25 Reading entry now displays only two side-by-side large choices Continue Reading and New Reading under the title, with NO small subtitle or unwanted hints and no auto-starting camera. Continue opens the last book page list. Each successful photo OCR becomes one numbered page, no inferred chapters, with persistent optional title and red mark; tap to read saved original text offline, long press bottom sheet for mark / rename / delete exactly in that order; deletion is confirmed. Bottom Continue Reading launches live preview and waits for a separate physical tap to capture. RC24 three reader controls and original USB/Camera2/OCR/C line streaming TTS unchanged. Old package books are not migrated automatically. Android device acceptance still required.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload 1.0 release candidate APK (debug-signed, device testing)
        uses: actions/upload-artifact@v4
        with:
          name: blue-star-guide-1-0-24-rc25-arm64
          path: cloud-vision-artifact/*
          retention-days: 7
