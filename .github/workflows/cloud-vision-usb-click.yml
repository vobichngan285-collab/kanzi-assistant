name: Blue Star Guide 1.0.1 - Accessibility Fix RC2
on:
  push:
    branches: [exp/cloud-vision-usb-click-v1-20261106, fix/bluestar-101-voice-ui-usb-20261106]
    paths:
      - 'cloud-vision-app/**'
      - '.github/workflows/cloud-vision-usb-click.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Checkout independent experiment source
        uses: actions/checkout@v4
      - name: Checkout pinned AUSBC UVC stack
        uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: cloud-vision-app/third_party/AndroidUSBCamera
      - name: Static scope/security audit (no local OCR, no embedded API keys)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('cloud-vision-app/app/src/main/AndroidManifest.xml').read_text()
          app = Path('cloud-vision-app/app/build.gradle').read_text()
          activity = Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/MainActivity.java').read_text()
          tasks = Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/TaskCatalog.java').read_text()
          assert 'android.permission.INTERNET' in manifest
          assert 'android.permission.CAMERA' in manifest
          assert 'android.permission.RECORD_AUDIO' in manifest
          assert 'android.permission.VIBRATE' in manifest
          assert 'android:label="Blue Star Guide"' in manifest
          assert 'android:name="com.vobich.bluestar.cloudprobe.MainActivity"' in manifest
          assert "applicationId 'com.vobich.bluestar'" in app
          assert 'TaskDesktopOverlay.show(' in activity
          assert 'startVoiceFollowup()' in activity
          assert 'CloudAsrClient.recognize(' in activity
          assert 'new VoiceRecorder()' in activity
          assert 'new LargeSettingsScreen(' in activity
          assert 'SpeechFilter.apply(' in activity
          assert 'ToneGenerator' not in activity
          assert 'R.raw.metal_lid_click' in activity
          assert 'android:label="Blue Star Guide"' in manifest
          assert 'FrameCompressor.encodeAdjustedJpeg(' in activity
          assert 'loadCameraProfile();' in activity
          assert 'setCameraZoom(' in activity
          assert 'PREF_USB_PREVIEW_VIVID' not in activity
          assert '"逛商场"' not in tasks and '"场景识别"' not in tasks
          assert '"朗读文字"' in tasks and '"餐厅菜单"' in tasks
          assert '"医院科室"' in tasks and '"店铺招牌"' in tasks and '"商品信息"' in tasks
          assert 'TaskCatalog.updatePreset(' in activity
          assert 'android:icon="@mipmap/ic_launcher"' in manifest
          assert 'com.vobich.bluestar.cloudprobe' in app
          for bad in ['ppocr-sdk', 'PaddleOCR', 'onnxruntime', 'sherpa-onnx']:
              assert bad.lower() not in app.lower()
          assert 'setRenderMode(CameraRequest.RenderMode.NORMAL)' in activity
          assert 'now-current.atMs>1400L' in activity
          assert 'CloudVisionClient.recognize(jpeg,key,task,model,' in activity
          assert 'FrameCompressor.choose(' in activity
          assert 'recordTtsProgress(' in activity
          assert 'tts.setOnUtteranceProgressListener' in activity
          assert 'SpeechChunker' in Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/CloudVisionClient.java').read_text()
          assert 'showImagePolicySelector()' in activity
          assert 'showVisionModelSelector()' in activity
          assert 'TextToSpeech.QUEUE_FLUSH' in activity
          assert 'final String OCR = "ocr"' not in tasks or 'static final String OCR = "ocr"' in tasks
          assert 'selected_task_id' in tasks and 'custom_tasks' in tasks
          assert 'extends CameraActivity' in activity
          assert 'InternalCameraController' in activity
          assert 'attachPhonePreviewAfterUsbInit();' in activity
          assert 'private void switchCameraSource(boolean phone)' in activity
          assert 'showCameraSourceSelector()' in activity
          assert '"手机后置摄像头","手机前置摄像头"' in activity
          assert 'setPreviewWidth(1920).setPreviewHeight(1080)' in activity
          assert 'new FrameLayout(this)' in activity and 'Gravity.BOTTOM' in activity
          assert 'TaskCatalog.upsert(this' in activity
          assert 'PaddleOcrEngine' not in activity
          camera2=Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/InternalCameraController.java').read_text()
          assert 'CameraManager' in camera2 and 'CameraCaptureSession' in camera2
          assert 'Nv21Rotation.rotate(' in camera2
          assert "versionCode 11" in app and "versionName '1.0.1-rc2'" in app
          print('DUAL_CAMERA_CLOUD_AI_NO_LOCAL_OCR_AUDIT=PASS')
          PY
      - name: Unit checks for speech chunks and image resolution policy
        run: |
          set -euo pipefail
          mkdir -p /tmp/bluestar-unit
          javac -encoding UTF-8 -d /tmp/bluestar-unit \
            cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/SpeechChunker.java \
            cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/ImageQualityPolicy.java \
            cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/Nv21Rotation.java \
            cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/Nv21ImageOps.java \
            cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/SpeechFilter.java \
            cloud-vision-app/tests/CloudOptimizationTest.java
          java -cp /tmp/bluestar-unit com.vobich.bluestar.cloudprobe.CloudOptimizationTest
      - name: Patch pinned Android 16 USB permission and native sampling safely
        run: |
          set -euo pipefail
          python3 scripts/patch_usbmonitor.py cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/java/com/jiangdg/usb/USBMonitor.java
          python3 cloud-vision-app/scripts/patch_pinned_uvc.py
          grep -q BSG_CLOUD_RAW5_GATED cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/jni/UVCCamera/UVCPreview.cpp
          grep -q BSG_CLOUD_CLOSE_BARRIER cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/camera/CameraUVC.kt
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use GitHub runner Android SDK (as verified by earlier 1.0.10 CI)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build isolated arm64 debug APK
        run: |
          cd cloud-vision-app
          gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug
      - name: Verify generated APK and checksum
        run: |
          set -euo pipefail
          mkdir -p cloud-vision-artifact
          cp cloud-vision-app/app/build/outputs/apk/debug/app-debug.apk cloud-vision-artifact/BlueStar_Guide_1.0.1_RC2_arm64.apk
          test -s cloud-vision-artifact/BlueStar_Guide_1.0.1_RC2_arm64.apk
          (cd cloud-vision-artifact && sha256sum *.apk > SHA256SUMS.txt)
          unzip -l cloud-vision-artifact/*.apk | grep -q 'lib/arm64-v8a/libUVCCamera.so'
          unzip -Z1 cloud-vision-artifact/*.apk | grep -q 'bluestar_icon.webp'
          unzip -Z1 cloud-vision-artifact/*.apk | grep -q 'metal_lid_click.wav'
          unzip -Z1 cloud-vision-artifact/*.apk | grep -q 'ic_launcher.webp'
          ! unzip -Z1 cloud-vision-artifact/*.apk | grep -Ei 'inference\.onnx|paddle|ppocr|sherpa|layout.*onnx'
          echo 'Blue Star Guide 1.0.1 RC2: fixed launcher icon/name, large settings, Qwen ASR, metallic audio/haptic, TTS filters, single-encode NV21 pipeline. Requires real device acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload 1.0 release candidate APK (debug-signed, device testing)
        uses: actions/upload-artifact@v4
        with:
          name: blue-star-guide-1-0-1-rc2-arm64
          path: cloud-vision-artifact/*
          retention-days: 7
