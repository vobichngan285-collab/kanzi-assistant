name: Publish Verified RC9 Voice + Text Followups APK
on:
  push:
    branches: [fix/bluestar-108-voice-intent-text-followups-20261107]
    paths: ['.github/workflows/bluestar-rc9-direct-apk-release.yml']

permissions:
  actions: read
  contents: write

jobs:
  publish-verified-rc9:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Verify original RC9 source and full CI success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=42328080189
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.conclusion')"
          source="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha')"
          test "$state" = success
          test "$source" = 011e4eff29ce75093d7a3a733149aac254a89b23
      - name: Download original successful RC9 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download 42328080189 \
            --repo "$GITHUB_REPOSITORY" \
            --name blue-star-guide-1-0-8-rc9-arm64 \
            --dir verified
          test -s verified/BlueStar_Guide_1.0.8_RC9_arm64.apk
          test -s verified/SHA256SUMS.txt
          test -s verified/badging.txt
      - name: Verify original APK bytes, content and signature identity
        run: |
          set -euo pipefail
          cd verified
          sha256sum -c SHA256SUMS.txt
          echo "c2b70d7808403d370384acb38d45edbf79beab6d28a572bc211646562052ac1e  BlueStar_Guide_1.0.8_RC9_arm64.apk" | sha256sum -c -
          test "$(stat -c%s BlueStar_Guide_1.0.8_RC9_arm64.apk)" = 8567972
          unzip -tq BlueStar_Guide_1.0.8_RC9_arm64.apk >/dev/null
          unzip -Z1 BlueStar_Guide_1.0.8_RC9_arm64.apk | grep -Fx 'lib/arm64-v8a/libUVCCamera.so'
          unzip -Z1 BlueStar_Guide_1.0.8_RC9_arm64.apk | grep -Fx 'res/raw/c_metal_clack_ding.mp3'
          unzip -Z1 BlueStar_Guide_1.0.8_RC9_arm64.apk | grep -Fx 'res/raw/voice_send_whoosh.wav'
          grep -Fq "package: name='com.vobich.bluestar.rc9'" badging.txt
          grep -Fq "versionName='1.0.8-rc9'" badging.txt
          grep -Fq "application-label:'Blue Star Guide'" badging.txt
      - name: Publish verified original APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=blue-star-guide-cloud-rc9-20261107
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing replacement." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "verified/BlueStar_Guide_1.0.8_RC9_arm64.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target 011e4eff29ce75093d7a3a733149aac254a89b23 \
            --title "Blue Star Guide 1.0.8 RC9 - Voice-First Camera and Text-Only Followups" \
            --notes "Direct ARM64 APK. RC9 fixes voice-first 'look at what's in front of me': recognizes scene intent and captures a genuinely fresh camera frame without changing selected OCR task; voice 'read the text' also captures fresh OCR. Existing find-target voice commands remain. Ordinary AI followups analyze previously recognized text only using qwen3.8-flash and do NOT resend the JPEG; only explicit previous-photo reinspection includes the old image. No added text model, no silent paid-model fallback, original Max/Plus/Flash menu, opaque dark-blue settings, prompt click sounds, UVC and ASR/TTS retained. Original Android CI succeeded in run 42328080189. APK SHA256 c2b70d7808403d370384acb38d45edbf79beab6d28a572bc211646562052ac1e, size 8567972 bytes, package com.vobich.bluestar.rc9, versionCode 18. Released original CI-built APK without rebuild/re-sign. Independent RC9 install needs API Key configured again. Actual vivo X200 Pro camera and Cloud API functional validation remains necessary." \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'BlueStar_Guide_1.0.8_RC9_arm64.apk'
          echo "Public direct APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BlueStar_Guide_1.0.8_RC9_arm64.apk" >> "$GITHUB_STEP_SUMMARY"
