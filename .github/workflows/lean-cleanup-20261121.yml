name: Blue Star v1.0.71 Lean Cleanup
on:
  push:
    branches: [ 'exp/lean-cleanup-20261121' ]
    paths:
      - 'cloud-vision-app/app/**'
      - 'cloud-vision-app/tests/**'
      - 'cloud-vision-app/docs/LEAN_CLEANUP_20261121.md'
      - '.github/workflows/lean-cleanup-20261121.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validated-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: cloud-vision-app/third_party/AndroidUSBCamera
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify proven cloud camera OCR TTS paths and lean scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r=Path("cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe")
          m=(r/"MainActivity.java").read_text()
          ui=(r/"BlueStarSettingsScreen.java").read_text()
          store=(r/"CloudProviderStore.java").read_text()
          cv=(r/"CloudVisionClient.java").read_text()
          lc=(r/"LayoutParsingClient.java").read_text()
          pol=(r/"CloudProviderPolicy.java").read_text()
          cam=(r/"C110CameraActivity.java").read_text()
          quick=(r/"C110QuickShotController.java").read_text()
          reader=(r/"C110FrameReader.java").read_text()
          build=Path("cloud-vision-app/app/build.gradle").read_text()
          manifest=Path("cloud-vision-app/app/src/main/AndroidManifest.xml").read_text()
          bridge=Path("cloud-vision-app/boyuebridge/src/main/java/com/vobich/bluestar/boyuebridge/LaunchActivity.java").read_text()
          chooser=ui.split("    private void cloud(){",1)[1].split("    private static String roleTitle",1)[0]
          assert chooser.count('CloudProviderStore.activeModelDescription')==3
          assert 'navigate("provider-role",CloudProviderStore.OCR)' in chooser
          assert 'navigate("ocr-models"' not in chooser
          assert 'navigate("models"' not in chooser
          assert 'selected.isEmpty()&&id.equals(app.ocrModelDescription())' in ui
          assert 'selected.isEmpty()&&id.equals(app.visionModelDescription())' in ui
          assert 'profile.id.equals(selected)' in ui
          assert 'CloudProviderStore.select(this,CloudProviderStore.OCR,"")' in m
          assert 'CloudProviderStore.select(this,CloudProviderStore.VISION,"")' in m
          assert '当前真正生效的云端模型' in ui
          assert 'LAYOUT="layout_parsing"' in pol
          assert 'OCR.equals(role)&&LAYOUT.equals(protocol)' in pol
          assert 'CloudProviderStore.LAYOUT.equals(cfg.protocol)' in cv
          assert 'return LayoutParsingClient.recognize(jpeg,cfg,cloudNetwork)' in cv
          assert '.put("file","data:image/jpeg;base64,"+' in lc
          assert 'optString("md_results","")' in lc
          assert 'OcrResponseGate.requireReadable(markdown)' in lc
          assert 'network.openConnection(endpoint)' in lc
          assert 'setInstanceFollowRedirects(false)' in lc
          assert '.put("messages"' not in lc
          assert 'CloudProviderStore.LAYOUT' in ui
          assert 'CloudKeyStore.loadNamed(ctx,chosen.id)' in store
          assert 'upgradeKnownFastStreaming(ctx)' in store
          assert 'CloudProviderPolicy.recommendedFastStream(model,protocol)' in store
          assert 'SSE_MIGRATED' in store
          assert 'streaming.setChecked(old==null||old.stream)' in ui
          assert 'streaming.setVisibility(layout?View.GONE:View.VISIBLE)' in ui
          assert 'boolean streaming=custom?(cfg.stream&&!connectionTest)' in cv
          assert 'CloudProviderPolicy.zhipuFastVisualOcr(cfg.url,visionModel)' in cv
          assert 'body.put("thinking",new JSONObject().put("type","disabled"))' in cv
          assert 'fastZhipuOcrInstruction(' in cv and 'fastZhipuOcrInstruction(' in pol
          assert 'trialZhipuOcr&&!customPreset' in cv
          assert 'boolean keepAliveEligible=false' in cv
          assert 'if(!keepAliveEligible)connection.disconnect()' in cv
          assert 'diagnostics.event("cloud","output_chars"' in m
          assert 'diagnostics.event("cloud","after_first_text_ms"' in m
          assert 'if(cloudBusy)' in m
          assert 'static boolean zhipuFastVisualOcr(String url,String model)' in pol
          assert '"glm-4.6v-flashx".equals(name)' in pol
          assert 'open.bigmodel.cn' in pol and 'api.z.ai' in pol
          assert 'return LayoutParsingClient.recognize(jpeg,cfg,cloudNetwork)' in cv
          assert 'JSONArray content=new JSONArray()' in cv
          assert '"image_url"' in cv and 'new JSONObject().put("role","user")' in cv
          assert 'OcrSpeedExperiment.earlySpeak(ocrSpeedMode)' in cv
          assert 'OcrLineChunks ocrLines=isOcr?new OcrLineChunks():null' in cv
          assert 'OcrSpeedExperiment.earlySpeak(ocrSpeedMode)' in cv
          assert 'if(!custom&&isOcr&&OcrModelCatalog.indexOf(visionModel)<0)' in cv
          assert 'Bitmap.createBitmap(512,512,Bitmap.Config.RGB_565)' in m
          assert 'if(!CloudProviderPolicy.probeRecognizedA(result.text))' in m
          assert 'captureDing.photoSucceeded();' in cam and 'captureDing.photoSucceeded();' in quick
          assert 'photoCamera.shootAfterLivePreview(this)' in cam
          assert '--network-caching=150' in cam and '--live-caching=150' in cam
          assert 'tts.setLanguage(Locale.SIMPLIFIED_CHINESE)' in reader
          assert 'com.vobich.bluestar.cloudprobe.action.QUICK_SHOT' in bridge
          assert 'versionCode 80' in build and "versionName '1.0.71-lean-cleanup'" in build
          assert "applicationIdSuffix '.c110plusquick159'" in build
          assert manifest.count('android.intent.category.LAUNCHER')==1
          assert 'org.videolan.android:libvlc-all:3.6.5' in build
          assert "implementation project(':libausbc')" in build
          assert "implementation project(':libuvc')" in build
          assert 'androidx.media3' not in build
          assert not any('androidx.media3' in f.read_text() for f in r.glob('*.java'))
          assert 'TaskDesktopActivity.class' in (r/'HomeActivity.java').read_text()
          assert 'new Intent(this,C110CameraActivity.class)' in (r/'HomeActivity.java').read_text()
          assert 'showUnifiedModeSelector()' in m and 'cloudBusy' in m
          assert 'captureC110OneShot()' in m
          assert 'new TaskDesktopOverlay' not in m
          assert 'C110LivePreview' not in m
          assert '4003' not in (r/'C110WifiCamera.java').read_text()
          assert 'deleteDownloadedOriginal' not in (r/'C110WifiCamera.java').read_text()
          assert 'row("高级与诊断"' in ui and 'row("机身提示音"' in ui
          assert 'row("指示灯"' in ui and 'row("云端 AI"' in ui
          assert 'row("语音与提示"' in ui
          assert 'private void advanced()' in ui
          assert 'private void showC110Settings()' in cam
          assert 'C110WifiCamera.Photo photo' in cam
          for removed in ("C110DeletePolicy","C110LivePreview","C110PreviewProbe",
              "C110ResolutionLabActivity","C110ResolutionScore","C110RtspSessionProbe",
              "C110VolumeShortcut","C110VolumeTiming","TaskDesktopOverlay"):
              assert not (r/(removed+".java")).exists(),f"dead class remains: {removed}"
          print("PASS: GLM/Qwen SSE/OCR/TTS + C110 OEM/USB preserved; experimental paths removed")
          PY
          # Always compare to the published v1.0.68 baseline, not the HEAD.
          git fetch --no-tags origin +refs/heads/exp/glm-ocr-speed-20261121:refs/remotes/origin/exp/glm-ocr-speed-20261121
          git diff --name-only refs/remotes/origin/exp/glm-ocr-speed-20261121 HEAD >/tmp/changed.txt
          python3 - <<'PY'
          from pathlib import Path
          root="cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/"
          expected={root+x for x in (
              "BlueStarSettingsScreen.java","C110CameraActivity.java","C110DeletePolicy.java",
              "C110LivePreview.java","C110PreviewProbe.java","C110ResolutionLabActivity.java",
              "C110ResolutionScore.java","C110RtspSessionProbe.java","C110VolumeShortcut.java",
              "C110VolumeTiming.java","C110WifiCamera.java","MainActivity.java",
              "TaskDesktopOverlay.java")}
          expected.update({
              "cloud-vision-app/app/build.gradle",
              "cloud-vision-app/docs/LEAN_CLEANUP_20261121.md",
              ".github/workflows/lean-cleanup-20261121.yml",
              "cloud-vision-app/tests/C110DeletePolicyTest.java",
              "cloud-vision-app/tests/C110ResolutionScoreTest.java",
              "cloud-vision-app/tests/C110RtspSessionProbeTest.java",
              "cloud-vision-app/tests/C110VolumeTimingTest.java"})
          actual=set(Path("/tmp/changed.txt").read_text().splitlines())
          assert actual==expected,f"Out-of-scope modifications: unexpected={actual-expected}; missing={expected-actual}"
          print("PASS: exact 20-file v1.0.70 -> v1.0.71 change scope, including 13 deletions")
          PY
      - name: Run provider policy, task, AI prompt and C110 photo/zoom Java regressions
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-tests
          javac -d /tmp/bluestar-tests "$BASE/CloudProviderPolicy.java" cloud-vision-app/tests/CloudProviderPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudProviderPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/TaskOrder.java" cloud-vision-app/tests/TaskOrderTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.TaskOrderTest
          javac -d /tmp/bluestar-tests "$BASE/FollowupPrompt.java" cloud-vision-app/tests/FollowupPromptTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.FollowupPromptTest
          javac -d /tmp/bluestar-tests "$BASE/C110ZoomGeometry.java" cloud-vision-app/tests/C110ZoomGeometryTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.C110ZoomGeometryTest
          javac -d /tmp/bluestar-tests "$BASE/C110PhotoPolicy.java" cloud-vision-app/tests/C110PhotoPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.C110PhotoPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/OcrLineChunks.java" "$BASE/OcrSpeedExperiment.java" cloud-vision-app/tests/OcrSpeedExperimentTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.OcrSpeedExperimentTest
      - name: Apply already-proven pinned UVC patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_usbmonitor.py cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/java/com/jiangdg/usb/USBMonitor.java
          python3 cloud-vision-app/scripts/patch_pinned_uvc.py
          grep -q BSG_CLOUD_RAW5_GATED cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/jni/UVCCamera/UVCPreview.cpp
          grep -q BSG_CLOUD_CLOSE_BARRIER cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/camera/CameraUVC.kt
      - name: Generate unchanged Blue Star launcher assets
        run: |
          set -euo pipefail
          cd cloud-vision-app
          java scripts/GenerateLauncherIcons.java
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-$density/ic_launcher.png"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile full Android arm64 app
        shell: bash
        run: |
          set -euo pipefail
          cd cloud-vision-app
          gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug
      - name: Verify APK actual package, launcher, native libraries, sound and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp cloud-vision-app/app/build/outputs/apk/debug/app-debug.apk out/BlueStar_Guide_Lean_1.0.71.apk
          APK=out/BlueStar_Guide_Lean_1.0.71.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          unzip -Z1 "$APK" >out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libUVCCamera.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlc.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlcjni.so' out/entries.txt
          grep -Fxq 'res/raw/c_metal_clack_ding.mp3' out/entries.txt
          grep -Fxq 'res/raw/voice_send_whoosh.wav' out/entries.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" >out/badging.txt
          grep -Fq "package: name='com.vobich.bluestar.c110plusquick159'" out/badging.txt
          grep -Fq "versionName='1.0.71-lean-cleanup'" out/badging.txt
          grep -Fq "launchable-activity: name='com.vobich.bluestar.cloudprobe.HomeActivity'" out/badging.txt
          test "$(grep -c '^launchable-activity:' out/badging.txt)" -eq 1
          (cd out && sha256sum BlueStar_Guide_Lean_1.0.71.apk >SHA256SUMS.txt)
          cat out/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          BYTES=$(stat -c%s "$APK")
          echo "New lean APK bytes: $BYTES" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline v1.0.70 APK bytes: 56748549" >> "$GITHUB_STEP_SUMMARY"
          echo "Compared to v1.0.70: $((BYTES-56748549)) bytes (negative means smaller)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: BlueStar_Guide_Lean_1.0.71
          path: out/*
          retention-days: 14
      - name: Publish ONLY if every test and package verification passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=bluestar-lean-cleanup-20261121-v0171
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release" >&2
            exit 1
          fi
          gh release create "$TAG" out/BlueStar_Guide_Lean_1.0.71.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Blue Star v1.0.71 Lean Cleanup" \
            --notes "v1.0.71 lean experiment branched from true v1.0.70. Pruned unreachable old C110 player, OEM delete test code, dormant probes and duplicate task/model UI; combined settings into five headings; removed unreferenced Media3 graph. Original C110 live preview LibVLC, 1001 photos, phone/USB, Qwen/GLM OCR/SSE, custom API profiles, TTS and diagnostics retained. CI compile is not device acceptance and does not prove cloud speed improvement."
