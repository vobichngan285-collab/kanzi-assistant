          默认自动：真竖排长列通过几何、朝向及OCR中文证据后从右往左播报；普通横排仍走原版。无法判断时回退，可在设置里关闭自动判断。
          USB预览镜像和旋转仍仅显示；USB OCR输入方向单独选择0/90/180/270，真实OCR和独立诊断一致；ZIP同时保留原始NV21及旋转后实际OCR图像。
          独立包名 com.vobich.kanzi.x200verticalauto，可与v43共存。
          本机离线，无INTERNET权限；已通过源码和合成几何回归，但仍需真实手机对照照片逐字/听感验收。
          TXT
          sha256sum "$RUNNER_TEMP/diag-output/Kanzi_X200_AutoVertical_v49_debug.apk" > "$RUNNER_TEMP/diag-output/SHA256SUMS.txt"
          cat "$RUNNER_TEMP/diag-output/SHA256SUMS.txt" >> "$GITHUB_STEP_SUMMARY"
          echo 'X200 v49: default auto horizontal/vertical reading (without per-scan switch), skew-inflated X column widths fixed, sideways horizontal book refusal; offline OCR/TTS original text only. Real phone auto-mode A/B pending.' >> "$GITHUB_STEP_SUMMARY"
