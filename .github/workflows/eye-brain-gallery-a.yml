name: Clean upstream Gallery GPU baseline
on:
  push:
    branches: [exp/gallery-clean-gpu-20261127]
    paths: ['.github/workflows/eye-brain-gallery-a.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: google-ai-edge/gallery
          ref: 9cb31cf47c21b0ed76901ff589a52b509803edfa
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
      - name: Verify pristine upstream
        run: |
          test "$(git rev-parse HEAD)" = 9cb31cf47c21b0ed76901ff589a52b509803edfa
          git diff --exit-code
      - name: Build original Gallery
        working-directory: Android/src
        run: ./gradlew --no-daemon --max-workers=2 assembleRelease
      - name: Verify and stage
        run: |
          set -euo pipefail
          APK=Android/src/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK"
          mkdir release
          cp "$APK" release/Gallery_Clean_GPU_Baseline.apk
          cp LICENSE release/
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-clean-gpu
          path: release/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gallery-clean-gpu
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=gallery-clean-gpu-baseline-20261127
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "Clean upstream Gallery GPU baseline" --notes "Unmodified upstream 9cb31cf47c21b0ed76901ff589a52b509803edfa. No OCR overlay. Device GPU test pending." --prerelease
