name: C110 passive notification probe 0.1.0
on:
  push:
    branches: ['exp/c110-passive-event-probe-20261125']
    paths: ['c110-event-probe/**', '.github/workflows/c110-passive-event-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify isolation, no camera requests or outbound payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files=subprocess.check_output(['git','diff','--name-only','10410e60ca1103ab8799a3ec12a555f45529e525','HEAD'],text=True).splitlines()
          assert files and all(p.startswith('c110-event-probe/') or p=='.github/workflows/c110-passive-event-probe.yml' for p in files),files
          s=Path('c110-event-probe/app/src/main/java/com/vobich/bluestar/c110eventprobe/ProbeActivity.java').read_text()
          assert 'PORT=3333' in s and 'LIMIT_MS=120000' in s
          assert 'getSocketFactory().createSocket()' in s and 'getInputStream()' in s
          for x in ['getOutputStream(', 'openConnection(', 'HttpURLConnection','requestNetwork(', 'startForegroundService(', 'cmd=','/DCIM/','4003','1001']:
              assert x not in s,x
          assert 'onPause(){stopSession(' in s and 's.close()' in s
          m=Path('c110-event-probe/app/src/main/AndroidManifest.xml').read_text()
          assert m.count('<uses-permission ')==2 and '<service' not in m
          print('PASS isolated passive bounded socket probe')
          PY
      - name: Test fragmented event frames
        run: |
          mkdir -p /tmp/c110-event
          javac -d /tmp/c110-event c110-event-probe/app/src/main/java/com/vobich/bluestar/c110eventprobe/EventDecoder.java c110-event-probe/tests/EventDecoderTest.java
          java -cp /tmp/c110-event com.vobich.bluestar.c110eventprobe.EventDecoderTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build separate APK
        run: cd c110-event-probe && gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp c110-event-probe/app/build/outputs/apk/debug/app-debug.apk out/C110_Passive_Event_Probe_0.1.0.apk
          APK=out/C110_Passive_Event_Probe_0.1.0.apk
          unzip -tq "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify "$APK"
          "$AAPT" dump badging "$APK" >out/badging.txt
          grep -Fq "package: name='com.vobich.bluestar.c110eventprobe'" out/badging.txt
          grep -Fq "versionName='0.1.0'" out/badging.txt
          sha256sum "$APK" >out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: C110_Passive_Event_Probe_0.1.0
          path: out/*
      - name: Publish verified independent probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create 'c110-passive-event-probe-20261125-v010' out/C110_Passive_Event_Probe_0.1.0.apk --target "$GITHUB_SHA" --prerelease --title 'C110 passive event probe 0.1.0' --notes 'Independent, foreground-only, one TCP 3333 connection, read-only payload, two-minute limit. No capture, SD polling or deletion. Real camera events unverified.'
