name: X200 modular reading policy regression (NO APK)
on:
  push:
    branches: [test/x200-modular-reading-center-v51]
    paths:
      - 'app/src/main/java/com/vobichngan/kanzi/*.java'
      - 'scripts/*SmokeTest.java'
      - 'scripts/PublicOcrLayoutCorpusTest.java'
      - 'scripts/export_public_ocr_layout_cases.py'
      - '.github/workflows/x200-modular-reading-policy-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-routing:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compile independent reading modules and regression tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/policy"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/policy" \
            app/src/main/java/com/vobichngan/kanzi/LayoutRegion.java \
            app/src/main/java/com/vobichngan/kanzi/TextFlowRebuilder.java \
            app/src/main/java/com/vobichngan/kanzi/ReadingOrder.java \
            app/src/main/java/com/vobichngan/kanzi/RealtimeTextOrientation.java \
            app/src/main/java/com/vobichngan/kanzi/VerticalLongColumnShadow.java \
            app/src/main/java/com/vobichngan/kanzi/VerticalLongColumnLive.java \
            app/src/main/java/com/vobichngan/kanzi/TextRegionPartition.java \
            app/src/main/java/com/vobichngan/kanzi/SingleVerticalFlow.java \
            app/src/main/java/com/vobichngan/kanzi/CenterTargetTracker.java \
            app/src/main/java/com/vobichngan/kanzi/ReadingStrategyRouter.java \
            scripts/ModularReadingRoutingSmokeTest.java \
            scripts/AutoVerticalReadingSmokeTest.java \
            scripts/VerticalLongColumnLiveSmokeTest.java \
            scripts/VerticalLongColumnShadowSmokeTest.java
          java -cp "$RUNNER_TEMP/policy" ModularReadingRoutingSmokeTest
          java -cp "$RUNNER_TEMP/policy" AutoVerticalReadingSmokeTest
          java -cp "$RUNNER_TEMP/policy" VerticalLongColumnLiveSmokeTest
          java -cp "$RUNNER_TEMP/policy" VerticalLongColumnShadowSmokeTest
          echo "MODULAR_READING_POLICY_SUITE=PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify original USB/phone OCR source isolation and intact BOOK path
        run: |
          set -euo pipefail
          python3 scripts/verify_preview_ocr_isolation.py
          python3 scripts/verify_phone_camera_preview.py
          python3 scripts/verify_book_reading_fast_path.py
          grep -q 'ReadingStrategyRouter.arrange' app/src/main/java/com/vobichngan/kanzi/PaddleOcrEngine.kt
          grep -q 'if (realtime)' app/src/main/java/com/vobichngan/kanzi/PaddleOcrEngine.kt
          grep -q 'val focus = arrangeInReadingOrder' app/src/main/java/com/vobichngan/kanzi/PaddleOcrEngine.kt
          grep -q 'recognizeUsbAutomatically' app/src/main/java/com/vobichngan/kanzi/PaddleOcrEngine.kt
          echo 'SOURCE_INTEGRATION_GUARDS=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Test layout router against 100 original public licensed images / oracle annotations
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'pyarrow==18.1.0'
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://huggingface.co/datasets/sdcb/simdpaddleocr-dataset-v1/resolve/main/data/test-00000-of-00001.parquet?download=true' \
            -o "$RUNNER_TEMP/public-ocr.parquet"
          test "$(stat -c%s "$RUNNER_TEMP/public-ocr.parquet")" -gt 10000000
          python3 scripts/export_public_ocr_layout_cases.py "$RUNNER_TEMP/public-ocr.parquet" \
            > "$RUNNER_TEMP/public-layout.tsv"
          javac -encoding UTF-8 -cp "$RUNNER_TEMP/policy" \
            -d "$RUNNER_TEMP/policy" scripts/PublicOcrLayoutCorpusTest.java
          java -cp "$RUNNER_TEMP/policy" PublicOcrLayoutCorpusTest \
            "$RUNNER_TEMP/public-layout.tsv" | tee "$RUNNER_TEMP/public-policy-results.txt"
          grep -q 'PUBLIC_ONLINE_LAYOUT=PASS images=100' "$RUNNER_TEMP/public-policy-results.txt"
          cat "$RUNNER_TEMP/public-policy-results.txt" >> "$GITHUB_STEP_SUMMARY"

