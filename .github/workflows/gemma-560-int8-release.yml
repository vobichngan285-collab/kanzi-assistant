name: Gemma 560 INT8 OCR validation and APK
on:
  push:
    branches: [exp/gemma4-560-hybrid-20261126]
    paths: ['gemma-560-int8-release/**', '.github/workflows/gemma-560-int8-release.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gemma-560-int8-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified runtime and fonts
        run: |
          python -m pip install 'litert-lm==0.18.1' 'ai-edge-litert==2.4.0' 'numpy==2.5.5' pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - uses: actions/download-artifact@v4
        with:
          name: gemma560-int8-screen-candidate
          run-id: 45747168954
          github-token: ${{ github.token }}
          path: screen-candidate
      - uses: actions/download-artifact@v4
        with:
          name: gemma560-int8-screen-report
          run-id: 45747168954
          github-token: ${{ github.token }}
          path: screen-report
      - name: Recover verified reference files
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/6e5c4f1e395deb959c494953478fa5cec4b8008f/gemma-4-E2B-it.litertlm' -o gallery.litertlm
          curl -fL --retry 3 'https://github.com/vobichngan285-collab/kanzi-assistant/releases/download/bluestar-gemma-v016-560-recovery-20261126/BlueStar_Gemma_560_Recovery_0.1.6.apk' -o baseline.apk
          echo 'e2252e18187f948eacae234ec67b5b9718db92b29a4d89f6bc9d97e40821a61e  baseline.apk' | sha256sum -c -
          unzip -q baseline.apk 'assets/adapter.tflite' 'assets/encoder.tflite' 'assets/header.bin' 'assets/metadata.bin' 'assets/model.properties' -d baseline-assets
          rm baseline.apk
      - name: Reassemble and validate complete model
        run: |
          set -o pipefail
          mkdir -p e2e-report
          python -u gemma-560-int8-release/pack.py 2>&1 | tee e2e-report/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemma560-int8-e2e-report
          path: e2e-report/
      - uses: actions/upload-artifact@v4
        with:
          name: gemma560-int8-verified-assets
          path: verified-assets/
          compression-level: 0
  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: gemma560-int8-verified-assets
          path: gemma-vision-lab/app/src/main/assets
      - uses: actions/download-artifact@v4
        with:
          name: gemma560-int8-e2e-report
          path: e2e-report
      - name: Configure isolated INT8 Android build and verify gate
        run: |
          set -euo pipefail
          jq -e '.pass == true' e2e-report/ocr.json
          cp gemma-560-int8-release/build.gradle.kts gemma-vision-lab/app/build.gradle.kts
          cp gemma-560-int8-release/MainActivity.kt gemma-vision-lab/app/src/main/java/com/vobich/bluestar/gemmalab/MainActivity.kt
          cp gemma-560-int8-release/README.md gemma-vision-lab/README.md
          echo "$(jq -r .candidate_sha e2e-report/ocr.json)  gemma-vision-lab/app/src/main/assets/encoder.tflite" | sha256sum -c -
          grep -Fx "sha256=$(jq -r .model_sha e2e-report/ocr.json)" gemma-vision-lab/app/src/main/assets/model.properties
      - name: Test and build independent APK
        working-directory: gemma-vision-lab
        run: gradle --no-daemon --max-workers=2 :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify signature, identity, offline permission and native runtime
        run: |
          set -euo pipefail
          APK=gemma-vision-lab/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | tee badging.txt
          grep -F "package: name='com.vobich.bluestar.gemmalab.vision560.int8' versionCode='8' versionName='0.1.7'" badging.txt
          grep -F "launchable-activity: name='com.vobich.bluestar.gemmalab.MainActivity'" badging.txt
          ! grep -F "android.permission.INTERNET" badging.txt
          unzip -Z1 "$APK" > archive.txt
          grep -E '^lib/arm64-v8a/.*litert.*\.so$' archive.txt
          ! grep -E '^lib/(x86|x86_64|armeabi-v7a)/' archive.txt
          python - <<'PY'
          import zipfile,hashlib,pathlib
          apk=pathlib.Path("gemma-vision-lab/app/build/outputs/apk/release/app-release.apk")
          assert apk.stat().st_size<1_900_000_000
          with zipfile.ZipFile(apk) as z:
              with z.open("lib/arm64-v8a/liblitertlm_jni.so") as jni:
                  assert hashlib.file_digest(jni,"sha256").hexdigest()=="cf4c55139c6fc86425ecfe75f8a907e6193ca665ecc19fbabcaba7ab361bdc43"
          with zipfile.ZipFile(apk) as z:
              for p in pathlib.Path("gemma-vision-lab/app/src/main/assets").iterdir():
                  with z.open("assets/"+p.name) as f, p.open("rb") as src:
                      assert hashlib.file_digest(f,"sha256").digest()==hashlib.file_digest(src,"sha256").digest(),p
          PY
          mkdir -p release
          cp "$APK" release/BlueStar_Gemma_560_INT8_0.1.7.apk
          cp gemma-vision-lab/README.md e2e-report/ocr.json release/
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: bluestar-gemma-v017
          path: release/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bluestar-gemma-v017
          path: release
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS.txt)
          TAG=bluestar-gemma-v017-560-int8-20261126
          retry() { for i in 1 2 3 4; do "$@" && return 0; sleep $((i*3)); done; return 1; }
          if ! gh release view "$TAG" --json targetCommitish >/dev/null 2>&1; then
            retry gh release create "$TAG" --target "$GITHUB_SHA" --title "蓝星 Gemma 560 INT8 实验 v0.1.7" --notes-file release/README.md --prerelease --draft
          fi
          gh release view "$TAG" --json targetCommitish | jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha'
          retry gh release upload "$TAG" release/* --clobber
          retry gh release edit "$TAG" --draft=false --prerelease
