name: Blue Star v1.0.79 Fixed-Length Photo HTTP Upload
on:
  push:
    branches: [ 'exp/fixed-length-photo-upload-20261123' ]
    paths:
      - 'cloud-vision-app/app/**'
      - 'cloud-vision-app/docs/PHOTO_FIXED_LENGTH_STREAM_UPLOAD_20261123.md'
      - '.github/workflows/photo-fixed-length-upload-20261123.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validated-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: cloud-vision-app/third_party/AndroidUSBCamera
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify ONLY HTTP fixed-length photo POST, no changes to camera resolution or models
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='83077e40dd4cbcc8099635a8167a413a17260648'
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          prefix='cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/'
          permitted={
              '.github/workflows/photo-fixed-length-upload-20261123.yml',
              'cloud-vision-app/app/build.gradle',
              'cloud-vision-app/docs/PHOTO_FIXED_LENGTH_STREAM_UPLOAD_20261123.md',
              prefix+'CloudVisionClient.java',
              prefix+'TargetVisionClient.java',
              prefix+'LayoutParsingClient.java',
          }
          assert changed==permitted, ('Changed beyond isolated upload experiment',sorted(changed^permitted))
          def read(name):return Path(prefix+name).read_text()
          main=read('MainActivity.java')
          cloud=read('CloudVisionClient.java')
          target=read('TargetVisionClient.java')
          layout=read('LayoutParsingClient.java')
          cam=read('InternalCameraController.java')
          still=read('PhoneStillJpeg.java')
          compressor=read('FrameCompressor.java')
          quick=read('C110QuickShotController.java')
          c110=read('C110WifiCamera.java')
          gradle=Path('cloud-vision-app/app/build.gradle').read_text()
          # Restrict the image-request-only change to the 3 existing JSON POST clients.
          assert cloud.count('setFixedLengthStreamingMode(')==1
          assert target.count('setFixedLengthStreamingMode(')==1
          assert layout.count('setFixedLengthStreamingMode(')==1
          assert 'if(!textOnly)connection.setFixedLengthStreamingMode(request.length);' in cloud
          assert 'byte[] request=body.toString().getBytes(StandardCharsets.UTF_8);' in cloud
          assert 'byte[] request=body.toString().getBytes(StandardCharsets.UTF_8);' in target
          assert 'byte[] request=payload.toString().getBytes(StandardCharsets.UTF_8);' in layout
          assert 'c.setFixedLengthStreamingMode(request.length);' in target
          assert 'c.setFixedLengthStreamingMode(request.length);' in layout
          assert 'setChunkedStreamingMode' not in cloud+target+layout
          assert 'request.length' in cloud+target+layout
          for text,name in [(cloud,'CloudVisionClient'),(target,'TargetVisionClient'),
                            (layout,'LayoutParsingClient')]:
              fixed=text.index('setFixedLengthStreamingMode(request.length)')
              output=text.index('getOutputStream()',fixed)
              assert fixed<output,(name,'streaming mode must precede getOutputStream')
              assert 'out.write(request)' in text,(name,'must send complete original bytes')
          # Strictly preserve stream RESPONSE/SSE and cancellation,
          # previously verified 1200万/720p and latest-photo priority.
          assert 'stream_options' in cloud and 'include_usage' in cloud
          assert 'new BufferedReader(' in cloud and 'while((line=reader.readLine())!=null)' in cloud
          assert 'if(cancel!=null)cancel.attach(connection)' in cloud
          assert 'if(cancel!=null)cancel.detach(connection)' in cloud
          assert 'CloudVisionClient.Cancellation' in main and 'photoCloudExecutor' in main
          assert 'c110NativeShutterBusy' in main and 'pendingPhoneStillToken>=0' in main
          assert 'MAX_UPLOAD_PIXELS=12000000L' in still
          assert 'target=(double)PhoneStillJpeg.MAX_UPLOAD_PIXELS' in cam
          assert 'CameraDevice.TEMPLATE_STILL_CAPTURE' in cam
          assert 'LONG_1080 = 1920' in compressor
          assert 'shootAfterLivePreview' in c110 and 'shutterPending' in quick
          assert 'versionCode 88' in gradle
          assert "versionName '1.0.79-photo-stream-upload'" in gradle
          assert "applicationIdSuffix '.c110plusquick159'" in gradle
          assert "org.videolan.android:libvlc-all:3.6.5" in gradle
          assert "implementation project(':libausbc')" in gradle
          assert "implementation project(':libuvc')" in gradle
          print('PASS: exact 6-file upload-only scope; true UTF-8 byte lengths and fixed')
          print('      streaming before output open; text-only unchanged; SSE/cancellation,')
          print('      12MP Camera2 JPEG, 720p fast, C110 shutter, USB and TTS protected')
          PY
      - name: Run vendor allow-list, task and C110 pure Java regressions
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-tests
          javac -d /tmp/bluestar-tests "$BASE/CloudProviderPolicy.java" cloud-vision-app/tests/CloudProviderPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudProviderPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/CloudProviderPolicy.java" "$BASE/CloudThinkingPolicy.java" cloud-vision-app/tests/CloudThinkingPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudThinkingPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/VisionModelCatalog.java" "$BASE/OcrModelCatalog.java" cloud-vision-app/tests/CloudServerListTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudServerListTest
          javac -d /tmp/bluestar-tests "$BASE/VoiceAction.java" cloud-vision-app/tests/VoiceActionSharedTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.VoiceActionSharedTest
          javac -d /tmp/bluestar-tests "$BASE/ProviderKeyReusePolicy.java" cloud-vision-app/tests/ProviderKeyReusePolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.ProviderKeyReusePolicyTest
          javac -d /tmp/bluestar-tests "$BASE/TaskOrder.java" cloud-vision-app/tests/TaskOrderTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.TaskOrderTest
          javac -d /tmp/bluestar-tests "$BASE/FollowupPrompt.java" cloud-vision-app/tests/FollowupPromptTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.FollowupPromptTest
          javac -d /tmp/bluestar-tests "$BASE/C110ZoomGeometry.java" cloud-vision-app/tests/C110ZoomGeometryTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.C110ZoomGeometryTest
          javac -d /tmp/bluestar-tests "$BASE/C110PhotoPolicy.java" cloud-vision-app/tests/C110PhotoPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.C110PhotoPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/OcrLineChunks.java" "$BASE/OcrSpeedExperiment.java" cloud-vision-app/tests/OcrSpeedExperimentTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.OcrSpeedExperimentTest
      - name: Apply already-proven pinned UVC patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_usbmonitor.py cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/java/com/jiangdg/usb/USBMonitor.java
          python3 cloud-vision-app/scripts/patch_pinned_uvc.py
          grep -q BSG_CLOUD_RAW5_GATED cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/jni/UVCCamera/UVCPreview.cpp
          grep -q BSG_CLOUD_CLOSE_BARRIER cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/camera/CameraUVC.kt
      - name: Generate unchanged Blue Star launcher assets
        run: |
          set -euo pipefail
          cd cloud-vision-app
          java scripts/GenerateLauncherIcons.java
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-$density/ic_launcher.png"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile full Android arm64 app
        shell: bash
        run: |
          set -euo pipefail
          cd cloud-vision-app
          gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug
      - name: Verify APK actual package, launcher, native libraries, sound and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp cloud-vision-app/app/build/outputs/apk/debug/app-debug.apk out/BlueStar_Guide_Photo_Stream_1.0.79.apk
          APK=out/BlueStar_Guide_Photo_Stream_1.0.79.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          unzip -Z1 "$APK" >out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libUVCCamera.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlc.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlcjni.so' out/entries.txt
          grep -Fxq 'res/raw/c_metal_clack_ding.mp3' out/entries.txt
          grep -Fxq 'res/raw/voice_send_whoosh.wav' out/entries.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" >out/badging.txt
          grep -Fq "package: name='com.vobich.bluestar.c110plusquick159'" out/badging.txt
          grep -Fq "versionName='1.0.79-photo-stream-upload'" out/badging.txt
          grep -Fq "launchable-activity: name='com.vobich.bluestar.cloudprobe.HomeActivity'" out/badging.txt
          test "$(grep -c '^launchable-activity:' out/badging.txt)" -eq 1
          (cd out && sha256sum BlueStar_Guide_Photo_Stream_1.0.79.apk >SHA256SUMS.txt)
          cat out/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          BYTES=$(stat -c%s "$APK")
          echo "New v1.0.79 APK bytes: $BYTES" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline v1.0.78 APK bytes: 53534155" >> "$GITHUB_STEP_SUMMARY"
          echo "Compared to v1.0.78: $((BYTES-53534155)) bytes (negative means smaller)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: BlueStar_Guide_Photo_Stream_1.0.79
          path: out/*
          retention-days: 14
      - name: Publish ONLY if every test and package verification passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=bluestar-photo-fixed-stream-20261123-v0179
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release" >&2
            exit 1
          fi
          gh release create "$TAG" out/BlueStar_Guide_Photo_Stream_1.0.79.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Blue Star v1.0.79 Fixed-Length Photo Upload" \
            --notes "v1.0.79 isolates fixed-length streaming POST for photo JSON only in existing CloudVisionClient (image requests, not text-only chat), TargetVisionClient, and LayoutParsingClient. A known UTF-8 byte length is passed to HttpURLConnection before getOutputStream, avoiding a second full HTTP body buffer. The JSON, model, prompt, JPEG and 12MP quality, quick 720p, latest-photo cancellation, SSE response, C110, UVC, TTS, UI and keys remain unchanged. CI verified scope, regressions, Android compile and APK; real upload latency and third-party API compatibility require user device A/B against 1.0.78. Upload_ms now measures a different write path and is not directly comparable with v1.0.78."
