name: Blue Star v1.0.86 Actual JPEG Metrics and Capture Dings
on:
  push:
    branches: [ 'exp/quick-photo-ding-measurements-v0186-20261124' ]
    paths:
      - 'cloud-vision-app/app/**'
      - 'cloud-vision-app/docs/QUICK_PHOTO_DING_METRICS_V0186.md'
      - '.github/workflows/quick-photo-ding-metrics-v0186.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validated-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: cloud-vision-app/third_party/AndroidUSBCamera
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify 7-file v1.0.86 scope and real JPEG/PixelCopy ding and numeric metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='d27b336e4ec1d37270fa18d48a9412790a5fbd95'
          prefix='cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/'
          expected={
            '.github/workflows/quick-photo-ding-metrics-v0186.yml',
            'cloud-vision-app/docs/QUICK_PHOTO_DING_METRICS_V0186.md',
            'cloud-vision-app/app/build.gradle',
            *{prefix+x for x in ['QuickPhotoActivity.java','C110FrameReader.java',
                                 'C110QuickShotController.java','C110CameraActivity.java']}
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed==expected,('Unexpected modified files',sorted(changed^expected))
          src=lambda n:Path(prefix+n).read_text()
          photo=src('QuickPhotoActivity.java')
          reader=src('C110FrameReader.java')
          shot=src('C110QuickShotController.java')
          camera=src('C110CameraActivity.java')
          ding=src('CaptureDingFeedback.java')
          net=src('C110WifiBootstrap.java')
          home=src('HomeActivity.java')
          still=src('PhoneStillJpeg.java')
          gradle=Path('cloud-vision-app/app/build.gradle').read_text()
          # True JPEG capture, after-success sound and no autofocus/preview rewrite.
          assert 'phone.requestStillPhoto(new InternalCameraController.StillListener()' in photo
          assert 'if(captureDing!=null)captureDing.photoSucceeded();' in photo
          assert photo.index('setCaptured(w,h,shotMs)')<photo.index('captureDing.photoSucceeded()')
          assert 'frameReader.setFrameCaptureFeedback' in camera
          assert 'if(frameCaptureFeedback!=null)frameCaptureFeedback.run();' in reader
          assert reader.index('if(status!=PixelCopy.SUCCESS)')<reader.index('frameCaptureFeedback.run();')
          assert 'photoSucceeded()' in ding and 'R.raw.c_metal_clack_ding' in ding
          assert 'shutter_feedback_sound' in ding
          # Only genuinely delivered camera dimensions and user-selected JPEG,
          # no hardcoded 3712/2088/1440 as fake measured values.
          assert 'setCaptured(w,h,shotMs)' in photo
          assert 'onCaptured(width,height,captureMs)' in reader
          assert 'onUpload(uw,uh,ub)' in reader
          assert 'onUpload(width,height,jpeg.length)' in reader
          assert 'onRecognized(result.networkMs)' in reader
          assert 'recognizePreparedPhoneJpeg(' in photo and 'phoneDiag,phoneStartedMs' in photo
          assert 'phoneDiag.begin("phone_quick")' in photo
          assert 'photoDiag.begin("c110_photo")' in reader
          assert 'photoDiag.event("c110","photo_total_ms",captureMs,"ok")' in reader
          for s in ['"raw_width_px"','"raw_height_px"','"phone_still_ms"']:
              assert s in photo
          for s in ['"width_px"','"height_px"','"bytes"','"upload_ms"','"network_ms"']:
              assert s in reader
          for s in ['"实际拍摄："','"云端上传："','"拍照耗时："','"识别耗时："']:
              assert s in photo
          assert 'value>=0?value+" ms":"待测"' in photo
          assert '"已识别："+task.name' in reader  # original pipeline diagnostics untouched
          assert 'new String[]{"连接已记住的相机："+remembered,"重新搜索相机 Wi-Fi"}' in src('MainActivity.java')
          assert 'if(cameraWifi!=null)cameraWifi.startAtLaunch();' in home
          assert 'phone.start(front,true);' in photo
          assert 'PhoneStillJpeg.prepare(' in photo
          assert 'C110WifiCamera.requireCellular(activity)' in reader
          assert 'c110.trigger()' in photo
          assert 'Bitmap.CompressFormat.JPEG,90' in still
          assert 'versionCode 95' in gradle
          assert "versionName '1.0.86-quick-photo-ding-metrics'" in gradle
          assert "applicationIdSuffix '.c110plusquick159'" in gradle
          assert 'org.videolan.android:libvlc-all:3.6.5' in gradle
          print('PASS v1.0.86 exact seven-file scope, successful physical JPEG/PixelCopy dings')
          print('PASS raw JPEG/upload JPEG/physical shutter/network recognition metrics and same local diagnostics')
          print('PASS C110 auto-WiFi, camera OEM, upload policy, voice engine, USB and home/task unchanged')
          PY
      - name: Run vendor allow-list, task and C110 pure Java regressions
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-tests
          javac -d /tmp/bluestar-tests "$BASE/CloudProviderPolicy.java" cloud-vision-app/tests/CloudProviderPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudProviderPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/CloudProviderPolicy.java" "$BASE/CloudThinkingPolicy.java" cloud-vision-app/tests/CloudThinkingPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudThinkingPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/VisionModelCatalog.java" "$BASE/OcrModelCatalog.java" cloud-vision-app/tests/CloudServerListTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudServerListTest
          javac -d /tmp/bluestar-tests "$BASE/VoiceAction.java" cloud-vision-app/tests/VoiceActionSharedTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.VoiceActionSharedTest
          javac -d /tmp/bluestar-tests "$BASE/ProviderKeyReusePolicy.java" cloud-vision-app/tests/ProviderKeyReusePolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.ProviderKeyReusePolicyTest
          javac -d /tmp/bluestar-tests "$BASE/TaskOrder.java" cloud-vision-app/tests/TaskOrderTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.TaskOrderTest
          javac -d /tmp/bluestar-tests "$BASE/FollowupPrompt.java" cloud-vision-app/tests/FollowupPromptTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.FollowupPromptTest
          javac -d /tmp/bluestar-tests "$BASE/C110ZoomGeometry.java" cloud-vision-app/tests/C110ZoomGeometryTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.C110ZoomGeometryTest
          javac -d /tmp/bluestar-tests "$BASE/C110PhotoPolicy.java" cloud-vision-app/tests/C110PhotoPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.C110PhotoPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/OcrLineChunks.java" "$BASE/OcrSpeedExperiment.java" cloud-vision-app/tests/OcrSpeedExperimentTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.OcrSpeedExperimentTest
      - name: Run independent pure-Java phone upload-size tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-phone-upload-tests
          javac -d /tmp/bluestar-phone-upload-tests "$BASE/PhoneStillUploadPolicy.java" cloud-vision-app/tests/PhoneStillUploadPolicyTest.java
          java -cp /tmp/bluestar-phone-upload-tests com.vobich.bluestar.cloudprobe.PhoneStillUploadPolicyTest
      - name: Run C110 1440P toggle and original-byte restoration policy tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-c110-upload-toggle-tests
          javac -d /tmp/bluestar-c110-upload-toggle-tests "$BASE/C110PhotoUploadPolicy.java" cloud-vision-app/tests/C110PhotoUploadPolicyTest.java
          java -cp /tmp/bluestar-c110-upload-toggle-tests com.vobich.bluestar.cloudprobe.C110PhotoUploadPolicyTest
      - name: Pure-Java first pairing and auto-reconnect regression tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-wifi-pair
          javac -d /tmp/bluestar-wifi-pair "$BASE/C110WifiPairingPolicy.java" cloud-vision-app/tests/C110WifiPairingPolicyTest.java
          java -cp /tmp/bluestar-wifi-pair com.vobich.bluestar.cloudprobe.C110WifiPairingPolicyTest
      - name: Apply already-proven pinned UVC patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_usbmonitor.py cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/java/com/jiangdg/usb/USBMonitor.java
          python3 cloud-vision-app/scripts/patch_pinned_uvc.py
          grep -q BSG_CLOUD_RAW5_GATED cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/jni/UVCCamera/UVCPreview.cpp
          grep -q BSG_CLOUD_CLOSE_BARRIER cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/camera/CameraUVC.kt
      - name: Generate unchanged Blue Star launcher assets
        run: |
          set -euo pipefail
          cd cloud-vision-app
          java scripts/GenerateLauncherIcons.java
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-$density/ic_launcher.png"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile full Android arm64 app
        shell: bash
        run: |
          set -euo pipefail
          cd cloud-vision-app
          gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug
      - name: Verify APK actual package, launcher, native libraries, sound and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp cloud-vision-app/app/build/outputs/apk/debug/app-debug.apk out/BlueStar_Guide_Quick_Photo_Ding_Metrics_1.0.86.apk
          APK=out/BlueStar_Guide_Quick_Photo_Ding_Metrics_1.0.86.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          unzip -Z1 "$APK" >out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libUVCCamera.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlc.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlcjni.so' out/entries.txt
          grep -Fxq 'res/raw/c_metal_clack_ding.mp3' out/entries.txt
          grep -Fxq 'res/raw/voice_send_whoosh.wav' out/entries.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" >out/badging.txt
          grep -Fq "package: name='com.vobich.bluestar.c110plusquick159'" out/badging.txt
          grep -Fq "versionName='1.0.86-quick-photo-ding-metrics'" out/badging.txt
          grep -Fq "launchable-activity: name='com.vobich.bluestar.cloudprobe.HomeActivity'" out/badging.txt
          test "$(grep -c '^launchable-activity:' out/badging.txt)" -eq 1
          (cd out && sha256sum BlueStar_Guide_Quick_Photo_Ding_Metrics_1.0.86.apk >SHA256SUMS.txt)
          cat out/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          BYTES=$(stat -c%s "$APK")
          echo "New v1.0.86 APK bytes: $BYTES" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline v1.0.85 APK bytes: 53550567" >> "$GITHUB_STEP_SUMMARY"
          echo "Compared to v1.0.85: $((BYTES-53550567)) bytes (negative means smaller)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: BlueStar_Guide_Quick_Photo_Ding_Metrics_1.0.86
          path: out/*
          retention-days: 14
      - name: Publish ONLY if every test and package verification passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=bluestar-quick-photo-ding-metrics-20261124-v0186
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release" >&2
            exit 1
          fi
          gh release create "$TAG" out/BlueStar_Guide_Quick_Photo_Ding_Metrics_1.0.86.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Blue Star v1.0.86 Real JPEG Metrics and Capture Dings" \
            --notes "v1.0.86 repairs: QuickPhoto phone Camera2 success now plays the configured existing metal ding once only after actual JPEG, and C110 VLC PixelCopy click only dings after PixelCopy.SUCCESS. C110 1001 shutter ding remains untouched. QuickPhoto bottom strip no longer repeats task and OCR descriptions: it shows actual source, real raw photo JPEG dimensions, actual prepared cloud JPEG dimensions, physical capture elapsed time, and CloudVisionClient.Result.networkMs for completed request; unavailable values show 待测. Both paths use the same numeric device-provided data and no hardcoded dimensions. New phone_quick privacy-limited diagnostic session records raw dimensions, photo ms, final JPEG dimensions+bytes and cloud timing. Existing C110 diagnostic adds true photo_total_ms for QuickPhoto 1001. No changes to C110 Wi-Fi auto-connect/3012, 1001 hardware, LibVLC, JPEG resizing policy, models, OCR TTS logic, original task desktop or USB. Exact seven-file diff vs published 1.0.85, build+regressions+UVC patch+asset/launcher SHA256 checks passed. Android hardware must still verify actual speaker ding and image dimensions. Cover-install over current APK to preserve credentials."
