name: Blue Star C110 Unified Mode and Device Controls v0.1.14
on:
  push:
    branches: [ 'exp/c110-unified-modes-controls-20261119' ]
    paths:
      - 'cloud-vision-app/**'
      - '.github/workflows/c110-unified-controls-20261119.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  c110-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the exact pinned UVC stack used for RC25
        uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: cloud-vision-app/third_party/AndroidUSBCamera
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Java C110 protocol unit tests and isolation assertions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bluestar-c110-test
          SRC=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          javac -d /tmp/bluestar-c110-test "$SRC/C110PhotoPolicy.java" cloud-vision-app/tests/C110PhotoPolicyTest.java
          java -cp /tmp/bluestar-c110-test com.vobich.bluestar.cloudprobe.C110PhotoPolicyTest
          mkdir -p /tmp/bluestar-c110-stub/android/net
          cat > /tmp/bluestar-c110-stub/android/net/Network.java <<'JAVA'
          package android.net;
          public class Network {
              public javax.net.SocketFactory getSocketFactory() {
                  return javax.net.SocketFactory.getDefault();
              }
          }
          JAVA
          javac -d /tmp/bluestar-c110-test \
            /tmp/bluestar-c110-stub/android/net/Network.java \
            "$SRC/C110RtspSessionProbe.java" cloud-vision-app/tests/C110RtspSessionProbeTest.java
          java -cp /tmp/bluestar-c110-test com.vobich.bluestar.cloudprobe.C110RtspSessionProbeTest
          python3 - <<'PY'
          from pathlib import Path
          root=Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe')
          main=(root/'MainActivity.java').read_text()
          page=(root/'C110CameraActivity.java').read_text()
          controls=(root/'C110DeviceControls.java').read_text()
          mini=Path('cloud-vision-app/c110mini/src/main/java/com/vobich/bluestar/c110mini/OemVideoActivity.java').read_text()
          manifest=Path('cloud-vision-app/app/src/main/AndroidManifest.xml').read_text()
          gradle=Path('cloud-vision-app/app/build.gradle').read_text()
          overlay=(root/'TaskDesktopOverlay.java').read_text()
          def core(source):
              return source.split('    private void begin(){',1)[1].split('    private void runWhenCurrent(',1)[0]
          assert core(page).replace('            deviceControls.onCameraConnected(wifi);\n','')==core(mini), 'Proven OEM video core changed beyond one post-connect hook'
          assert 'new VLCVideoLayout(this)' in page
          assert 'root.addView(video,new FrameLayout.LayoutParams(-1,-1));' in page
          assert 'player.attachViews(video,null,false,false)' in page
          assert 'main.postDelayed(delayedPlay,300)' in page and page.count('active.play();')==1
          assert 'main.post(this::begin);' in page
          assert 'setRequestedOrientation' not in page
          assert 'startActivityForResult(new Intent(this,C110CameraActivity.class)' in main
          assert 'new C110LivePreview(this)' not in main
          assert r'createControlButton("◉\n模式"' in main
          assert r'createControlButton("▤\n拍照识别"' in main
          assert 'settingsButton.setText("☰")' in main
          assert 'new Button[]{modeButton,startButton,c110Button,cameraEntryButton}' in main
          assert 'handleVoiceButtonTouch(event)' in main
          assert 'case "photo":captureC110OneShot();' in main
          assert 'case "reading":openReadingMode();' in main
          assert 'new Button[]{taskButton,aiButton,photoButton,modeButton}' in page
          assert 'TaskDesktopOverlay.show(this,TaskCatalog.all(this)' in page
          assert 'returnToMain("photo")' in page
          assert 'returnToMain("ai")' in page
          assert 'deviceControls.showSettings()' in page
          assert 'openReading(){openReadingMode();}' in main
          assert 'listener.openReading()' in overlay
          assert 'captureC110OneShot()' in main and 'photo.jpeg,cellular' in main
          assert 'getInt(LIGHT_SECONDS,30)' in controls
          assert 'main.postDelayed(pendingOff,seconds*1000L)' in controls
          assert 'verifyStandardCamera(wifi)' in controls
          assert 'main.removeCallbacks(pendingOff)' in controls
          assert '((cmd==9011||cmd==9038)&&(par==0||par==1))' in controls
          assert 'C110_PRO' in controls and 'C110 PLUS' in controls
          assert 'cmd==9036' not in controls, 'Strobe must stay excluded from integrated settings'
          assert '<activity android:name=".C110CameraActivity"' in manifest
          assert 'android:screenOrientation="portrait"' in manifest
          assert "applicationIdSuffix '.c110modes'" in gradle
          assert "versionName '1.0.39-c110-unified-lab'" in gradle
          print('PASS: video core verified except one post-connect control hook; mode/menu/task/photo/LED/sound integration guarded')
          PY
      - name: Apply the same safe pinned USB patches as RC25
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_usbmonitor.py cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/java/com/jiangdg/usb/USBMonitor.java
          python3 cloud-vision-app/scripts/patch_pinned_uvc.py
          grep -q BSG_CLOUD_RAW5_GATED cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/jni/UVCCamera/UVCPreview.cpp
          grep -q BSG_CLOUD_CLOSE_BARRIER cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/camera/CameraUVC.kt
      - name: Generate verified original launcher resources
        run: |
          cd cloud-vision-app
          java scripts/GenerateLauncherIcons.java
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-$d/ic_launcher.png"
          done
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble arm64 integration APK
        shell: bash
        run: |
          set -euo pipefail
          cd cloud-vision-app
          gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug
      - name: Verify APK identity, native library, TTS audio, version and ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp cloud-vision-app/app/build/outputs/apk/debug/app-debug.apk out/BlueStar_Guide_C110_Unified_0.1.14.apk
          test -s out/BlueStar_Guide_C110_Unified_0.1.14.apk
          unzip -tq out/*.apk >/dev/null
          unzip -Z1 out/*.apk >out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libUVCCamera.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlc.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlcjni.so' out/entries.txt
          grep -Fxq 'res/raw/c_metal_clack_ding.mp3' out/entries.txt
          grep -Fxq 'res/raw/voice_send_whoosh.wav' out/entries.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging out/*.apk >out/badging.txt
          grep -Fq "package: name='com.vobich.bluestar.c110modes'" out/badging.txt
          grep -Fq "versionName='1.0.39-c110-unified-lab'" out/badging.txt
          grep -q 'application-icon-' out/badging.txt
          (cd out && sha256sum BlueStar_Guide_C110_Unified_0.1.14.apk > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: BlueStar_Guide_C110_Unified_0.1.14
          path: out/*
          retention-days: 14
      - name: Publish isolated prerelease only if unused tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=bluestar-c110-unified-controls-20261119-v0114
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing C110 integrated prerelease, refusing overwrite" >&2
            exit 1
          fi
          gh release create "$TAG" "out/BlueStar_Guide_C110_Unified_0.1.14.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Blue Star Guide C110 Portrait OEM Player Stage1 v0.1.13" \
            --notes "Isolated unified camera layout: bottom Tasks, AI talk, Photo, Mode; mode menu Phone/C110/USB; C110 page carries settings, 9011 mute and guarded 9038 timed indicator control default 30s with custom delay. C110 proven OEM video core unchanged except post-start independent settings callback. C110 full photo and AI recording reuse MainActivity via one action return; do not imply uninterrupted player for those actions. Build verification only, new package; RC25 and original mini unchanged. Real C110 in-app functionality requires handset acceptance tests."