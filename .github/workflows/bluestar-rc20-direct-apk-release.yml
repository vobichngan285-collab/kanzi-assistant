name: Publish verified RC20 OCR A-B-C speed experiment APK
on:
  push:
    branches: [exp/bluestar-120-ocr-abc-stream-speed-20261107]
    paths: ['.github/workflows/bluestar-rc20-direct-apk-release.yml']

permissions:
  actions: read
  contents: write

jobs:
  publish-verified-rc20:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Require exact successful RC20 Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=42384203882
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha')" = 7a29d563ab79d94739ab9568dd6e6988270483fb
      - name: Download official original CI APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download 42384203882 \
            --repo "$GITHUB_REPOSITORY" \
            --name blue-star-guide-1-0-19-rc20-arm64 --dir verified
          test -s verified/BlueStar_Guide_1.0.19_RC20_arm64.apk
          test -s verified/SHA256SUMS.txt
          test -s verified/badging.txt
          test -s verified/apk-entries.txt
      - name: Verify unchanged APK bytes native UVC audio app ID and version
        run: |
          set -euo pipefail
          cd verified
          sha256sum -c SHA256SUMS.txt
          unzip -tq BlueStar_Guide_1.0.19_RC20_arm64.apk >/dev/null
          unzip -Z1 BlueStar_Guide_1.0.19_RC20_arm64.apk | grep -Fxq 'lib/arm64-v8a/libUVCCamera.so'
          unzip -Z1 BlueStar_Guide_1.0.19_RC20_arm64.apk | grep -Fxq 'res/raw/c_metal_clack_ding.mp3'
          unzip -Z1 BlueStar_Guide_1.0.19_RC20_arm64.apk | grep -Fxq 'res/raw/voice_send_whoosh.wav'
          grep -Fq "package: name='com.vobich.bluestar.rc20'" badging.txt
          grep -Fq "versionCode='29'" badging.txt
          grep -Fq "versionName='1.0.19-rc20'" badging.txt
          grep -Fq "application-label:'Blue Star Guide'" badging.txt
          grep -q 'application-icon-' badging.txt
          if grep -Ei 'inference\.onnx|paddle|ppocr|sherpa|layout.*onnx' apk-entries.txt; then
            echo "Unexpected on-device OCR model found" >&2
            exit 1
          fi
          echo "APK_SIZE_BYTES=$(stat -c%s BlueStar_Guide_1.0.19_RC20_arm64.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SHA256=$(sha256sum BlueStar_Guide_1.0.19_RC20_arm64.apk | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only verified CI APK without rebuilding or resigning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=blue-star-guide-cloud-rc20-20261107
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing RC20 Release; refuse overwrite." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "verified/BlueStar_Guide_1.0.19_RC20_arm64.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target 7a29d563ab79d94739ab9568dd6e6988270483fb \
            --title "Blue Star Guide 1.0.19 RC20 - OCR A/B/C Speed Experiment" \
            --notes "Blue Star Guide v1.0.19 RC20 is a user-approved reversible experimental Android ARM64 APK to measure whether streaming OCR actually makes the FIRST SPOKEN LINE faster. One app includes Settings > Cloud AI > 文字识别速度实验 with A (safe DEFAULT: unchanged OCR stream=false, play full result once), B (stream=true receive and measure first token/first complete line but play full result only after complete), and C (stream=true, queue only COMPLETE newline-delimited text lines once through original TTS; if no newline, wait until end; never replay all text). Same selected OCR model, original user-approved short OCR prompt, JPEG resolution setting, hardware camera or USB source, one photo per request and one model call per tap in each mode. Anonymous local diagnostics ocr.speed_mode 0/1/2 plus cloud.response_headers_ms, cloud.first_text_ms, cloud.first_line_ready_ms, cloud.network_ms, tts.first_audio_callback_ms permit A/B/C comparison without storing images, transcriptions, prompts, audio or API key. C does not promise speed gains; if provider waits to send first text, stream will not improve latency, and equal latency alone does NOT prove the server is busy. No auto retries or simultaneous three-model requests. Original RC19 auto-capture voice intent, RC18 3-choice web-enabled AI chat, RC17 four-choice OCR model selection, RC16 native UVC 60..61fps preference, RC13 32-case orientation, RC14 UVC picture control and all TTS sounds and icons preserved. Build source SHA 7a29d563ab79d94739ab9568dd6e6988270483fb from GitHub Actions 42384203882 completed/success, with RC20 line chunk/order/no-duplication Java tests, original voice/task/camera/USB regressions and ARM64 native Android Gradle package verification passing. Release uploads only the unchanged, SHA256-verified CI artifact, without recompile or re-sign. Isolated package com.vobich.bluestar.rc20, versionCode29, versionName1.0.19-rc20 does not overwrite RC19; user must configure API Key in this independent test package. Test same model/resolution/scene, each A/B/C at least three times; compare actual heard-onset and correctness and share anonymous app diagnostic before considering a permanent change. CI success cannot establish real device streaming speed or that C is accurate." \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'BlueStar_Guide_1.0.19_RC20_arm64.apk'
          echo "Direct browser URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BlueStar_Guide_1.0.19_RC20_arm64.apk" >> "$GITHUB_STEP_SUMMARY"
