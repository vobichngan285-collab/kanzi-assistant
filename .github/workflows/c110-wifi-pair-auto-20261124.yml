name: Blue Star v1.0.84 C110 Wi-Fi Pair Once and Auto Connect
on:
  push:
    branches: [ 'exp/c110-wifi-pair-autoconnect-20261124' ]
    paths:
      - 'cloud-vision-app/app/**'
      - 'cloud-vision-app/docs/C110_WIFI_PAIR_AUTO_20261124.md'
      - '.github/workflows/c110-wifi-pair-auto-20261124.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validated-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: cloud-vision-app/third_party/AndroidUSBCamera
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify exact 9-file C110 Wi-Fi scope and untouched photo/voice paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          prefix='cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/'
          expected={
            '.github/workflows/c110-wifi-pair-auto-20261124.yml',
            'cloud-vision-app/docs/C110_WIFI_PAIR_AUTO_20261124.md',
            'cloud-vision-app/tests/C110WifiPairingPolicyTest.java',
            'cloud-vision-app/app/build.gradle',
            *{prefix+x for x in ['HomeActivity.java','MainActivity.java',
                'BlueStarSettingsScreen.java','C110WifiBootstrap.java',
                'C110WifiPairingPolicy.java']}
          }
          changed=set(subprocess.check_output(['git','diff','--name-only','3bb026880e303a1451f2b4906b858117a4035702','HEAD'],text=True).splitlines())
          assert changed==expected,('Unexpected files',sorted(changed^expected))
          get=lambda n:Path(prefix+n).read_text()
          wifi,home,main,ui,policy=map(get,['C110WifiBootstrap.java','HomeActivity.java',
               'MainActivity.java','BlueStarSettingsScreen.java','C110WifiPairingPolicy.java'])
          camera,reader,cloud=map(get,['C110WifiCamera.java','C110FrameReader.java','CloudVisionClient.java'])
          gradle=Path('cloud-vision-app/app/build.gradle').read_text()
          assert 'cameraWifi=new C110WifiBootstrap(this,this::quickStatusChanged)' in home
          assert 'if(cameraWifi!=null)cameraWifi.startAtLaunch();' in home
          assert 'cameraWifi.requestForCameraMode();' in home
          assert 'if(cameraWifi!=null){cameraWifi.shutdown();cameraWifi=null;}' in home
          assert 'activity instanceof HomeActivity' in wifi
          assert 'private static final String KEY_AUTO="auto_connect"' in wifi
          assert 'if(C110WifiPairingPolicy.commitNewTarget(true,target.freshSelection))' in wifi
          assert 'new Credentials(ssid,password,"",false)' in wifi
          assert 'WifiNetworkSpecifier.Builder' in wifi
          assert 'wifiManager.disconnect()' not in wifi
          assert 'requestTarget(foreground,' in wifi and 'verifyAsync(ticket,network,target)' in wifi
          assert 'chooseFromCameraPage' in wifi and 'chooseCameraFromScreen' in wifi
          assert 'if(pending!=null)requestTarget(screen(),pending,true);' in wifi
          assert 'onC110WifiStatusFromShared' in wifi and 'onC110WifiStatusFromShared' in main
          assert 'requestFromCameraPage(this,false)' in main
          assert 'onWifiPermissionFromCameraPage(this,granted)' in main
          assert 'onScanPermissionFromCameraPage(this,granted)' in main
          assert 'chooseC110WifiFromSettings' in ui and 'c110AutoConnectEnabled' in ui
          assert 'C110PhotoUploadPolicy.P1440' in main and 'C110PhotoUploadPolicy.ORIGINAL' in main
          assert 'PhoneStillUploadPolicy.P1440' in main
          assert 'static Network requireCellular(Context context)' in camera
          assert 'shootAfterLivePreview' in camera
          assert 'recognizeOriginalJpeg' in reader
          assert 'if(!textOnly)connection.setFixedLengthStreamingMode(request.length)' in cloud
          assert 'versionCode 93' in gradle
          assert "versionName '1.0.84-c110-wifi-pair-auto'" in gradle
          assert "applicationIdSuffix '.c110plusquick159'" in gradle
          assert 'org.videolan.android:libvlc-all:3.6.5' in gradle
          print('PASS strict 9-file Wifi only scope, shared owner, 3012 before saving, one auto attempt')
          PY
      - name: Run vendor allow-list, task and C110 pure Java regressions
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-tests
          javac -d /tmp/bluestar-tests "$BASE/CloudProviderPolicy.java" cloud-vision-app/tests/CloudProviderPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudProviderPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/CloudProviderPolicy.java" "$BASE/CloudThinkingPolicy.java" cloud-vision-app/tests/CloudThinkingPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudThinkingPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/VisionModelCatalog.java" "$BASE/OcrModelCatalog.java" cloud-vision-app/tests/CloudServerListTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudServerListTest
          javac -d /tmp/bluestar-tests "$BASE/VoiceAction.java" cloud-vision-app/tests/VoiceActionSharedTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.VoiceActionSharedTest
          javac -d /tmp/bluestar-tests "$BASE/ProviderKeyReusePolicy.java" cloud-vision-app/tests/ProviderKeyReusePolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.ProviderKeyReusePolicyTest
          javac -d /tmp/bluestar-tests "$BASE/TaskOrder.java" cloud-vision-app/tests/TaskOrderTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.TaskOrderTest
          javac -d /tmp/bluestar-tests "$BASE/FollowupPrompt.java" cloud-vision-app/tests/FollowupPromptTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.FollowupPromptTest
          javac -d /tmp/bluestar-tests "$BASE/C110ZoomGeometry.java" cloud-vision-app/tests/C110ZoomGeometryTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.C110ZoomGeometryTest
          javac -d /tmp/bluestar-tests "$BASE/C110PhotoPolicy.java" cloud-vision-app/tests/C110PhotoPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.C110PhotoPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/OcrLineChunks.java" "$BASE/OcrSpeedExperiment.java" cloud-vision-app/tests/OcrSpeedExperimentTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.OcrSpeedExperimentTest
      - name: Run independent pure-Java phone upload-size tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-phone-upload-tests
          javac -d /tmp/bluestar-phone-upload-tests "$BASE/PhoneStillUploadPolicy.java" cloud-vision-app/tests/PhoneStillUploadPolicyTest.java
          java -cp /tmp/bluestar-phone-upload-tests com.vobich.bluestar.cloudprobe.PhoneStillUploadPolicyTest
      - name: Run C110 1440P toggle and original-byte restoration policy tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-c110-upload-toggle-tests
          javac -d /tmp/bluestar-c110-upload-toggle-tests "$BASE/C110PhotoUploadPolicy.java" cloud-vision-app/tests/C110PhotoUploadPolicyTest.java
          java -cp /tmp/bluestar-c110-upload-toggle-tests com.vobich.bluestar.cloudprobe.C110PhotoUploadPolicyTest
      - name: Pure-Java first pairing and auto-reconnect regression tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-wifi-pair
          javac -d /tmp/bluestar-wifi-pair "$BASE/C110WifiPairingPolicy.java" cloud-vision-app/tests/C110WifiPairingPolicyTest.java
          java -cp /tmp/bluestar-wifi-pair com.vobich.bluestar.cloudprobe.C110WifiPairingPolicyTest
      - name: Apply already-proven pinned UVC patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_usbmonitor.py cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/java/com/jiangdg/usb/USBMonitor.java
          python3 cloud-vision-app/scripts/patch_pinned_uvc.py
          grep -q BSG_CLOUD_RAW5_GATED cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/jni/UVCCamera/UVCPreview.cpp
          grep -q BSG_CLOUD_CLOSE_BARRIER cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/camera/CameraUVC.kt
      - name: Generate unchanged Blue Star launcher assets
        run: |
          set -euo pipefail
          cd cloud-vision-app
          java scripts/GenerateLauncherIcons.java
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-$density/ic_launcher.png"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile full Android arm64 app
        shell: bash
        run: |
          set -euo pipefail
          cd cloud-vision-app
          gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug
      - name: Verify APK actual package, launcher, native libraries, sound and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp cloud-vision-app/app/build/outputs/apk/debug/app-debug.apk out/BlueStar_Guide_C110_Wifi_AutoConnect_1.0.84.apk
          APK=out/BlueStar_Guide_C110_Wifi_AutoConnect_1.0.84.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          unzip -Z1 "$APK" >out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libUVCCamera.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlc.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlcjni.so' out/entries.txt
          grep -Fxq 'res/raw/c_metal_clack_ding.mp3' out/entries.txt
          grep -Fxq 'res/raw/voice_send_whoosh.wav' out/entries.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" >out/badging.txt
          grep -Fq "package: name='com.vobich.bluestar.c110plusquick159'" out/badging.txt
          grep -Fq "versionName='1.0.84-c110-wifi-pair-auto'" out/badging.txt
          grep -Fq "launchable-activity: name='com.vobich.bluestar.cloudprobe.HomeActivity'" out/badging.txt
          test "$(grep -c '^launchable-activity:' out/badging.txt)" -eq 1
          (cd out && sha256sum BlueStar_Guide_C110_Wifi_AutoConnect_1.0.84.apk >SHA256SUMS.txt)
          cat out/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          BYTES=$(stat -c%s "$APK")
          echo "New v1.0.84 APK bytes: $BYTES" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline v1.0.83 APK bytes: 53534167" >> "$GITHUB_STEP_SUMMARY"
          echo "Compared to v1.0.83: $((BYTES-53534167)) bytes (negative means smaller)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: BlueStar_Guide_C110_Wifi_AutoConnect_1.0.84
          path: out/*
          retention-days: 14
      - name: Publish ONLY if every test and package verification passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=bluestar-c110-wifi-pair-auto-20261124-v0184
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release" >&2
            exit 1
          fi
          gh release create "$TAG" out/BlueStar_Guide_C110_Wifi_AutoConnect_1.0.84.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Blue Star v1.0.84 C110 Wi-Fi Pair Once and Auto Connect" \
            --notes "v1.0.84 C110 Wi-Fi pairing: HomeActivity owns a single persistent (activity-lifetime) Android WifiNetworkSpecifier callback, allowing Settings and C110 preview pages to share the same connection instead of issuing competing requests. Home can scan real SSIDs, request a password once and SAVE ONLY AFTER the selected network passes the existing read-only standard C110 3012 identity check. Subsequent Home foreground launch attempts automatic exact-SSID reconnection, no stale BSSID pin. Settings offers connect, scan/replace and auto-connect toggle. No forced WifiManager.disconnect or dual-WLAN cloud routing: camera local Wi-Fi stays separate from cellular-only cloud. Real Android permission/consent may be needed and the user should keep vivo dual-WLAN acceleration disabled; do not promise unattended Android switching. Exact nine changed files checked against successful v1.0.83, pure-Java pairing safety regression and existing vendor/task/C110/upload tests, UVC pin, arm64 Android build, app package/unique launcher/native libraries/sounds/SHA256. 1001 shutter, verified 3012/3016/3001/2015 preview, phone 8MP to 1440P, C110 original vs optional 1440P upload, TTS and OCR unchanged. Full hardware reconnection and photo/TTS still require user verification. Install over current APK, do not uninstall stored Keystore API keys."
