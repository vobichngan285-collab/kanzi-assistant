name: Publish verified RC23 manual reading preview OCR fix APK
on:
  push:
    branches: [fix/bluestar-123-reading-preview-ocr-text-20261108]
    paths: ['.github/workflows/bluestar-rc23-direct-apk-release.yml']

permissions:
  actions: read
  contents: write

jobs:
  publish-verified-rc23:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Require exact successful RC23 Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=42393584828
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha')" = c039af8a88fd692d5eb8d4166174201500b7a0d6
      - name: Download official original CI APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download 42393584828 \
            --repo "$GITHUB_REPOSITORY" \
            --name blue-star-guide-1-0-22-rc23-arm64 --dir verified
          test -s verified/BlueStar_Guide_1.0.22_RC23_arm64.apk
          test -s verified/SHA256SUMS.txt
          test -s verified/badging.txt
          test -s verified/apk-entries.txt
      - name: Verify unchanged APK bytes native UVC audio app ID and version
        run: |
          set -euo pipefail
          cd verified
          sha256sum -c SHA256SUMS.txt
          unzip -tq BlueStar_Guide_1.0.22_RC23_arm64.apk >/dev/null
          unzip -Z1 BlueStar_Guide_1.0.22_RC23_arm64.apk | grep -Fxq 'lib/arm64-v8a/libUVCCamera.so'
          unzip -Z1 BlueStar_Guide_1.0.22_RC23_arm64.apk | grep -Fxq 'res/raw/c_metal_clack_ding.mp3'
          unzip -Z1 BlueStar_Guide_1.0.22_RC23_arm64.apk | grep -Fxq 'res/raw/voice_send_whoosh.wav'
          grep -Fq "package: name='com.vobich.bluestar.rc23'" badging.txt
          grep -Fq "versionCode='32'" badging.txt
          grep -Fq "versionName='1.0.22-rc23'" badging.txt
          grep -Fq "application-label:'Blue Star Guide'" badging.txt
          grep -q 'application-icon-' badging.txt
          if grep -Ei 'inference\.onnx|paddle|ppocr|sherpa|layout.*onnx' apk-entries.txt; then
            echo "Unexpected on-device OCR model found" >&2
            exit 1
          fi
          echo "APK_SIZE_BYTES=$(stat -c%s BlueStar_Guide_1.0.22_RC23_arm64.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SHA256=$(sha256sum BlueStar_Guide_1.0.22_RC23_arm64.apk | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only verified CI APK without rebuilding or resigning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=blue-star-guide-cloud-rc23-20261108
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing RC23 Release; refuse overwrite." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "verified/BlueStar_Guide_1.0.22_RC23_arm64.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target c039af8a88fd692d5eb8d4166174201500b7a0d6 \
            --title "Blue Star Guide 1.0.22 RC23 - Manual Reading Preview and OCR Text Repair" \
            --notes "RC23 corrects the prior reading test UX and its 5-number OCR coordinate output. Reading now opens real live phone or USB camera preview; entering Reading or pressing Next Page NEVER auto-takes any photo. Users align the book then explicitly tap preview or Photo button. After acquiring a fresh physical frame the device vibrates 50ms, optionally plays the original shutter sound, closes Camera2 or native UVC, and sends exactly one image to the user-selected OCR model. The dedicated qwen-vl-ocr model now uses Alibaba official text_recognition prompt for plain text instead of bounding box localization; 5-number rotation-box rows from the supplied screenshot are not spoken and coordinate-only responses are rejected from local book saving. Existing C line-by-line speech, blue and white book screen, page order, atomic text-only storage and TXT export, native USB, audio effects, AI chat, settings and other tasks remain. No additional cloud OCR request, sound file export, or new local OCR engine. GitHub Actions 42393584828 completed success at exact source c039af8a88fd692d5eb8d4166174201500b7a0d6 with strict preview-only and haptic assertions, OCR coordinates unit tests, full Android ARM64 build, UVC/launcher/audio APK checks and checksum. This public prerelease uses the identical SHA256-verified official CI APK, with NO second rebuild or resign. Separate package com.vobich.bluestar.rc23 versionCode32 versionName1.0.22-rc23; it requires user to enter their own API key and source preference. Books saved inside previous independent package are not automatically migrated; export important book text to TXT first. Actual vivo phone and USB device validation is still required." \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'BlueStar_Guide_1.0.22_RC23_arm64.apk'
          echo "Direct browser URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BlueStar_Guide_1.0.22_RC23_arm64.apk" >> "$GITHUB_STEP_SUMMARY"
