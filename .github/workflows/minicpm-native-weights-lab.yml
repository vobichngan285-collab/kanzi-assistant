name: Blue Star native weights lab v0.2.0
on:
  push:
    branches: [exp/minicpm-native-weights-20261125]
    paths: ['native-vision-lab/**', '.github/workflows/minicpm-native-weights-lab.yml']
  workflow_dispatch:
concurrency:
  group: bluestar-native-weights-final
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tc-mb/llama.cpp-omni
          ref: 0c0b1109f2d338acf65f28a7b0a1505da3945286
          path: engine
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify upstream and Android tools
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = 0c0b1109f2d338acf65f28a7b0a1505da3945286
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;4.1.2'
          echo "ENGINE_DIR=$PWD/engine" >> "$GITHUB_ENV"
          echo CMAKE_BUILD_PARALLEL_LEVEL=2 >> "$GITHUB_ENV"
          mkdir -p native-vision-lab/app/src/main/assets
          cp engine/LICENSE native-vision-lab/app/src/main/assets/ENGINE_LICENSE.txt
          OMP=$(find "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64" -path "*aarch64*/libomp.so" -type f | head -1)
          if [ -n "$OMP" ]; then
            mkdir -p native-vision-lab/app/src/main/jniLibs/arm64-v8a
            cp "$OMP" native-vision-lab/app/src/main/jniLibs/arm64-v8a/libomp.so
          fi
      - name: Build independent Blue Star APK
        working-directory: native-vision-lab
        run: gradle --no-daemon --max-workers=2 :app:assembleRelease
      - name: Verify signed APK, isolated identity and native code
        run: |
          set -euo pipefail
          APK=native-vision-lab/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | tee badging.txt
          grep -F "package: name='com.vobich.bluestar.nativelab' versionCode='1' versionName='0.2.0'" badging.txt
          grep -F "launchable-activity: name='com.vobich.bluestar.nativelab.MainActivity'" badging.txt
          ! grep -F "android.permission.INTERNET" badging.txt
          unzip -p "$APK" lib/arm64-v8a/libbluestar_native.so > "$RUNNER_TEMP/native.so"
          readelf -h "$RUNNER_TEMP/native.so" | grep AArch64
          grep -R -F "CMAKE_BUILD_TYPE:STRING=Release" native-vision-lab/app/.cxx/Release || grep -R -F "CMAKE_BUILD_TYPE:STRING=RelWithDebInfo" native-vision-lab/app/.cxx/RelWithDebInfo
          readelf -d "$RUNNER_TEMP/native.so" | tee needed.txt
          if grep -F "libomp.so" needed.txt; then unzip -l "$APK" | grep -F "lib/arm64-v8a/libomp.so"; fi
          readelf --dyn-syms --wide "$RUNNER_TEMP/native.so" > symbols.txt
          grep Java_com_vobich_bluestar_nativelab_MainActivity_nativeRun symbols.txt
          grep Java_com_vobich_bluestar_nativelab_MainActivity_nativeCancel symbols.txt
          mkdir -p release
          cp "$APK" release/BlueStar_Native_Vision_Lab_0.2.0.apk
          cp native-vision-lab/README.md release/
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: bluestar-native-vision-v020
          path: release/
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tc-mb/llama.cpp-omni
          ref: 0c0b1109f2d338acf65f28a7b0a1505da3945286
          path: engine
          persist-credentials: false
      - name: Build host reference CLI
        run: |
          set -euo pipefail
          cmake -S engine -B host -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_BUILD_HTML=OFF -DLLAMA_CURL=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF
          cmake --build host --target llama-mtmd-cli -j 2
      - name: Verify actual official weights and simple OCR
        run: |
          set -euo pipefail
          mkdir -p weights
          base=https://huggingface.co/openbmb/MiniCPM-V-4.7-1B-gguf/resolve/main
          for file in MiniCPM-V-4_7-1B-Q4_K_M.gguf mmproj-model-f16.gguf mmproj-model-f16-4x.gguf; do
            curl -fL --retry 3 --connect-timeout 30 "$base/$file" -o "weights/$file"
          done
          cat <<'EOF' > weights/SHA256SUMS.txt
          f18f594747e5317ab490cff9c06339c9cfb89acbe2f02ebc48a4e167bc23576d  MiniCPM-V-4_7-1B-Q4_K_M.gguf
          fb9cc047a3cdad5317fd8433a4aeda2d22f00f02ca4bd93b34ad84165b25a900  mmproj-model-f16.gguf
          1e0ab439877e6896ded59ff24cdd242fdffb236394f6fc4a5b019cbd60bb5f4a  mmproj-model-f16-4x.gguf
          EOF
          (cd weights && sha256sum -c SHA256SUMS.txt)
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-dejavu-core
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          im=Image.new("RGB",(448,448),"white")
          d=ImageDraw.Draw(im)
          f=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",72)
          d.text((40,150),"5931",font=f,fill="black")
          im.save("fixture.png")
          PY
          for mode in mmproj-model-f16.gguf mmproj-model-f16-4x.gguf; do
            timeout 300 host/bin/llama-mtmd-cli -m weights/MiniCPM-V-4_7-1B-Q4_K_M.gguf --mmproj "weights/$mode" --image fixture.png -p '请逐字抄写图片中所有可见文字和数字。不要解释。' --jinja --temp 0 --no-warmup -ngl 0 -t 6 -n 64 > "$mode.txt" 2>"$mode.log"
            cat "$mode.txt"
            grep -F 5931 "$mode.txt"
          done
  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bluestar-native-vision-v020
          path: release
      - name: Publish verified independent APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS.txt)
          gh release create bluestar-native-vision-v020-optimized-20261125 release/* --target "$GITHUB_SHA" --title "蓝星原厂模型实验室 v0.2.0" --notes-file release/README.md --prerelease
