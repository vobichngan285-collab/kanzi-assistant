name: Blue Star M02S Photo Finish Then Fast AP WiFi JPEG v0.1.17
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-photo-finish-ssid-timeout-v0117-20261114']
    paths:
      - 'experiments/m02s-wifi-only-lab/**'
      - '.github/workflows/m02s-photo-finish-v0117.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify exact BLE AP-only command; unit tests and build
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=experiments/m02s-wifi-only-lab/app/src/main/java
          WIRE="$SOURCE/com/vobichngan/bluestar/m02slab/M02sApWire.java"
          grep -Fq '0x39, 0x30, 0x69' "$WIRE"
          grep -Fq 'Arrays.equals(AP_REQUEST, bytes)' "$WIRE"
          grep -Fq 'actionSyncPhotoFlag' "$WIRE"
          STARTER="$SOURCE/com/vobichngan/bluestar/m02slab/M02sApStarter.java"
          MAIN="$SOURCE/com/vobichngan/bluestar/m02slab/MainActivity.java"
          grep -Fq 'setSsid(expectedSsid)' "$STARTER"
          grep -Fq 'void photoActionEnded();' "$STARTER"
          grep -Fq 'ui.postDelayed(ssidTimeout, 5000L)' "$STARTER"
          grep -Fq 'if (falling)' "$STARTER"
          grep -Fq 'PHOTO_DONE_FALLBACK_MS = 2200L' "$MAIN"
          grep -Fq 'PHOTO_DONE_SETTLE_MS = 250L' "$MAIN"
          grep -Fq 'cancelCurrentTransfer()' "$MAIN"
          grep -Fq 'clearPendingPhotoAction()' "$MAIN"
          if grep -Fq 'startPhotoTransfer(true), 350L' "$MAIN"; then
            echo 'old premature 350ms AP activation still present' >&2
            exit 1
          fi
          if grep -Fq 'wifi.startScan(' "$SOURCE/com/vobichngan/bluestar/m02slab/M02sApStarter.java"; then
            echo 'v0.1.17 must not perform Android Wi-Fi scan before exact SSID request' >&2
            exit 1
          fi
          if grep -R -E 'M02sBleWire[.]photoThumbnail|e09BlePhoto[(]|[.]removeFile[(]|DELETE_MEDIA' "$SOURCE" ; then
            echo 'Unauthorized shutter/erase API in one-time AP starter' >&2
            exit 1
          fi
          gradle -p experiments/m02s-wifi-only-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify manifest, standalone APK signing and package
        shell: bash
        run: |
          set -euo pipefail
          APK=experiments/m02s-wifi-only-lab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02sshutterfinishlab' versionCode='18' versionName='0.1.17'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          for p in BLUETOOTH_SCAN BLUETOOTH_CONNECT ACCESS_NETWORK_STATE ACCESS_WIFI_STATE CHANGE_NETWORK_STATE CHANGE_WIFI_STATE NEARBY_WIFI_DEVICES ACCESS_FINE_LOCATION INTERNET; do
            grep -q "android.permission.${p}" "$RUNNER_TEMP/permissions.txt"
          done
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or photo storage permission' >&2
            exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_Photo_Finish_WiFi_0.1.17_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload standalone signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-Photo-Finish-v0117-APK
          path: release/BlueStar_M02S_Photo_Finish_WiFi_0.1.17_Android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable browser download URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.txt" <<'EOF'
          v0.1.17 is a targeted correction to v0.1.16 based on actual M02S Android 16 logs at 22:45–22:46 on 2026-11-14. Verified BLE standby at 22:45:46, a checksum-valid E09 ACTION_SYNC(0x45) photo active flag=1 at 22:45:54, BLE AP 0x39/0x30 write status0 at 22:45:55, but NO AA14 0x25 SSID received. The original v0.1.16 launched AP ~350ms after photo-active, possibly interrupting photo processing; this was a hypothesis, not proven. Also the 'already taken photo, get original now' button silently returned while an auto transfer was running.
          Fix 1: Upon verified 0x45 isTakePhoto 0->1, do NOT open AP immediately. If 1->0 is observed, wait 250ms and perform one OEM AP command. If no photo-end signal is received, the bounded 2200ms fallback starts once. This is a best-effort protocol signal; isTakePhoto=false is not independently proven to indicate JPEG committed on M02S. Manual button skips photo-end wait when the user knows capture has completed. No BLE remote shutter command.
          Fix 2: All clicks while a transfer is already running show current stage and do not blindly repeat BLE/AP/Wi-Fi requests. A visible Cancel current transfer button cancels photo-end waiting without AP, or stops an active transfer and BLE connection so stale SSID cannot be mis-associated with a subsequent command. Cancellation does not touch eyewear media or send an unvalidated finish/delete command.
          Fix 3: 5s after successful AA13 GATT write callback, if no valid AA14 0x25 SSID arrives, explicitly report eyewear AP/SSID failure, stop the session and DO NOT retry. On valid SSID, cancel timeout and immediately request Android WifiNetworkSpecifier for exactly that BLE-confirmed SSID without any 12-second scan or settle delay. Only Android onAvailable, private gateway, OEM HTTP200/result0/info can validate the connection.
          Unchanged: physical shutter only; BLE wire only official allowlisted 0x39/0x30 command; prior verified OEM WiFi AP /app/getfilelist and original JPEG GET to RAM, two matching list observations ~350ms apart; safety caps on images and filenames; no gallery save, deletion, cloud upload, OCR/TTS, or media finish 0x44. No 450ms long-running polling. One-shot 39s guard remains for Android Wi-Fi and HTTP. Successful CI is not proof that v0.1.17 fixed the actual glasses firmware behavior: the next M02S log should establish if photo-end 0x45(0) occurs and/or AA14 0x25 appears after the revised trigger.
          Standalone Android applicationId com.vobichngan.bluestar.m02sshutterfinishlab, versionCode18/versionName0.1.17, separate from v0.1.12 through v0.1.16, original Blue Star Guide RC25 and Windows OCR. Public MIT E09 attribution remains in E09_SOURCE_LICENSE.md.
          EOF
          gh release create bluestar-m02s-photo-finish-v0117-20261114 \
            release/BlueStar_M02S_Photo_Finish_WiFi_0.1.17_Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S Photo Finish + Fast WiFi v0.1.17 — experimental" \
            --prerelease --notes-file "$RUNNER_TEMP/release-notes.txt"
      - name: Verify release published and downloadable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view bluestar-m02s-photo-finish-v0117-20261114 \
            --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
