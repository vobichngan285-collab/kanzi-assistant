name: Gemma vision layer diagnosis (no APK)
on:
  push:
    branches: [exp/gemma4-vision-numerics-20261126]
    paths: ['gemma-vision-lab/tests/compare_vision.py', '.github/workflows/gemma-vision-numerics.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU diagnostic dependencies
        run: |
          python -m pip install 'litert-lm==0.18.1' ai-edge-litert tflite numpy
          python -m py_compile gemma-vision-lab/tests/compare_vision.py gemma-vision-lab/tests/compare_vision_layers.py
      - uses: actions/download-artifact@v4
        with:
          name: gemma560-patch
          run-id: 45681289795
          github-token: ${{ github.token }}
          path: patch-assets
      - name: Download exact original reference
        run: curl -fL --retry 3 'https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/6e5c4f1e395deb959c494953478fa5cec4b8008f/gemma-4-E2B-it.litertlm' -o gallery.litertlm
      - name: Compare actual model signatures and numerical outputs
        run: |
          set -o pipefail
          python -u gemma-vision-lab/tests/compare_vision_layers.py 2>&1 | tee comparison.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemma-vision-layer-report
          path: |
            comparison.log
            diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 14
