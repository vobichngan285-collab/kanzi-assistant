name: Gemma corrected 560 real-image OCR test (no APK)
on:
  push:
    branches: [exp/gemma4-vision-numerics-20261126]
    paths: ['gemma-vision-lab/tests/compare_vision.py', 'gemma-vision-lab/tests/compare_vision_layers.py', 'gemma-vision-lab/tests/compare_vision_scales.py', 'gemma-vision-lab/tests/test_scale_correction.py', 'gemma-vision-lab/tests/test_corrected_ocr.py', '.github/workflows/gemma-vision-numerics.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU diagnostic dependencies
        run: |
          python -m pip install 'litert-lm==0.18.1' 'ai-edge-litert==2.4.0' 'tflite==2.18.0' 'numpy==2.5.5' pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          python -m py_compile gemma-vision-lab/tests/test_corrected_ocr.py
      - uses: actions/download-artifact@v4
        with:
          name: gemma560-patch
          run-id: 45681289795
          github-token: ${{ github.token }}
          path: patch-assets
      - name: Download exact original reference
        run: curl -fL --retry 3 'https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/6e5c4f1e395deb959c494953478fa5cec4b8008f/gemma-4-E2B-it.litertlm' -o gallery.litertlm
      - name: Compare original, unfixed and corrected real-image OCR
        run: |
          set -o pipefail
          python -u gemma-vision-lab/tests/test_corrected_ocr.py 2>&1 | tee comparison.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemma-vision-ocr-report
          path: |
            comparison.log
            diagnostics/*.json
            diagnostics/*.png
          if-no-files-found: ignore
          retention-days: 14
