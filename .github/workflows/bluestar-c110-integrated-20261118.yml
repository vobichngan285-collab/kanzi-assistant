name: Blue Star C110 Cloud OCR Integrated Lab (isolated)
on:
  push:
    branches: [ 'exp/bluestar-c110-integrated-20261118' ]
    paths:
      - 'cloud-vision-app/**'
      - '.github/workflows/bluestar-c110-integrated-20261118.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  c110-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the exact pinned UVC stack used for RC25
        uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: cloud-vision-app/third_party/AndroidUSBCamera
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Java C110 protocol unit tests and isolation assertions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bluestar-c110-test
          SRC=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          javac -d /tmp/bluestar-c110-test "$SRC/C110PhotoPolicy.java" cloud-vision-app/tests/C110PhotoPolicyTest.java
          java -cp /tmp/bluestar-c110-test com.vobich.bluestar.cloudprobe.C110PhotoPolicyTest
          mkdir -p /tmp/bluestar-c110-stub/android/net
          cat > /tmp/bluestar-c110-stub/android/net/Network.java <<'JAVA'
          package android.net;
          public class Network {
              public javax.net.SocketFactory getSocketFactory() {
                  return javax.net.SocketFactory.getDefault();
              }
          }
          JAVA
          javac -d /tmp/bluestar-c110-test \
            /tmp/bluestar-c110-stub/android/net/Network.java \
            "$SRC/C110RtspSessionProbe.java" cloud-vision-app/tests/C110RtspSessionProbeTest.java
          java -cp /tmp/bluestar-c110-test com.vobich.bluestar.cloudprobe.C110RtspSessionProbeTest
          python3 - <<'PY'
          from pathlib import Path
          main=Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/MainActivity.java').read_text()
          camera=Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/C110WifiCamera.java').read_text()
          cloud=Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/CloudVisionClient.java').read_text()
          manifest=Path('cloud-vision-app/app/src/main/AndroidManifest.xml').read_text()
          gradle=Path('cloud-vision-app/app/build.gradle').read_text()
          assert "applicationIdSuffix '.c110surface'" in gradle
          assert 'captureC110OneShot' in main and 'current.remoteJpeg' in main
          assert 'FrameCompressor.encodeAdjusted(' in main
          assert 'CloudVisionClient.recognize(' in main and 'TargetVisionClient.inspect(' in main
          assert 'cloudNetwork.openConnection(endpoint)' in cloud
          assert 'requireCellular' in camera
          assert 'NetworkCapabilities.TRANSPORT_CELLULAR' in camera
          assert 'NetworkCapabilities.TRANSPORT_WIFI' in camera
          assert 'findCameraNetwork' in camera and '192.168.1.254' in camera
          assert '"/?custom=1&cmd=3001&par=0"' in camera
          assert '"/?custom=1&cmd=1001"' in camera
          assert 'setInstanceFollowRedirects(false)' in camera
          assert 'android.permission.ACCESS_NETWORK_STATE' in manifest
          assert 'android:networkSecurityConfig="@xml/c110_network_security_config"' in manifest
          security=Path('cloud-vision-app/app/src/main/res/xml/c110_network_security_config.xml').read_text()
          assert '<base-config cleartextTrafficPermitted="false"/>' in security
          assert '<domain includeSubdomains="false">192.168.1.254</domain>' in security
          assert not any(x in camera for x in ['cmd=3037','cmd=2001','cmd=4005'])
          assert 'cmd=2015&par=1' in camera
          assert 'cmd=3001&par=1' in camera
          assert 'cmd=2015&par=1' in camera and 'cmd=3001&par=1' in camera
          assert 'live_mode_cmd' in main and 'live_cmd' in main
          assert 'vlc_wifi_bind' in main and 'vlc_vout_count' in main
          assert 'vlc_last_phase' in main and 'vlc_event_count' in main
          assert 'vlc_native_state1' in main and 'vlc_native_state2' in main
          assert 'vlc_is_playing1' in main and 'vlc_is_playing2' in main
          preview=Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/C110LivePreview.java').read_text()
          assert 'main.postDelayed(delayedPlay,300L)' in preview
          assert 'observedSurface=findVideoSurface(view)' in preview
          assert 'video.getHolder().addCallback(observedCallback)' in preview
          assert 'observedSurface.getHolder().removeCallback(observedCallback)' in preview
          assert 'validSurface(observedSurface)' in preview
          assert 'startOnlyWhenSurfaceReady(id,current,listener)' in preview
          assert 'if(id!=generation||player!=current||playIssued||!delayExpired)return;' in preview
          assert 'playIssued=true;' in preview
          assert 'vlc_surface_width' in main and 'vlc_surface_height' in main
          assert 'vlc_surface_ready' in main and 'vlc_play_issued' in main
          assert 'vlc_play_gate' in main
          assert preview.count('current.play();') == 1
          assert 'listener.surfaceSnapshot(isSurfaceUsable()?1:0,playIssued?1:0);' in preview
          assert 'current.play();' in preview
          assert 'retainedMedia=media' in preview and 'oldMedia.release()' in preview
          assert 'current.getPlayerState()' in preview and 'current.isPlaying()' in preview
          assert 'vlc_route_alive' in main and 'vlc_last_event' in main
          assert 'vlc_error' in main and 'vlc_state' in main
          assert 'C110PreviewProbe.inspect(wifi)' not in main
          assert 'C110RtspSessionProbe.probe(wifi)' not in main
          assert 'C110LivePreview' in main and 'stopC110LivePreview(false)' in main
          assert 'rtsp://192.168.1.254:554/xxx.mp4' in preview
          assert 'new LibVLC(' in preview and 'new MediaPlayer(' in preview
          assert 'new VLCVideoLayout(' in preview and 'current.attachViews(view,null,false,false)' in preview
          assert 'media.addOption(":sout-mux-caching=300")' in preview
          assert 'media.addOption(":file-caching=300")' in preview
          assert 'media.addOption(":avcodec-skiploopfilter=4")' in preview
          assert 'listener.snapshot(phase,nativeEvents,lastNativeEvent' in preview
          assert 'main.postDelayed(watchdog,20000L)' in preview
          assert 'new Media(' in preview and 'attachViews(' in preview
          assert 'bindProcessToNetwork(cameraNetwork)' in preview
          assert 'connectivity.bindProcessToNetwork(priorBinding)' in preview
          assert 'cameraBinding.equals(connectivity.getBoundNetworkForProcess())' in preview
          assert 'MediaPlayer.Event.Vout' in preview and 'getVoutCount()' in preview
          assert ':rtsp-tcp' not in preview and 'setForceUseRtpTcp(true)' not in preview
          assert 'libvlc-all:3.6.5' in gradle
          assert 'android.permission.CHANGE_NETWORK_STATE' in manifest
          assert 'cloudNetwork.openConnection(endpoint)' in cloud
          assert 'NetworkCapabilities.TRANSPORT_CELLULAR' in camera
          assert 'requireCellular' in camera
          probe=Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/C110PreviewProbe.java').read_text()
          assert 'getSocketFactory().createSocket()' in probe
          assert 'RTSP/1.0' in probe and 'DESCRIBE' in probe
          assert '8192' in probe and '554' in probe
          assert 'playbackKind(' in probe
          assert 'vlc_reason' in main and 'vlc_stage' in main
          diagnostic=Path('cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/RuntimeDiagnostics.java').read_text()
          assert 'Math.max(-4096' in diagnostic
          assert 'lastSessionCloudNetwork' in main
          assert 'blue-star-guide-cloud-rc25-20261108' not in gradle
          print('C110 static isolation/security audit PASS')
          PY
      - name: Apply the same safe pinned USB patches as RC25
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_usbmonitor.py cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/java/com/jiangdg/usb/USBMonitor.java
          python3 cloud-vision-app/scripts/patch_pinned_uvc.py
          grep -q BSG_CLOUD_RAW5_GATED cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/jni/UVCCamera/UVCPreview.cpp
          grep -q BSG_CLOUD_CLOSE_BARRIER cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/camera/CameraUVC.kt
      - name: Generate verified original launcher resources
        run: |
          cd cloud-vision-app
          java scripts/GenerateLauncherIcons.java
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-$d/ic_launcher.png"
          done
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble arm64 integration APK
        shell: bash
        run: |
          set -euo pipefail
          cd cloud-vision-app
          gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug
      - name: Verify APK identity, native library, TTS audio, version and ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp cloud-vision-app/app/build/outputs/apk/debug/app-debug.apk out/BlueStar_Guide_C110_Surface_0.1.11.apk
          test -s out/BlueStar_Guide_C110_Surface_0.1.11.apk
          unzip -tq out/*.apk >/dev/null
          unzip -Z1 out/*.apk >out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libUVCCamera.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlc.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlcjni.so' out/entries.txt
          grep -Fxq 'res/raw/c_metal_clack_ding.mp3' out/entries.txt
          grep -Fxq 'res/raw/voice_send_whoosh.wav' out/entries.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging out/*.apk >out/badging.txt
          grep -Fq "package: name='com.vobich.bluestar.c110surface'" out/badging.txt
          grep -Fq "versionName='1.0.36-c110-surface-lab'" out/badging.txt
          grep -q 'application-icon-' out/badging.txt
          (cd out && sha256sum BlueStar_Guide_C110_Surface_0.1.11.apk > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: BlueStar_Guide_C110_Surface_0.1.11
          path: out/*
          retention-days: 14
      - name: Publish isolated prerelease only if unused tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=bluestar-c110-surface-gate-20261119-v0111
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing C110 integrated prerelease, refusing overwrite" >&2
            exit 1
          fi
          gh release create "$TAG" "out/BlueStar_Guide_C110_Surface_0.1.11.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Blue Star Guide C110 Surface Gate Lab v0.1.11" \
            --notes "C110 v0.1.10 two real tests: camera mode0, stream0, WiFi bind1, phase1-5, nativePlayerState0 isPlaying0, only MediaChanged256, no Opening/Playing/Vout. Confirmed LibVLC MediaPlayer.play may defer nativePlay while Android video Surface is not ready. This v0.1.11 isolated experiment observes the actual inflated SurfaceView from OEM-style VLCVideoLayout and its SurfaceHolder create/change/destroy lifecycle, requires attached valid positive-size Surface before issuing the single play() after OEM 300ms minimum delay; no repeat calls or automatic reconnect. Adds numeric surface event/dimensions, play gate, and surface-ready/play-issued timeout snapshot, bounds events to 24 per operation, removes redundant phase spam. Keeps LibVLC3.6.5, known RTSP candidate, camera mode/start commands, scoped WiFi bind restore, original JPEG and cellular OCR/TTS/USB/RC25 untouched. No raw media, keys or original proprietary APK libraries included. Device-side video frame still unverified."