name: Transfer verified PP-OCRv6 Small model for local photo testing
on:
  push:
    branches: [test/ocr-ab-offline-20261102]
    paths: [.github/workflows/ocr-model-local-transfer.yml]
  workflow_dispatch:
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download original #315-matching publicly licensed model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ocr-model
          curl -fL --retry 3 'https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/3d2d345/inference.onnx' -o /tmp/ocr-model/inference.onnx
          curl -fL --retry 3 'https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/b8f84f0b80c529de40b4fbb3544b84fa7233a513/inference.yml?download=true' -o /tmp/ocr-model/inference.yml
          echo '5435fd747c9e0efe15a96d0b378d5bd157e9492ed8fd80edf08f30d02fa24634  /tmp/ocr-model/inference.onnx' | sha256sum -c -
          echo 'ab078671bb49f06228eadccd34f1bb501e157f7a047095ffb943ba81512c77d1  /tmp/ocr-model/inference.yml' | sha256sum -c -
      - name: Extract exact #315 detector model from original APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 \
            'https://github.com/vobichngan285-collab/kanzi-assistant/releases/download/test-build-315/app-release.apk' \
            -o /tmp/app315.apk
          python - <<'PY'
          import zipfile,pathlib,hashlib
          with zipfile.ZipFile('/tmp/app315.apk') as z:
            data=z.read('assets/models/det/inference.onnx')
          actual=hashlib.sha256(data).hexdigest()
          expected='d73e0058b7a8086bbd57f3d10b8bcd4ff95363f67e06e2762b5e814fe9c9410e'
          assert actual==expected,(actual,expected)
          pathlib.Path('/tmp/ocr-model/detector.onnx').write_bytes(data)
          print('DETECTOR_SHA256_VERIFIED',actual,'bytes='+str(len(data)))
          PY
          rm /tmp/app315.apk
      - name: Download offline Python 3.13 OCR runtime wheel packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ocr-model/wheels
          python -m pip download \
            --only-binary=:all: --implementation cp --python-version 313 \
            --abi cp313 --platform manylinux_2_28_x86_64 \
            --dest /tmp/ocr-model/wheels 'onnxruntime==1.31.1'
          ls -lah /tmp/ocr-model/wheels
      - name: Export model, dictionary and public runtime wheels only (no photographs)
        uses: actions/upload-artifact@v4
        with:
          name: original-apk315-matched-rec-model-local
          path: /tmp/ocr-model/
          retention-days: 1
