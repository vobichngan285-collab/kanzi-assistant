name: Publish verified RC14 USB diagnostics and picture controls APK
on:
  push:
    branches: [fix/bluestar-113-usb-lifecycle-trace-picture-controls-20261107]
    paths: ['.github/workflows/bluestar-rc14-direct-apk-release.yml']

permissions:
  actions: read
  contents: write

jobs:
  publish-verified-rc14:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Require exact successful RC14 Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=42340452858
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha')" = 98d6996d0c6dd72347b1e763c23922d3d6a8ec2c
      - name: Download official original CI APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download 42340452858 \
            --repo "$GITHUB_REPOSITORY" \
            --name blue-star-guide-1-0-13-rc14-arm64 --dir verified
          test -s verified/BlueStar_Guide_1.0.13_RC14_arm64.apk
          test -s verified/SHA256SUMS.txt
          test -s verified/badging.txt
          test -s verified/apk-entries.txt
      - name: Verify unchanged APK bytes native UVC audio app ID and version
        run: |
          set -euo pipefail
          cd verified
          sha256sum -c SHA256SUMS.txt
          unzip -tq BlueStar_Guide_1.0.13_RC14_arm64.apk >/dev/null
          unzip -Z1 BlueStar_Guide_1.0.13_RC14_arm64.apk | grep -Fxq 'lib/arm64-v8a/libUVCCamera.so'
          unzip -Z1 BlueStar_Guide_1.0.13_RC14_arm64.apk | grep -Fxq 'res/raw/c_metal_clack_ding.mp3'
          unzip -Z1 BlueStar_Guide_1.0.13_RC14_arm64.apk | grep -Fxq 'res/raw/voice_send_whoosh.wav'
          grep -Fq "package: name='com.vobich.bluestar.rc14'" badging.txt
          grep -Fq "versionCode='23'" badging.txt
          grep -Fq "versionName='1.0.13-rc14'" badging.txt
          grep -Fq "application-label:'Blue Star Guide'" badging.txt
          grep -q 'application-icon-' badging.txt
          if grep -Ei 'inference\.onnx|paddle|ppocr|sherpa|layout.*onnx' apk-entries.txt; then
            echo "Unexpected on-device OCR model found" >&2
            exit 1
          fi
          echo "APK_SIZE_BYTES=$(stat -c%s BlueStar_Guide_1.0.13_RC14_arm64.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SHA256=$(sha256sum BlueStar_Guide_1.0.13_RC14_arm64.apk | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only verified CI APK without rebuilding or resigning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=blue-star-guide-cloud-rc14-20261107
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing RC14 Release; refuse overwrite." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "verified/BlueStar_Guide_1.0.13_RC14_arm64.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target 98d6996d0c6dd72347b1e763c23922d3d6a8ec2c \
            --title "Blue Star Guide 1.0.13 RC14 - USB Stream Diagnostics and Hardware Picture Controls" \
            --notes "RC14 is a separate Android ARM64 debug-signed test app based directly on RC13. User confirmed prior RC13 USB rotation/mirror and cloud OCR orientation issue is resolved; its source remains unchanged. New counter-only USB tracing records pause/resume, native close/open timings, 5Hz raw NV21 callback FPS and TextureView new-buffer callbacks, with a warmup threshold and distinct both-stall/raw-stall/preview-stall classifications. No extra image capture or background network. This is DIAGNOSIS only, not a claim that frame-stutter has been fixed; no automatic camera restart loop was added. Settings > Camera > USB picture adjustment now offers brightness, contrast, saturation and gain sliders using pinned AUSBC UVC hardware APIs, only if the camera reports support, applied only on user release and remembered per USB device after hardware readback. Hardware default reset clears settings. Excessive auto-exposure may still wash out highlights; unsupported options are disabled. Original Camera2, native UVC preview, USB/NV21/JPEG direction, Qwen model/ASR/TTS, original icon/sounds and task manager retained. Full Android Actions run 42340452858 completed SUCCESS at commit 98d6996d0c6dd72347b1e763c23922d3d6a8ec2c: static privacy tests, RC13 32 orientation combinations, new USB lifecycle sample classifier and UVC slider bounds, pinned native patches, arm64 Gradle build, APK badge/icon/audio tests. This Release uploads ONLY the checked original CI APK, no recompile or re-sign. New isolated package com.vobich.bluestar.rc14, versionCode 23, versionName 1.0.13-rc14. Does not inherit RC13 API key/tasks/camera profile: configure on phone and test 10 background/foreground transitions with USB, compare raw and preview FPS, validate supported picture sliders and actual image. Do not treat CI as vivo hardware validation." \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'BlueStar_Guide_1.0.13_RC14_arm64.apk'
          echo "Direct browser URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BlueStar_Guide_1.0.13_RC14_arm64.apk" >> "$GITHUB_STEP_SUMMARY"
