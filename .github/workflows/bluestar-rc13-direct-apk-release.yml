name: Publish Verified RC13 USB Direction Fix APK
on:
  push:
    branches: [fix/bluestar-112-usb-orientation-preview-jpeg-20261107]
    paths: ['.github/workflows/bluestar-rc13-direct-apk-release.yml']

permissions:
  actions: read
  contents: write

jobs:
  publish-verified-rc13:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Require exact successful RC13 Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=42338431417
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha')" = 339793a2ce4f1021dba889c38a1cb1653f9d674f
      - name: Retrieve unchanged official CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download 42338431417 \
            --repo "$GITHUB_REPOSITORY" \
            --name blue-star-guide-1-0-12-rc13-arm64 \
            --dir verified
          test -s verified/BlueStar_Guide_1.0.12_RC13_arm64.apk
          test -s verified/SHA256SUMS.txt
          test -s verified/badging.txt
          test -s verified/apk-entries.txt
      - name: Verify exact APK checksum, JNI camera, sounds, signature package and version
        run: |
          set -euo pipefail
          cd verified
          sha256sum -c SHA256SUMS.txt
          unzip -tq BlueStar_Guide_1.0.12_RC13_arm64.apk >/dev/null
          unzip -Z1 BlueStar_Guide_1.0.12_RC13_arm64.apk | grep -Fxq 'lib/arm64-v8a/libUVCCamera.so'
          unzip -Z1 BlueStar_Guide_1.0.12_RC13_arm64.apk | grep -Fxq 'res/raw/c_metal_clack_ding.mp3'
          unzip -Z1 BlueStar_Guide_1.0.12_RC13_arm64.apk | grep -Fxq 'res/raw/voice_send_whoosh.wav'
          grep -Fq "package: name='com.vobich.bluestar.rc13'" badging.txt
          grep -Fq "versionCode='22'" badging.txt
          grep -Fq "versionName='1.0.12-rc13'" badging.txt
          grep -Fq "application-label:'Blue Star Guide'" badging.txt
          grep -q 'application-icon-' badging.txt
          if grep -Ei 'inference\.onnx|paddle|ppocr|sherpa|layout.*onnx' apk-entries.txt; then
            echo "Found forbidden bundled OCR model" >&2
            exit 1
          fi
          echo "APK_SIZE_BYTES=$(stat -c%s BlueStar_Guide_1.0.12_RC13_arm64.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SHA256=$(sha256sum BlueStar_Guide_1.0.12_RC13_arm64.apk | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish exactly the checked CI build, no rebuild and no resign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=blue-star-guide-cloud-rc13-20261107
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing RC13 Release. Refusing overwrite." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "verified/BlueStar_Guide_1.0.12_RC13_arm64.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target 339793a2ce4f1021dba889c38a1cb1653f9d674f \
            --title "Blue Star Guide 1.0.12 RC13 - USB Preview and AI JPEG Direction Fix" \
            --notes "Original repo RC13 standalone ARM64 debug-signed APK based directly on verified RC12. Critical fix: USB left/right correction now acts in final DISPLAY coordinates even after rotation 90/270; one pure Java UsbFrameOrientation plan drives both TextureView local preview axes and rotated NV21/JPEG mirror+flip. The reported 90-degree guitar-left/right case is covered by 32 asymmetric YUV/UV pixel unit tests across 4 rotations x 8 mirror/flip states. Runtime Diagnostics now logs real USB buffered-frame age (0 is no longer falsely reported as fresh-frame wait), rejects snapshots older than 800ms, records numeric source/JPEG width/height and rotation/mirror/flip states. Settings > Runtime Diagnostics has a manual 'view last JPEG sent to AI' option; JPEG is RAM-only, never included in anonymous exports, and viewing performs no second request. Existing 720p auto-quality remains selectable 1080p manually; USB native stream/Camera2/AI routing/TTS/icons/tink/whoosh and tasks unchanged. Tested static security and Java regressions, compiled Android ARM64, checked APK package version/resources in GitHub Actions run 42338431417 SUCCESS at exact source 339793a2ce4f1021dba889c38a1cb1653f9d674f. This is the unmodified official CI APK, not rebuilt or re-signed. New com.vobich.bluestar.rc13 versionCode22 versionName 1.0.12-rc13 is separate from RC12; re-enter Beijing Bailian API key and any custom tasks. Physical vivo X200 Pro USB preview-to-JPEG orientation and OCR quality still need user validation. The preview and NV21 callbacks may have device-specific native differences; use actual JPEG viewer to verify." \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'BlueStar_Guide_1.0.12_RC13_arm64.apk'
          echo "Direct browser download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BlueStar_Guide_1.0.12_RC13_arm64.apk" >> "$GITHUB_STEP_SUMMARY"
