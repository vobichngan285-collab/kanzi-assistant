name: Blue Star M02S Fresh AP + Bounded Recovery v0.1.23
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-oem-fresh-ap-bounded-recovery-v0123-20261115']
    paths:
      - 'experiments/m02s-wifi-only-lab/**'
      - '.github/workflows/m02s-oem-fresh-ap-v0123.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify exact BLE AP and read-only device-query whitelists; unit tests and build
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=experiments/m02s-wifi-only-lab/app/src/main/java
          WIRE="$SOURCE/com/vobichngan/bluestar/m02slab/M02sApWire.java"
          grep -Fq '0x39, 0x30, 0x69' "$WIRE"
          grep -Fq 'Arrays.equals(AP_REQUEST, bytes)' "$WIRE"
          grep -Fq 'actionSyncPhotoFlag' "$WIRE"
          grep -Fq 'actionSyncImportFlag' "$WIRE"
          grep -Fq 'authorizedReadOnlyProject' "$WIRE"
          grep -Fq '0x02, 0x64, 0x64' "$WIRE"
          grep -Fq 'decodeReadOnlyProject' "$WIRE"
          grep -Fq 'requestReadOnlyProject()' "$SOURCE/com/vobichngan/bluestar/m02slab/M02sApStarter.java"
          grep -Fq 'observePhoneWifi("本轮onUnavailable")' "$SOURCE/com/vobichngan/bluestar/m02slab/M02sApStarter.java"
          grep -Fq 'getScanResults()' "$SOURCE/com/vobichngan/bluestar/m02slab/M02sApStarter.java"
          grep -Fq 'deviceProjectReported' "$SOURCE/com/vobichngan/bluestar/m02slab/MainActivity.java"
          grep -Fq 'optionalE09IsImportFlagIsStrictAndAbsentIsUnknown' \
            experiments/m02s-wifi-only-lab/app/src/test/java/com/vobichngan/bluestar/m02slab/M02sApWireTest.java
          grep -Fq 'onlyExactReadOnlyProjectQueryAllowedAndReplyIsValidated' \
            experiments/m02s-wifi-only-lab/app/src/test/java/com/vobichngan/bluestar/m02slab/M02sApWireTest.java
          # Do not accidentally re-introduce any BLE command for cleanup or photo capture.
          if grep -R -E 'nonClearFinishRequest|requestNonClearFinish|FINISH_NOT_CLEAR' "$SOURCE"; then
            echo 'Unsafe: cleanup BLE command unexpectedly present in read-only experiment' >&2
            exit 1
          fi
          STARTER="$SOURCE/com/vobichngan/bluestar/m02slab/M02sApStarter.java"
          MAIN="$SOURCE/com/vobichngan/bluestar/m02slab/MainActivity.java"
          grep -Fq 'setSsid(expectedSsid)' "$STARTER"
          grep -Fq 'void photoActionEnded();' "$STARTER"
          grep -Fq 'if (!valid(token) || networkCallback != this) return;' "$STARTER"
          grep -Fq 'wifiRequestAtMs' "$STARTER"
          grep -Fq '次准确SSID请求onUnavailable；等待=' "$STARTER"
          grep -Fq '网络请求未满足' "$STARTER"
          grep -Fq 'if (tryReuseConnectedTarget(token)) {' "$STARTER"
          if grep -Fq 'Android未能连接眼镜AP，拒绝反复申请或猜测热点' "$STARTER"; then
            echo 'Old misleading onUnavailable message and unsafe callback ownership still exist' >&2
            exit 1
          fi
          grep -Fq 'ui.postDelayed(ssidTimeout, 5000L)' "$STARTER"
          grep -Fq 'if (falling)' "$STARTER"
          grep -Fq 'private void startPhotoTransfer()' "$MAIN"
          grep -Fq 'manualImportButton=addButton' "$MAIN"
          grep -Fq 'this::startPhotoTransfer' "$MAIN"
          grep -Fq 'private void confirmPhotoFinishedManually()' "$MAIN"
          if grep -Fq 'PHOTO_DONE_SETTLE_MS' "$MAIN" || grep -Fq 'pendingPhotoAction' "$MAIN"; then
            echo 'Auto photo-to-import task is forbidden' >&2
            exit 1
          fi
          grep -Fq 'cancelCurrentTransfer()' "$MAIN"
          grep -Fq 'waitingPhotoDone = true' "$MAIN"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('experiments/m02s-wifi-only-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/MainActivity.java')
          code=p.read_text()
          event=code.split('@Override public void photoActionEnded()',1)[1].split('@Override public void deviceProjectReported',1)[0]
          assert 'photoReadyForManualImport = true;' in event
          for forbidden in ('startPhotoTransfer(', 'requestPhotoTransfer(', 'postDelayed(', 'writeApCommand('):
              assert forbidden not in event, ('auto-import from photo notification', forbidden)
          assert code.count('startPhotoTransfer(') == 1, 'only manual import method should invoke transfer'
          assert code.count('starter.requestPhotoTransfer()') == 1, 'one BLE AP entry'
          assert 'manualImportButton.setEnabled(false)' in code
          assert 'if (waitingPhotoDone || !photoReadyForManualImport)' in code
          assert 'photoReadyForManualImport = false;' in code
          assert 'this::startPhotoTransfer' in code
          print('PASS: no auto-AP at photo end, only user-tapped import')
          PY
          if grep -Fq 'PHOTO_DONE_FALLBACK_MS' "$MAIN" || grep -Fq '2200L' "$MAIN" || grep -Fq '2.2秒' "$MAIN"; then
            echo 'Forbidden photo-finish timeout fallback remains in v0.1.22' >&2
            exit 1
          fi
          grep -Fq 'clearPendingPhotoAction()' "$MAIN"
          if grep -Fq 'startPhotoTransfer(true), 350L' "$MAIN"; then
            echo 'old premature 350ms AP activation still present' >&2
            exit 1
          fi
          # Experimental Wi-Fi checks are active only AFTER manual AP startup;
          # they cannot silently bypass the previous verified BLE media path.
          grep -Fq 'wifi.startScan()' "$STARTER"
          grep -Fq 'M02sApReadinessPolicy.inspect' "$STARTER"
          grep -Fq 'M02sApRecoveryPolicy.allowOnePinnedRetry' "$STARTER"
          grep -Fq 'builder.setBssid(MacAddress.fromString(freshBssid))' "$STARTER"
          grep -Fq 'wifiRequestCount >= 2' "$STARTER"
          grep -Fq 'scanRequestedAtUs = SystemClock.elapsedRealtimeNanos() / 1000L' "$STARTER"
          grep -Fq 'FRESH_SCAN_MAX_MS = 7_000L' "$STARTER"
          grep -Fq 'ONE_SHOT_MAX_MS = 80_000L' "$MAIN"
          grep -Fq 'onlyAfterFirstFailedSsidRequestAndNewUniqueBeacon'             experiments/m02s-wifi-only-lab/app/src/test/java/com/vobichngan/bluestar/m02slab/M02sApRecoveryPolicyTest.java
          python3 - <<'PY'
          from pathlib import Path
          main=Path('experiments/m02s-wifi-only-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/MainActivity.java').read_text()
          starter=Path('experiments/m02s-wifi-only-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/M02sApStarter.java').read_text()
          assert main.count('starter.requestPhotoTransfer()') == 1
          assert starter.count('wifi.startScan()') == 1
          assert starter.count('connectivity.requestNetwork(') == 1
          assert starter.count('M02sApRecoveryPolicy.allowOnePinnedRetry(') == 1
          assert starter.count('beginFreshApScan(token, false)') == 2
          assert 'onUnavailable()' in starter
          assert 'wifiRequestCount == 1 && !previousRequestPinned' in starter
          assert 'connectWifi(token, recovery)' in starter
          assert 'if (tryReuseConnectedTarget(token)) {' in starter
          assert '.setWpa2Passphrase(OEM_AP_PASSPHRASE)' in starter
          assert 'recovery ? "第二次改用BSSID精确匹配"' in starter
          print('PASS: one manual AP entry, fresh-scan gate and bounded strategy change')
          PY
          if grep -R -E 'M02sBleWire[.]photoThumbnail|e09BlePhoto[(]|[.]removeFile[(]|DELETE_MEDIA' "$SOURCE" ; then
            echo 'Unauthorized shutter/erase API in one-time AP starter' >&2
            exit 1
          fi
          gradle -p experiments/m02s-wifi-only-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify manifest, standalone APK signing and package
        shell: bash
        run: |
          set -euo pipefail
          APK=experiments/m02s-wifi-only-lab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02sfreshaplab' versionCode='24' versionName='0.1.23'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          for p in BLUETOOTH_SCAN BLUETOOTH_CONNECT ACCESS_NETWORK_STATE ACCESS_WIFI_STATE CHANGE_NETWORK_STATE CHANGE_WIFI_STATE NEARBY_WIFI_DEVICES ACCESS_FINE_LOCATION INTERNET; do
            grep -q "android.permission.${p}" "$RUNNER_TEMP/permissions.txt"
          done
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or photo storage permission' >&2
            exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_FreshAP_BoundedRecovery_0.1.23_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload standalone signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-FreshAP-BoundedRecovery-v0123-APK
          path: release/BlueStar_M02S_FreshAP_BoundedRecovery_0.1.23_Android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable browser download URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.txt" <<'EOF'
          v0.1.23 isolated AP fresh-broadcast and bounded recovery test; based on verified manual-import v0.1.22. Physical shutter and a second deliberate import tap remain mandatory. Only the Android Wi-Fi section changes: exact BLE 0x25 SSID; reuse verified active Network if available; otherwise one scan for a timestamp-fresh unique radio after AP start. Attempt 1 uses the original validated SSID+WPA2 WifiNetworkSpecifier. A single optional recovery re-checks the beacon after onUnavailable; retry only if a NEW unique valid BSSID is visible, and uses a materially different BSSID-pinned specifier. Max two Android Wi-Fi requests, no extra BLE AP open, 7s max each scan, 80s overall manual import deadline. Android scan failure is UNKNOWN, not proof that the eyewear AP is down. This is not established to be the literal factory app implementation.
          All verified photo HTTP200/JPEG-to-RAM safety checks and BLE whitelists stay intact. No 0x44 cleanup/deletion, 0x22 shutter, P2P, OTA, cloud, system gallery writes, or phone/glasses photo deletion. Standalone appId com.vobichngan.bluestar.m02sfreshaplab. CI pass does not guarantee five physical captures work. Keep v0.1.22 and all earlier downloads.
          EOF
          gh release create bluestar-m02s-fresh-ap-bounded-recovery-v0123-20261115 \
            release/BlueStar_M02S_FreshAP_BoundedRecovery_0.1.23_Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S Fresh AP Bounded Recovery v0.1.23 — experimental" \
            --prerelease --notes-file "$RUNNER_TEMP/release-notes.txt"
      - name: Verify release published and downloadable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view bluestar-m02s-fresh-ap-bounded-recovery-v0123-20261115 \
            --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
