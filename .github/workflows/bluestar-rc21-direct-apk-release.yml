name: Publish verified RC21 default fast OCR line reading APK
on:
  push:
    branches: [feat/bluestar-121-default-line-ocr-20261107]
    paths: ['.github/workflows/bluestar-rc21-direct-apk-release.yml']

permissions:
  actions: read
  contents: write

jobs:
  publish-verified-rc21:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Require exact successful RC21 Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=42386658264
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha')" = 7cf4640c9f4652b13db2cab1095c88b16deb90be
      - name: Download official original CI APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download 42386658264 \
            --repo "$GITHUB_REPOSITORY" \
            --name blue-star-guide-1-0-20-rc21-arm64 --dir verified
          test -s verified/BlueStar_Guide_1.0.20_RC21_arm64.apk
          test -s verified/SHA256SUMS.txt
          test -s verified/badging.txt
          test -s verified/apk-entries.txt
      - name: Verify unchanged APK bytes native UVC audio app ID and version
        run: |
          set -euo pipefail
          cd verified
          sha256sum -c SHA256SUMS.txt
          unzip -tq BlueStar_Guide_1.0.20_RC21_arm64.apk >/dev/null
          unzip -Z1 BlueStar_Guide_1.0.20_RC21_arm64.apk | grep -Fxq 'lib/arm64-v8a/libUVCCamera.so'
          unzip -Z1 BlueStar_Guide_1.0.20_RC21_arm64.apk | grep -Fxq 'res/raw/c_metal_clack_ding.mp3'
          unzip -Z1 BlueStar_Guide_1.0.20_RC21_arm64.apk | grep -Fxq 'res/raw/voice_send_whoosh.wav'
          grep -Fq "package: name='com.vobich.bluestar.rc21'" badging.txt
          grep -Fq "versionCode='30'" badging.txt
          grep -Fq "versionName='1.0.20-rc21'" badging.txt
          grep -Fq "application-label:'Blue Star Guide'" badging.txt
          grep -q 'application-icon-' badging.txt
          if grep -Ei 'inference\.onnx|paddle|ppocr|sherpa|layout.*onnx' apk-entries.txt; then
            echo "Unexpected on-device OCR model found" >&2
            exit 1
          fi
          echo "APK_SIZE_BYTES=$(stat -c%s BlueStar_Guide_1.0.20_RC21_arm64.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SHA256=$(sha256sum BlueStar_Guide_1.0.20_RC21_arm64.apk | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only verified CI APK without rebuilding or resigning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=blue-star-guide-cloud-rc21-20261107
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing RC21 Release; refuse overwrite." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "verified/BlueStar_Guide_1.0.20_RC21_arm64.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target 7cf4640c9f4652b13db2cab1095c88b16deb90be \
            --title "Blue Star Guide 1.0.20 RC21 - Default fast line-by-line OCR speech" \
            --notes "Blue Star Guide 1.0.20 RC21 promotes user-validated RC20 OCR speed experiment mode C into the previous full-featured Android app: Read Text and spoken READ_TEXT now stream one complete newline-delimited OCR line at a time to TTS, rather than waiting for the whole image response. One same-720p phone comparison found first TTS callback at 1650ms in C versus 5210ms in A; user reports positive repeated phone trials. This directly reuses tested RC20 line streaming; no new recognition pipeline. The old whole-result A remains selectable in Settings > Cloud AI > Text reading mode; experimental B is hidden. Same OCR models, approved prompts, one JPEG and one cloud request, token accounting, voice, web chat, cameras, USB native UVC, orientation and audio resources are retained. No on-device OCR model, extra request or picture persistence. Exact Actions 42386658264 build succeeded at source 7cf4640c9f4652b13db2cab1095c88b16deb90be; release publishes the checksum-verified original APK without rebuild or resign. Separate com.vobich.bluestar.rc21 versionCode30 versionName1.0.20-rc21 requires its own API key and USB preferences. Real RC21 vivo phone acceptance remains pending." \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'BlueStar_Guide_1.0.20_RC21_arm64.apk'
          echo "Direct browser URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BlueStar_Guide_1.0.20_RC21_arm64.apk" >> "$GITHUB_STEP_SUMMARY"
