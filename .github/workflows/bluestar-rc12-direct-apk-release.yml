name: Publish Verified RC12 Max Fast and Task Delete APK
on:
  push:
    branches: [fix/bluestar-111-maxfast-remove-plus-drag-delete-20261107]
    paths: ['.github/workflows/bluestar-rc12-direct-apk-release.yml']

permissions:
  actions: read
  contents: write

jobs:
  publish-verified-rc12:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Require successful exact RC12 Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=42336813720
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha')" = c9fec2edfc881098fe896d2cf3c669cf5cbafbfd
      - name: Download original verified RC12 build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download 42336813720 --repo "$GITHUB_REPOSITORY" \
            --name blue-star-guide-1-0-11-rc12-arm64 --dir verified
          test -s verified/BlueStar_Guide_1.0.11_RC12_arm64.apk
          test -s verified/SHA256SUMS.txt
          test -s verified/badging.txt
      - name: Verify APK bytes, version and original resources
        run: |
          set -euo pipefail
          cd verified
          sha256sum -c SHA256SUMS.txt
          unzip -tq BlueStar_Guide_1.0.11_RC12_arm64.apk >/dev/null
          unzip -Z1 BlueStar_Guide_1.0.11_RC12_arm64.apk | grep -Fx 'lib/arm64-v8a/libUVCCamera.so'
          unzip -Z1 BlueStar_Guide_1.0.11_RC12_arm64.apk | grep -Fx 'res/raw/c_metal_clack_ding.mp3'
          unzip -Z1 BlueStar_Guide_1.0.11_RC12_arm64.apk | grep -Fx 'res/raw/voice_send_whoosh.wav'
          grep -Fq "package: name='com.vobich.bluestar.rc12'" badging.txt
          grep -Fq "versionCode='21'" badging.txt
          grep -Fq "versionName='1.0.11-rc12'" badging.txt
          grep -Fq "application-label:'Blue Star Guide'" badging.txt
          echo "RC12 original APK SHA256: $(sha256sum BlueStar_Guide_1.0.11_RC12_arm64.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "Original APK size in bytes: $(stat -c%s BlueStar_Guide_1.0.11_RC12_arm64.apk)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish unmodified original CI APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=blue-star-guide-cloud-rc12-20261107
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "RC12 release already exists; refusing overwrite." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "verified/BlueStar_Guide_1.0.11_RC12_arm64.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target c9fec2edfc881098fe896d2cf3c669cf5cbafbfd \
            --title "Blue Star Guide 1.0.11 RC12 - Fast Max and Drag-to-Delete" \
            --notes "RC12 builds directly on RC11 in the original repository. Three visual models are now selectable: Qwen3.7-Flash, Qwen3.8-Flash (unchanged daily default), Qwen3.8-Max (fast no-thinking request, bounded output). Qwen3-VL-Plus has been removed from the selectable model list; an old Plus preference migrates to daily Flash, while previous usage history is kept as a read-only record. The task launcher now shows a red delete target while holding and dragging an existing task; dropping requires confirmation. User-created tasks are deleted; five system presets are only hidden and can be restored in Settings > Task Management. At least one runnable task is protected. Prior native camera, USB stack, OCR, ASR, TTS, original sounds and icons stay intact. Isolated app ID com.vobich.bluestar.rc12, versionCode 21, versionName 1.0.11-rc12. Original Android source run 42336813720 completed SUCCESS with static checks, Java tests, arm64 Gradle build, APK checks, checksum. This GitHub Release publishes only that exact CI-built APK with no recompile or re-sign. As this is a separate debug app, configure API key and tasks again; test physical drag and Max response latency on vivo X200 Pro." \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'BlueStar_Guide_1.0.11_RC12_arm64.apk'
          echo "Browser direct URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BlueStar_Guide_1.0.11_RC12_arm64.apk" >> "$GITHUB_STEP_SUMMARY"
