name: Blue Star M02S E09 OEM Live Capability Read-Only
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-e09-live-capability-readonly-20261115']
    paths:
      - 'experiments/m02s-wifi-lab/**'
      - '.github/workflows/m02s-e09-live-capability-readonly-20261115.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and standalone Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p experiments/m02s-wifi-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify manual 0x95 hardware live support query, original BLE export and RTSP unchanged
        shell: bash
        run: |
          set -euo pipefail
          SRC="experiments/m02s-wifi-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/MainActivity.java"
          grep -Fq 'button("保存刚收到的蓝牙JPEG到手机相册（原始画质）", this::exportE09BleJpeg)' "$SRC"
          grep -Fq 'lastE09PhotoForExport = jpeg;' "$SRC"
          grep -Fq 'final byte[] jpeg = lastE09PhotoForExport.clone();' "$SRC"
          grep -Fq 'out.write(jpeg);' "$SRC"
          grep -Fq 'MediaStore.Images.Media.IS_PENDING' "$SRC"
          grep -Fq 'Environment.DIRECTORY_PICTURES + "/BlueStarE09"' "$SRC"
          grep -Fq 'if (lastE09PhotoForExport == null' "$SRC"
          grep -Fq 'button("E09 RTSP直播建连", this::startE09Live)' "$SRC"
          grep -Fq 'button("播放RTSP画面", this::playE09Preview)' "$SRC"
          grep -Fq 'M02sBleWire.e09BlePhoto()' "$SRC"
          ! grep -Fq 'Bitmap.compress(' "$SRC"
          # Compare the immutable Git blob from the user's tested v0.1.12 base.
          test "$(git hash-object experiments/m02s-wifi-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/M02sE09PhotoAssembler.java)" = "3be7b6c1b485d1766a9f0ebb5c65cbce2a0df0df"
          grep -Fq 'button("检测眼镜直播功能支持位（只读 BLE 0x95）", this::probeE09LiveSupport)' "$SRC"
          grep -Fq 'private void probeE09LiveSupport()' "$SRC"
          grep -Fq 'M02sBleWire.e09ReadCapabilities()' "$SRC"
          grep -Fq 'parsed.e09CapabilityMaskOrNull()' "$SRC"
          grep -Fq 'e09CapabilityPending' "$SRC"
          grep -Fq 'bit0 supportLive=' "$SRC"
          WIRE="experiments/m02s-wifi-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/M02sBleWire.java"
          grep -Fq 'public static byte[] e09ReadCapabilities() { return frame(0x95, 0x00); }' "$WIRE"
          grep -Fq 'payload.length != 4' "$WIRE"
          grep -Fq 'Arrays.equals(bytes, e09ReadCapabilities())' "$WIRE"
          # Preserve unchanged RTSP protocol/socket probe from user's v0.1.12 base.
          test "$(git hash-object experiments/m02s-wifi-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/M02sE09RtspProbe.java)" = "bec97b0f0ca5099e9fcfa4babd466409187c3097"
          echo "E09 original JPEG and RTSP transport unchanged; new capability query is manual, validated, and read-only"

      - name: Verify independent APK, permissions, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="experiments/m02s-wifi-lab/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02se09livechecklab' versionCode='15' versionName='0.1.12-livecheck'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.BLUETOOTH_SCAN' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.NEARBY_WIFI_DEVICES' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_WIFI_STATE' "$RUNNER_TEMP/permissions.txt"
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or media access in transport-only lab' >&2; exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_E09_LiveCapability_ReadOnly_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-E09-LiveCapability-ReadOnly-APK
          path: release/BlueStar_M02S_E09_LiveCapability_ReadOnly_Android.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct-browser APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/note.txt" <<'EOF'
          M02S E09 live capability read-only experiment based strictly on the original user's successful BLE JPEG v0.1.12 and v0.1.12-export.
          Android16 physical logs: APP_LIVE 0x67/0x30 got BLE ack 0x67 and 0x25 SSID, fresh target hotspot scan, but Android local-only connection failed at ASSOCIATION (reason 1); RTSP stream and media player have NOT been tested.
          Added only one user-tapped OEM GET_SUPPORT_FUNCTION query 0x95/0x00, which does not start WiFi/live/photo and does not modify the glasses. Exact OEM decompiled SendCommandViaBle.getSupportFunction() calls configSendCommand(149,0), E09 source confirms the command and 4-byte big-endian bit 0 supportLive.
          Strict AA14 AC55 checksum and exactly 4-byte parsing; bit0 reports firmware-declared live support; no reply/invalid replies return UNKNOWN, never "unsupported". No retries; 5-second bound. No hardcoded verdict from TK8; TK8 only indicates the T AP provisioning family.
          Existing proven E09 BLE AA15 JPEG transport, original gallery export, original E09 APP_LIVE 0x67/0x30, RTSP probe and Android player are preserved without rewriting. No deleting commands or OTA have been added.
          New independent package com.vobichngan.bluestar.m02se09livechecklab version 0.1.12-livecheck, leaving all existing apps untouched. Upstream E09 MIT attribution and license remain.
          EOF
          gh release create bluestar-m02s-e09-live-capability-readonly-20261115 \
            release/BlueStar_M02S_E09_LiveCapability_ReadOnly_Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S E09 OEM Live Capability Read-Only (0x95) — v0.1.12 baseline" \
            --prerelease --notes-file "$RUNNER_TEMP/note.txt"
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bluestar-m02s-e09-live-capability-readonly-20261115 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
