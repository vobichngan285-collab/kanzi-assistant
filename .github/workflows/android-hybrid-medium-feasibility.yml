name: Android Hybrid Medium Feasibility - NO APK, NO RELEASE
on:
  push:
    branches: [test/android-hybrid-medium-feasibility-20261103]
    paths:
      - app/src/main/java/com/vobichngan/kanzi/HybridMediumCompileProbe.kt
      - scripts/patch_android_sdk_medium_probe.py
      - scripts/profile_small_medium_host_load.py
      - .github/workflows/android-hybrid-medium-feasibility.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-only:
    name: Compile Android one-detector two-recognizer SDK without packaging
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated experiment only
        uses: actions/checkout@v4
      - name: Checkout fixed upstream Android PaddleOCR SDK
        uses: actions/checkout@v4
        with:
          repository: PaddlePaddle/PaddleOCR
          ref: v3.7.0
          path: third_party/PaddleOCR
      - name: Prepare original #315 Small model and dictionary - NOT Medium assets
        run: |
          set -euo pipefail
          SDK="third_party/PaddleOCR/deploy/ppocr-android/ppocr-sdk"
          test -s "$SDK/src/main/java/com/paddle/ocr/engine/ORTSessionManager.kt"
          rm -f "$SDK/build.gradle.kts"
          mkdir -p "$SDK/src/main/assets/models/det" "$SDK/src/main/assets/models/rec"
          curl -fL --retry 3 --retry-delay 2 'https://huggingface.co/PaddlePaddle/PP-OCRv6_small_det_onnx/resolve/5994b4f/inference.onnx' -o "$SDK/src/main/assets/models/det/inference.onnx"
          curl -fL --retry 3 --retry-delay 2 'https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/3d2d345/inference.onnx' -o "$SDK/src/main/assets/models/rec/inference.onnx"
          curl -fL --retry 3 --retry-delay 2 'https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/b8f84f0b80c529de40b4fbb3544b84fa7233a513/inference.yml?download=true' -o "$SDK/src/main/assets/models/rec/inference.yml"
          echo "d73e0058b7a8086bbd57f3d10b8bcd4ff95363f67e06e2762b5e814fe9c9410e  $SDK/src/main/assets/models/det/inference.onnx" | sha256sum -c -
          echo "5435fd747c9e0efe15a96d0b378d5bd157e9492ed8fd80edf08f30d02fa24634  $SDK/src/main/assets/models/rec/inference.onnx" | sha256sum -c -
          # Official model metadata says BGR: preserve RELEASE behavior not earlier RGB approximation.
          grep -q 'img_mode: BGR' "$SDK/src/main/assets/models/rec/inference.yml"
          cat > "$SDK/build.gradle" <<'GRADLE'
          plugins { id 'com.android.library'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.paddle.ocr'
              compileSdk 36
              defaultConfig { minSdk 26 }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.21.1'
              api 'com.quickbirdstudios:opencv:4.5.3.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
              implementation 'androidx.core:core-ktx:1.15.0'
          }
          GRADLE
          python3 scripts/patch_android_sdk_medium_probe.py "$SDK"
          # Confirm Medium weights are NOT copied into Android app/assets in compile-only research.
          ! find app/src/main/assets "$SDK/src/main/assets" -iname '*medium*.onnx' -print -quit 2>/dev/null | grep .
          echo "One real Small detector + optional Medium recognition SDK API patched in CI only." >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout existing USB camera dependency without modification to source
        uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: third_party/AndroidUSBCamera
      - name: Reuse release USB compatibility patches and existing ABI set
        run: |
          set -euo pipefail
          python3 scripts/patch_uvc_resolution.py third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/MultiCameraClient.kt
          python3 scripts/patch_usbmonitor.py third_party/AndroidUSBCamera/libuvc/src/main/java/com/jiangdg/usb/USBMonitor.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('third_party/AndroidUSBCamera/libnative/build.gradle')
          s=p.read_text()
          a="""abiFilters 'armeabi-v7a','arm64-v8a', "x86", "x86_64" """
          if a.strip() not in s:raise SystemExit('ABI patch source mismatch')
          p.write_text(s.replace(a.strip(),"abiFilters 'armeabi-v7a','arm64-v8a'",1))
          print('Existing two Android phone ABIs retained')
          PY
      - name: Use same JDK 17 / Gradle as #315
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile source only - do NOT invoke assemble, bundle, sign or publish
        run: |
          set -euo pipefail
          gradle --no-daemon --no-parallel --max-workers=2 --stacktrace \
            :ppocr-sdk:compileDebugKotlin \
            :app:compileDebugKotlin \
            :app:compileDebugJavaWithJavac
          # Strong guard: do not accidentally create APK files in experiment.
          if find app/build -type f -name '*.apk' -print -quit | grep -q .; then
            echo 'ERROR: APK file unexpectedly produced in compile-only job.'
            exit 1
          fi
          echo 'Android compile-only checks passed. No APK was produced, signed or published.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Android APIs compile, but no device-side Android model load was executed.' >> "$GITHUB_STEP_SUMMARY"
  host-memory:
    name: Load exact ONNX models together and profile host CPU/RSS (not phone)
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host-only ONNX runtime
        run: python3 -m pip install --quiet 'numpy==1.26.4' 'onnxruntime==1.21.1'
      - name: Download SHA-pinned exact #315 detector, Small REC and Medium REC
        run: |
          set -euo pipefail
          mkdir -p /tmp/kanzi-medium-models
          curl -fL --retry 4 --retry-delay 2 --max-time 240 'https://huggingface.co/PaddlePaddle/PP-OCRv6_small_det_onnx/resolve/5994b4f/inference.onnx' -o /tmp/kanzi-medium-models/det.onnx
          curl -fL --retry 4 --retry-delay 2 --max-time 240 'https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/3d2d345/inference.onnx' -o /tmp/kanzi-medium-models/small_rec.onnx
          curl -fL --retry 4 --retry-delay 2 --max-time 240 'https://huggingface.co/PaddlePaddle/PP-OCRv6_medium_rec_onnx/resolve/main/inference.onnx' -o /tmp/kanzi-medium-models/medium_rec.onnx
          echo 'd73e0058b7a8086bbd57f3d10b8bcd4ff95363f67e06e2762b5e814fe9c9410e  /tmp/kanzi-medium-models/det.onnx' | sha256sum -c -
          echo '5435fd747c9e0efe15a96d0b378d5bd157e9492ed8fd80edf08f30d02fa24634  /tmp/kanzi-medium-models/small_rec.onnx' | sha256sum -c -
          echo '9c09abf0957f7968c7586464b7397b84ad2387a0497a351af40e9acc71b673ba  /tmp/kanzi-medium-models/medium_rec.onnx' | sha256sum -c -
      - name: Isolated process A - original detector + Small recognizer
        run: |
          set -euo pipefail
          mkdir -p /tmp/kanzi-load-results
          python3 -u scripts/profile_small_medium_host_load.py \
            --models /tmp/kanzi-medium-models --scenario small \
            --out /tmp/kanzi-load-results | tee /tmp/kanzi-load-results/small.log
          grep -q 'TWO_RECOGNIZER_LOADING_BENCHMARK=PASS small' /tmp/kanzi-load-results/small.log
      - name: Isolated process B - ONE Small detector + Small and Medium recognizers
        run: |
          set -euo pipefail
          python3 -u scripts/profile_small_medium_host_load.py \
            --models /tmp/kanzi-medium-models --scenario hybrid \
            --out /tmp/kanzi-load-results | tee /tmp/kanzi-load-results/hybrid.log
          grep -q 'TWO_RECOGNIZER_LOADING_BENCHMARK=PASS hybrid' /tmp/kanzi-load-results/hybrid.log
          cat /tmp/kanzi-load-results/small_memory_latency.json >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/kanzi-load-results/hybrid_memory_latency.json >> "$GITHUB_STEP_SUMMARY"
          echo 'Host-only RAM, CPU and ONNX loading; cannot establish Android thermal/USB/TTS performance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JSON measurement reports only, no model or app binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-small-medium-host-memory-cpu-report
          path: /tmp/kanzi-load-results/
          retention-days: 10
          if-no-files-found: warn
