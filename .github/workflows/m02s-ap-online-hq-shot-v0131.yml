name: Blue Star M02S AP-Online High-Quality Shot Single Probe v0.1.31
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-ap-online-hq-shot-v0131-20261115']
    paths:
      - 'experiments/m02s-wifi-only-lab/**'
      - '.github/workflows/m02s-ap-online-hq-shot-v0131.yml'
permissions:
  contents: write

concurrency:
  group: m02s-ap-online-hq-shot-v0131
  cancel-in-progress: true

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check full-cycle OEM protocol and run JVM tests + Android build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('experiments/m02s-wifi-only-lab/app/src')
          java=root/'main/java/com/vobichngan/bluestar/m02slab'
          tests=root/'test/java/com/vobichngan/bluestar/m02slab'
          starter=(java/'M02sApStarter.java').read_text()
          main=(java/'MainActivity.java').read_text()
          wire=(java/'M02sApWire.java').read_text()
          policy=(java/'M02sOemImportPolicy.java').read_text()
          listing=(java/'M02sPhotoListReader.java').read_text()
          for required in (
              '0x44,(byte)mode', 'MAX_OEM_BATCH_IMAGES = 24',
              'Branch.ZERO', 'Branch.FULL', 'Branch.PARTIAL',
              'public static boolean authorizedFinish(byte[] frame)'
          ): assert required in policy, required
          for required in (
              'requestOemFinish(int total, int done, OemFinishCallback cb)',
              'M02sOemImportPolicy.finishFrame(total,done)',
              'M02sOemImportPolicy.authorizedFinish(frame)',
              'awaitingOldWifiLoss', 'checkOldWifiGone(generation)',
              'connectivity.unregisterNetworkCallback(old)',
              'setSsidPattern(new PatternMatcher(',
              'builder.setBssid(MacAddress.fromString(freshBssid))',
              'scanRequestedAtUs = bleCommandAtMs * 1000L'
          ): assert required in starter, required
          for required in (
              'downloadOemSession(', 'M02sPhotoListReader.sameSnapshot(previousFullList,list)',
              'originalsCompletedThisRound=count;',
              'starter.requestOemFinish(originalCount,done,ok ->',
              'M02sOemImportPolicy.canCompleteWholeList(',
              'lastDownloadedRemoteName=latest.remoteName'
          ): assert required in main, required
          assert main.count('starter.requestPhotoTransfer()') == 1
          assert main.count('starter.requestOemFinish(') == 1
          assert 'partialFinishOptIn' not in main and 'partialCheckbox' not in main
          assert 'requestPartialOneFinish' not in starter
          assert 'partialOneFinishRequest' not in wire
          assert 'sameSnapshot(Result first, Result second)' in listing
          block=main.split('@Override public void photoActionEnded()',1)[1].split('@Override public void deviceProjectReported',1)[0]
          assert 'requestPhotoTransfer(' not in block
          assert 'startPhotoTransfer(' not in block
          assert 'M02sOemImportPolicy.finishFrame' in (tests/'M02sOemImportPolicyTest.java').read_text()
          recovery=(java/'M02sWifiRecoveryPolicy.java').read_text()
          recover_test=(tests/'M02sWifiRecoveryPolicyTest.java').read_text()
          for required in ('wifiSsidOnlyFallbackAttempted', 'wifiRecoveryClosing',
                           'requestZeroFinishAfterWifiFailure(OemFinishCallback cb)',
                           'requestOemFinishInternal(0,0,cb,true)',
                           'closeFailedWifiSession(int token,String reason)',
                           'connectWifi(token,false,true)',
                           'M02sWifiRecoveryPolicy.canTrySsidOnly(',
                           'callback.recoverableImportFailure(',
                           'awaitZeroImportIdleAfterExit(token)',
                           'awaitingZeroImportIdle',
                           'zeroImportIdleTimeout'):
              assert required in starter, required
          assert starter.count('connectWifi(token,false,true)') == 1
          assert 'if (!valid(token) || networkCallback != this) return;' in starter
          assert 'networkCallback = null;' in starter
          assert 'canTrySsidOnly' in recovery and 'onceOnlyAfterFreshBssidPinnedRequestFails' in recover_test
          assert 'photoReadyForManualImport=true;' in main
          assert 'recoverableImportFailure(String message)' in main
          assert main.count('starter.requestPhotoTransfer()') == 1
          assert main.count('starter.requestOemFinish(') == 1
          assert 'startupRecoveryLoop' not in starter
          assert 'onUnavailable' in starter
          assert 'app/src' not in recovery
          print('PASS: one bounded fallback, OEM ZERO GATT close, preserve photo and BLE; v28 full path unchanged')
          assert 'stableInventoryNeedsAllItemNamesAndSizesMatching' in (tests/'M02sPhotoListReaderTest.java').read_text()
          probe_policy=(java/'M02sApPhotoProbePolicy.java').read_text()
          probe_test=(tests/'M02sApPhotoProbePolicyTest.java').read_text()
          probe_wire_test=(tests/'M02sApOnlineShotWireTest.java').read_text()
          for required in (
              'authorizedApOnlineHighQualityShot(byte[] frame)',
              'apOnlineHighQualityShot()',
              '0x22, 0x31, 0x53',
              'validatedResponseCommand(byte[] frame)'):
              assert required in wire, required
          for required in (
              'requestApOnlineHighQualityPhoto()',
              'canProbeHighQualityPhotoDuringAp()',
              'lastImportFlag==1',
              'apPhotoProbeUsed=true',
              'if (apPhotoProbePending)',
              'callback.apPhotoProbeWriteResult(status==0)',
              'apPhotoProbeWritePending()'):
              assert required in starter, required
          for required in (
              'startApPhotoHold()', 'sendSingleApPhotoProbe()',
              'apPhotoHoldRequested=true;', 'apPhotoProbeAttempted=true;',
              'startPhotoTransfer();', 'M02sApPhotoProbePolicy.compare(',
              'M02sPhotoListReader.sameSnapshot(apPhotoCandidateConfirm,current)',
              'M02sPhotoTransport.getOriginalPhoto(net,host,image)',
              'nativeHighRes=(bmp.getWidth()==3200 && bmp.getHeight()==2400)',
              'starter.isActive(net,host)', 'closeApPhotoHold()',
              'originalsCompletedThisRound=0; // no OEM album move',
              'if ((originalCount>0 || wasApPhotoDiagnostic)'):
              assert required in main, required
          assert main.count('starter.requestApOnlineHighQualityPhoto()')==1
          assert main.count('starter.requestPhotoTransfer()')==1
          assert 'apPhotoHoldReady=true;' in main
          assert 'if(apPhotoHoldRequested)' in main
          assert 'Thread.sleep(' not in main
          assert 'NEW_UNIQUE_ORIGINAL' in probe_policy
          assert 'oneGenuinelyNewFileOnSameApCanBeDownloaded' in probe_test
          assert 'onlyOem22HighQuality31IsWhitelisted' in probe_wire_test
          assert '0x22/0x30' not in starter
          assert '0x67/0x30' not in starter
          print('PASS: exact AP-online OEM HQ 0x22/0x31 gated by isImport=1 and verified AP; one shot, old photos baseline, HTTP new JPEG, ZERO exit')
          print('PASS OEM full/partial/zero baseline, vivo matcher unchanged; no automatic remote shutter')
          PY
          gradle -p experiments/m02s-wifi-only-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Check APK signing, package, permission and zip integrity
        shell: bash
        run: |
          set -euo pipefail
          APK=experiments/m02s-wifi-only-lab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/apksig.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apksig.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02saponlinehq31' versionCode='32' versionName='0.1.31'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          for p in BLUETOOTH_SCAN BLUETOOTH_CONNECT ACCESS_NETWORK_STATE ACCESS_WIFI_STATE CHANGE_NETWORK_STATE NEARBY_WIFI_DEVICES ACCESS_FINE_LOCATION INTERNET; do
            grep -q "android.permission.${p}" "$RUNNER_TEMP/permissions.txt"
          done
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo "Unexpected media or camera permission" >&2
            exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_AP_Online_HQShot_0.1.31_Android.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload standalone signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-AP-Online-HQ-Shot-v0131-APK
          path: release/BlueStar_M02S_AP_Online_HQShot_0.1.31_Android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct-link APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.txt" <<'EOF'
          Standalone v0.1.31 AP-online high-quality shutter capability diagnostic, based on the previously user-tested v0.1.29 Wi-Fi/HTTP and OEM ZERO recovery. The v0.1.28/v0.1.29 and v0.1.30 releases remain untouched. The user wants to preserve connected eyewear AP/Wi-Fi while capturing a NEW 3200x2400 original with the physical shutter, then transfer it quickly for OCR/TTS. Earlier AP-online ordinary 0x22/0x30 photo and RTSP live video were user-tested and failed/lagged; this experiment does NOT repeat them.
          A user-inspected private OEM APK static code audit found OEM takePhoto(TAKE_PHOTO_HIGH_QUALITY) is exactly 0x22/0x31. This capability has NOT been verified under isImport=1. It is not a promised firmware unlock.
          A: after an OFF-Wi-Fi physical shutter, connect once using the proven OEM BLE 0x39/0x30 and vivo SSID/BSSID Wi-Fi AP, verify trusted gateway and twice-stable OEM HTTP list. Hold AP open without bulk download. B: only when AP is still valid and BLE reports isImport=1, manually send exactly ONE OEM 0x22/0x31 via AA13, separate GATT ACK from camera evidence. Watch checksummed AA14 0x22/0x42 and read-only OEM HTTP listing for up to 11s, require exactly ONE new candidate and TWO stable complete lists, GET and validate actual 3200x2400 JPEG on the SAME still-working Android Network before claiming AP-online JPEG success. C: user ends diagnostic with OEM ZERO 0x44/0x30/0x01 and phone network release, avoiding FULL/media clear. No automatic repeated commands, video streaming, OTA, firmware modification, external uploads, album writes or private asset disclosure. This only validates a remote high-quality command; physical shutter usability during AP remains a separate later test. A valid APK build is not proof the device firmware accepted the shot.
          Wi-Fi association may still be refused intermittently; old v0.1.29 SSID-only one attempt and ZERO BLE-preserving recovery remain.
          EOF
          TAG=bluestar-m02s-ap-online-hq-shot-v0131-20261115
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/BlueStar_M02S_AP_Online_HQShot_0.1.31_Android.apk \
              release/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            echo "Existing pre-release assets verified and refreshed for latest source commit"
          else
            gh release create "$TAG" \
              release/BlueStar_M02S_AP_Online_HQShot_0.1.31_Android.apk \
              release/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Blue Star M02S AP-Online High-Quality Shot v0.1.31 — one-shot firmware capability probe" \
              --prerelease --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi
      - name: Verify public release and download asset URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view bluestar-m02s-ap-online-hq-shot-v0131-20261115 \
            --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
