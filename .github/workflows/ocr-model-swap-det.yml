name: Same real photos - compare 4 OCR detector models (no APK)
on:
  push:
    branches: [test/ocr-model-swap-ab-20261103]
    paths:
      - scripts/ocr_model_swap_det_ab.py
      - .github/workflows/ocr-model-swap-det.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detector-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ONNX CPU detector runtime
        run: |
          set -euo pipefail
          pip install --quiet 'numpy==1.26.4' 'onnxruntime==1.21.1' 'opencv-python-headless==4.10.0.84' 'Pillow==11.1.0' 'PyYAML==6.0.2' requests pyclipper
      - name: Download four public official ONNX detector weights
        run: |
          set -euo pipefail
          mkdir -p /tmp/det-swap
          for item in 'v6_small:PP-OCRv6_small_det_onnx' 'v6_medium:PP-OCRv6_medium_det_onnx' 'v6_tiny:PP-OCRv6_tiny_det_onnx' 'v5_mobile:PP-OCRv5_mobile_det_onnx'; do
            dir=${item%%:*}
            name=${item#*:}
            mkdir -p "/tmp/det-swap/$dir"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 25 --max-time 260 \
              "https://huggingface.co/PaddlePaddle/$name/resolve/main/inference.onnx" \
              -o "/tmp/det-swap/$dir/inference.onnx"
            sha256sum "/tmp/det-swap/$dir/inference.onnx"
          done
          echo 'd73e0058b7a8086bbd57f3d10b8bcd4ff95363f67e06e2762b5e814fe9c9410e  /tmp/det-swap/v6_small/inference.onnx' | sha256sum -c -
          echo 'eb13b44b25bb36f89528b68720af8a61d9cf381176107f465db1757b65d086e1  /tmp/det-swap/v6_medium/inference.onnx' | sha256sum -c -
      - name: Same 348 real scene photos, controlled PP-OCRv6 detection comparison
        run: |
          set -euo pipefail
          mkdir -p /tmp/det-swap-metrics
          python3 -u scripts/ocr_model_swap_det_ab.py \
            --models /tmp/det-swap \
            --out /tmp/det-swap-metrics \
            | tee /tmp/det-swap-metrics/cloud-det-ab.log
          grep -q 'DETECTOR_MODEL_SWAP_SAME_PHOTOS=PASS' /tmp/det-swap-metrics/cloud-det-ab.log
          cat /tmp/det-swap-metrics/model_scores.csv >> "$GITHUB_STEP_SUMMARY"
          echo 'Detection only; annotated GT IoU>=0.4 proxy, not complete camera OCR or false-positive audit.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload numerical metrics only, not any downloaded photo/model
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4-model-same-photo-detector-swap-results
          path: /tmp/det-swap-metrics/
          retention-days: 10
          if-no-files-found: warn
