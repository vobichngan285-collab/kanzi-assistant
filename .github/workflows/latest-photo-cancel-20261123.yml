name: Blue Star v1.0.78 Latest Photo Priority and Cloud Cancel
on:
  push:
    branches: [ 'exp/latest-photo-cancel-cloud-20261123' ]
    paths:
      - 'cloud-vision-app/app/**'
      - 'cloud-vision-app/docs/LATEST_PHOTO_CANCEL_20261123.md'
      - '.github/workflows/latest-photo-cancel-20261123.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validated-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: cloud-vision-app/third_party/AndroidUSBCamera
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify two-feature scope, cancellation ownership and hardware safety
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='4118b708e17e4fc436f1c03f4b5c515aa792008f'
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          prefix='cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/'
          permitted={
              '.github/workflows/latest-photo-cancel-20261123.yml',
              'cloud-vision-app/app/build.gradle',
              'cloud-vision-app/docs/LATEST_PHOTO_CANCEL_20261123.md',
              *{prefix+x for x in (
                  'MainActivity.java','CloudVisionClient.java',
                  'TargetVisionClient.java','LayoutParsingClient.java',
                  'C110FrameReader.java','C110CameraActivity.java',
                  'C110QuickShotController.java')}
          }
          assert changed==permitted, ('unexpected scope',sorted(changed^permitted))
          def read(file):return Path(prefix+file).read_text()
          main=read('MainActivity.java')
          cv=read('CloudVisionClient.java')
          target=read('TargetVisionClient.java')
          layout=read('LayoutParsingClient.java')
          reader=read('C110FrameReader.java')
          cpage=read('C110CameraActivity.java')
          quick=read('C110QuickShotController.java')
          still=read('PhoneStillJpeg.java')
          cam=read('InternalCameraController.java')
          comp=read('FrameCompressor.java')
          gradle=Path('cloud-vision-app/app/build.gradle').read_text()
          # Local photo/JPEG must never wait on the old HTTP read.
          assert 'private final ExecutorService encoder = Executors.newSingleThreadExecutor()' in main
          assert 'photoCloudExecutor = Executors.newFixedThreadPool(2)' in main
          assert 'photoCloudTask=photoCloudExecutor.submit' in main
          assert 'CloudVisionClient.Cancellation photoCancel=new CloudVisionClient.Cancellation()' in main
          assert 'activePhotoCloud.cancel()' in main
          assert 'photoCloudTask.cancel(true)' in main
          assert 'photoCloudExecutor.shutdownNow()' in main
          assert 'if(token!=requestVersion.get()||photoCancel.isCancelled())return;' in main
          assert 'pendingPhoneStillToken>=0' in main
          assert 'pendingPhoneFrameToken>=0' in main
          assert 'c110NativeShutterBusy' in main
          assert 'if(encodingTask!=null&&!c110NativeShutterBusy)' in main
          assert 'if(now-lastTapMs<350L)' in main
          assert 'CloudVisionClient.recognize(jpeg,service,task,' in main
          assert 'thisOcrMode,current.cloudNetwork,photoCancel' in main
          assert 'TargetVisionClient.inspect(' in main and 'service,current.cloudNetwork,photoCancel' in main
          assert 'requestVersion.incrementAndGet()' in main and 'if(tts!=null)tts.stop()' in main
          assert 'latestUsbFrame' in main and 'USB_MAX_FRAME_AGE_MS=800L' in main
          # Cancellation must be per request, not a global kill-all singleton.
          assert 'static final class Cancellation {' in cv
          assert 'synchronized void attach(HttpURLConnection connection)' in cv
          assert 'synchronized void cancel()' in cv
          assert 'active.disconnect()' in cv
          assert 'boolean isCancelled()' in cv and 'void check()' in cv
          assert 'if(cancel!=null)cancel.attach(connection)' in cv
          assert 'if(cancel!=null)cancel.detach(connection)' in cv
          assert 'if(cancel!=null)cancel.check()' in cv
          assert 'LayoutParsingClient.recognize(jpeg,cfg,cloudNetwork,cancel)' in cv
          assert 'if(cancel!=null)cancel.attach(c)' in target
          assert 'if(cancel!=null)cancel.attach(c)' in layout
          assert 'if(cancel!=null)cancel.detach(c)' in target and 'c.disconnect()' in target
          assert 'if(cancel!=null)cancel.detach(c)' in layout and 'c.disconnect()' in layout
          # C110 OEM shutter and SD-file transfer remain physically serial.
          assert 'private final ExecutorService photoCloudIo=Executors.newFixedThreadPool(2)' in reader
          assert 'void cancelRecognition()' in reader
          assert 'activePhotoCloud.cancel()' in reader
          assert 'taskFuture=photoCloudIo.submit' in reader
          assert 'if(shutterPending)' in quick
          assert 'if(reader.isBusy())reader.cancelRecognition()' in quick
          assert 'if(photoBusy)' in cpage
          assert 'stop(false)' in cpage
          assert 'frameReader.stop()' in cpage
          assert 'camera.shootAfterLivePreview(owner)' in quick
          assert 'photoCamera.shootAfterLivePreview(this)' in cpage
          # Previously verified Camera2 resolution, JPEG, prompt and TTS are untouched.
          assert 'MAX_UPLOAD_PIXELS=12000000L' in still
          assert 'target=(double)PhoneStillJpeg.MAX_UPLOAD_PIXELS' in cam
          assert 'CameraDevice.TEMPLATE_STILL_CAPTURE' in cam
          assert 'LONG_1080 = 1920' in comp
          assert 'CloudVisionClient.recognize(' in reader
          assert 'versionCode 87' in gradle
          assert "versionName '1.0.78-latest-photo-cancel'" in gradle
          assert "applicationIdSuffix '.c110plusquick159'" in gradle
          assert 'org.videolan.android:libvlc-all:3.6.5' in gradle
          assert "implementation project(':libausbc')" in gradle
          assert "implementation project(':libuvc')" in gradle
          print('PASS: exactly 10 files; latest photo priority, active HTTP disconnect,')
          print('      split local and cloud workers, physical C110 shutter safety,')
          print('      preserved camera/OCR/TTS/UVC/LibVLC and stable application ID')
          PY
      - name: Run vendor allow-list, task and C110 pure Java regressions
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-tests
          javac -d /tmp/bluestar-tests "$BASE/CloudProviderPolicy.java" cloud-vision-app/tests/CloudProviderPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudProviderPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/CloudProviderPolicy.java" "$BASE/CloudThinkingPolicy.java" cloud-vision-app/tests/CloudThinkingPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudThinkingPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/VisionModelCatalog.java" "$BASE/OcrModelCatalog.java" cloud-vision-app/tests/CloudServerListTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudServerListTest
          javac -d /tmp/bluestar-tests "$BASE/VoiceAction.java" cloud-vision-app/tests/VoiceActionSharedTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.VoiceActionSharedTest
          javac -d /tmp/bluestar-tests "$BASE/ProviderKeyReusePolicy.java" cloud-vision-app/tests/ProviderKeyReusePolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.ProviderKeyReusePolicyTest
          javac -d /tmp/bluestar-tests "$BASE/TaskOrder.java" cloud-vision-app/tests/TaskOrderTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.TaskOrderTest
          javac -d /tmp/bluestar-tests "$BASE/FollowupPrompt.java" cloud-vision-app/tests/FollowupPromptTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.FollowupPromptTest
          javac -d /tmp/bluestar-tests "$BASE/C110ZoomGeometry.java" cloud-vision-app/tests/C110ZoomGeometryTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.C110ZoomGeometryTest
          javac -d /tmp/bluestar-tests "$BASE/C110PhotoPolicy.java" cloud-vision-app/tests/C110PhotoPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.C110PhotoPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/OcrLineChunks.java" "$BASE/OcrSpeedExperiment.java" cloud-vision-app/tests/OcrSpeedExperimentTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.OcrSpeedExperimentTest
      - name: Apply already-proven pinned UVC patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_usbmonitor.py cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/java/com/jiangdg/usb/USBMonitor.java
          python3 cloud-vision-app/scripts/patch_pinned_uvc.py
          grep -q BSG_CLOUD_RAW5_GATED cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/jni/UVCCamera/UVCPreview.cpp
          grep -q BSG_CLOUD_CLOSE_BARRIER cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/camera/CameraUVC.kt
      - name: Generate unchanged Blue Star launcher assets
        run: |
          set -euo pipefail
          cd cloud-vision-app
          java scripts/GenerateLauncherIcons.java
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-$density/ic_launcher.png"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile full Android arm64 app
        shell: bash
        run: |
          set -euo pipefail
          cd cloud-vision-app
          gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug
      - name: Verify APK actual package, launcher, native libraries, sound and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp cloud-vision-app/app/build/outputs/apk/debug/app-debug.apk out/BlueStar_Guide_Latest_Photo_1.0.78.apk
          APK=out/BlueStar_Guide_Latest_Photo_1.0.78.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          unzip -Z1 "$APK" >out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libUVCCamera.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlc.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlcjni.so' out/entries.txt
          grep -Fxq 'res/raw/c_metal_clack_ding.mp3' out/entries.txt
          grep -Fxq 'res/raw/voice_send_whoosh.wav' out/entries.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" >out/badging.txt
          grep -Fq "package: name='com.vobich.bluestar.c110plusquick159'" out/badging.txt
          grep -Fq "versionName='1.0.78-latest-photo-cancel'" out/badging.txt
          grep -Fq "launchable-activity: name='com.vobich.bluestar.cloudprobe.HomeActivity'" out/badging.txt
          test "$(grep -c '^launchable-activity:' out/badging.txt)" -eq 1
          (cd out && sha256sum BlueStar_Guide_Latest_Photo_1.0.78.apk >SHA256SUMS.txt)
          cat out/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          BYTES=$(stat -c%s "$APK")
          echo "New v1.0.78 APK bytes: $BYTES" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline v1.0.77 APK bytes: 53534167" >> "$GITHUB_STEP_SUMMARY"
          echo "Compared to v1.0.77: $((BYTES-53534167)) bytes (negative means smaller)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: BlueStar_Guide_Latest_Photo_1.0.78
          path: out/*
          retention-days: 14
      - name: Publish ONLY if every test and package verification passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=bluestar-latest-photo-cancel-20261123-v0178
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release" >&2
            exit 1
          fi
          gh release create "$TAG" out/BlueStar_Guide_Latest_Photo_1.0.78.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Blue Star v1.0.78 Latest Photo First" \
            --notes "v1.0.78: Latest photo wins. After the prior JPEG arrives, the user can take the next phone/USB/C110 photo while old cloud OCR is in progress; old TTS and callbacks are invalidated and the previous HTTP connection is actively disconnected (remote model processing may still incur tokens). Local camera/JPEG work and bounded HTTP workers are separated. C110 physical shutter and JPEG transfer are kept serial; no overlapping 1001. Other models, 12MP photo path, sound engine, USB, UI, keys and camera firmware commands untouched. Fully CI tested; simultaneous-photo behavior and audible speech require device verification."
