name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Decode and validate signing keystore
        env:
          KANZI_KEYSTORE_BASE64: ${{ secrets.KANZI_KEYSTORE_BASE64 }}
          KANZI_KEYSTORE_PASSWORD: ${{ secrets.KANZI_KEYSTORE_PASSWORD }}
          KANZI_KEY_ALIAS: ${{ secrets.KANZI_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KANZI_KEYSTORE_BASE64"
          test -n "$KANZI_KEYSTORE_PASSWORD"
          test -n "$KANZI_KEY_ALIAS"
          printf '%s' "$KANZI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kanzi-signing.jks"
          keytool -list -keystore "$RUNNER_TEMP/kanzi-signing.jks" -storepass "$KANZI_KEYSTORE_PASSWORD" -alias "$KANZI_KEY_ALIAS" >/dev/null
          echo "KANZI_KEYSTORE_PATH=$RUNNER_TEMP/kanzi-signing.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          KANZI_KEYSTORE_PASSWORD: ${{ secrets.KANZI_KEYSTORE_PASSWORD }}
          KANZI_KEY_ALIAS: ${{ secrets.KANZI_KEY_ALIAS }}
          KANZI_KEY_PASSWORD: ${{ secrets.KANZIKEYPASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/certificate-check.txt"
          "$APKSIGNER" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature-check.txt"
          grep -q "Verified using v2 scheme: true" "$RUNNER_TEMP/signature-check.txt"
          grep -qi "Signer #1 certificate SHA-256 digest: bb39562d03f819bcad66902404ed7a5839d6ea781d21f0294fc174ad375e8422" "$RUNNER_TEMP/certificate-check.txt"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -v 4 "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/apk-manifest.txt"
          grep -q "package: name='com.vobichngan.kanzi' versionCode='11' versionName='0.4.0'" "$RUNNER_TEMP/apk-manifest.txt"
          grep -q "sdkVersion:'26'" "$RUNNER_TEMP/apk-manifest.txt"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SIZE=$(stat -c%s "$APK") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "Signing: V2 verified; certificate fingerprint matches the saved release key." >> "$GITHUB_STEP_SUMMARY"
          echo "Package/version/minSdk and zipalign checks passed." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanzi-assistant-0.4.0-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish public test download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: 看字助手测试版 0.4.0 (${{ github.run_number }})
          prerelease: true
          files: app/build/outputs/apk/release/app-release.apk
