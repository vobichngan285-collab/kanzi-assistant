name: Android APK (PP-OCRv6 + patched USB permission)
# Manual workflow_dispatch is enabled for clean rebuilds after stalled runs.
on:
  push:
    branches: [ main, feature/v0.7.0-accessibility-upgrades ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  # Keep each run independent so a newer commit cannot cancel an active APK build.
  group: android-apk-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout 看字助手
        uses: actions/checkout@v4
      - name: Checkout official PaddleOCR v3.7.0 Android SDK
        uses: actions/checkout@v4
        with:
          repository: PaddlePaddle/PaddleOCR
          ref: v3.7.0
          path: third_party/PaddleOCR
      - name: Prepare official PP-OCRv6 Android SDK and tiny models
        run: |
          set -euo pipefail
          SDK="third_party/PaddleOCR/deploy/ppocr-android/ppocr-sdk"
          test -s "$SDK/src/main/java/com/paddle/ocr/PaddleOCR.kt"
          rm -f "$SDK/build.gradle.kts"
          mkdir -p "$SDK/src/main/assets/models/det" "$SDK/src/main/assets/models/rec"
          curl -fL --retry 3 "https://paddle-model-ecology.bj.bcebos.com/paddlex/official_inference_model/paddle3.0.0/PP-OCRv6_tiny_det_onnx_infer.tar" -o "$RUNNER_TEMP/ppocr-det.tar"
          curl -fL --retry 3 "https://paddle-model-ecology.bj.bcebos.com/paddlex/official_inference_model/paddle3.0.0/PP-OCRv6_tiny_rec_onnx_infer.tar" -o "$RUNNER_TEMP/ppocr-rec.tar"
          mkdir -p "$RUNNER_TEMP/ppocr-det" "$RUNNER_TEMP/ppocr-rec"
          tar -xf "$RUNNER_TEMP/ppocr-det.tar" -C "$RUNNER_TEMP/ppocr-det"
          tar -xf "$RUNNER_TEMP/ppocr-rec.tar" -C "$RUNNER_TEMP/ppocr-rec"
          DET="$(find "$RUNNER_TEMP/ppocr-det" -type f -name inference.onnx | head -n 1)"
          REC="$(find "$RUNNER_TEMP/ppocr-rec" -type f -name inference.onnx | head -n 1)"
          CFG="$(find "$RUNNER_TEMP/ppocr-rec" -type f -name inference.yml | head -n 1)"
          test -n "$DET" && test -n "$REC" && test -n "$CFG"
          cp "$DET" "$SDK/src/main/assets/models/det/inference.onnx"
          cp "$REC" "$SDK/src/main/assets/models/rec/inference.onnx"
          cp "$CFG" "$SDK/src/main/assets/models/rec/inference.yml"
          cat > "$SDK/build.gradle" <<'GRADLE'
          plugins {
              id 'com.android.library'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.paddle.ocr'
              compileSdk 36
              defaultConfig { minSdk 26 }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.21.1'
              api 'com.quickbirdstudios:opencv:4.5.3.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
              implementation 'androidx.core:core-ktx:1.15.0'
          }
          GRADLE
          # Allow the bundled SDK to load a verified model pair from the app-private files directory.
          python3 - <<'PY'
          from pathlib import Path
          ort = Path("third_party/PaddleOCR/deploy/ppocr-android/ppocr-sdk/src/main/java/com/paddle/ocr/engine/ORTSessionManager.kt")
          src = ort.read_text()
          if "import java.io.File" not in src:
              src = src.replace("import java.nio.FloatBuffer", "import java.nio.FloatBuffer\nimport java.io.File")
          needle = "context.assets.open(assetPath).use { it.readBytes() }"
          if needle not in src:
              raise SystemExit("Could not safely patch ORTSessionManager model loader")
          src = src.replace(needle, """val modelFile = File(assetPath)
                      if (modelFile.isFile) modelFile.readBytes()
                      else context.assets.open(assetPath).use { it.readBytes() }""", 1)
          ort.write_text(src)

          cfg = Path("third_party/PaddleOCR/deploy/ppocr-android/ppocr-sdk/src/main/java/com/paddle/ocr/model/ModelConfig.kt")
          src = cfg.read_text()
          if "import java.io.File" not in src:
              src = src.replace("import com.paddle.ocr.util.YamlUtils", "import com.paddle.ocr.util.YamlUtils\nimport java.io.File")
          needle = "context.assets.open(assetPath).bufferedReader().use { it.readText() }"
          if needle not in src:
              raise SystemExit("Could not safely patch ModelConfig file loader")
          src = src.replace(needle, """val configFile = File(assetPath)
                      if (configFile.isFile) configFile.bufferedReader().use { it.readText() }
                      else context.assets.open(assetPath).bufferedReader().use { it.readText() }""", 1)
          cfg.write_text(src)
          print("PP-OCR SDK supports app-private ONNX/YAML model files.")
          PY
          echo "PP-OCRv6 tiny model assets prepared; app-private model file loading enabled." >> "$GITHUB_STEP_SUMMARY"
          du -h "$SDK/src/main/assets/models/"*/* >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout AUSBC source
        uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: third_party/AndroidUSBCamera
      - name: Patch Android USB permission PendingIntent
        run: |
          set -euo pipefail
          python3 scripts/patch_usbmonitor.py third_party/AndroidUSBCamera/libuvc/src/main/java/com/jiangdg/usb/USBMonitor.java
          # Avoid compiling unused x86 emulator binaries; retain both Android phone ABIs.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("third_party/AndroidUSBCamera/libnative/build.gradle")
          s = p.read_text()
          old = "abiFilters 'armeabi-v7a','arm64-v8a', \"x86\", \"x86_64\""
          new = "abiFilters 'armeabi-v7a','arm64-v8a'"
          if old not in s:
              raise SystemExit("Expected AUSBC ABI filter declaration not found; refusing unsafe patch.")
          p.write_text(s.replace(old, new, 1))
          print("AUSBC native ABIs limited to armeabi-v7a and arm64-v8a.")
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Decode and validate signing keystore
        env:
          KANZI_KEYSTORE_BASE64: ${{ secrets.KANZI_KEYSTORE_BASE64 }}
          KANZI_KEYSTORE_PASSWORD: ${{ secrets.KANZI_KEYSTORE_PASSWORD }}
          KANZI_KEY_ALIAS: ${{ secrets.KANZI_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KANZI_KEYSTORE_BASE64"
          test -n "$KANZI_KEYSTORE_PASSWORD"
          test -n "$KANZI_KEY_ALIAS"
          printf '%s' "$KANZI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kanzi-signing.jks"
          keytool -list -keystore "$RUNNER_TEMP/kanzi-signing.jks" -storepass "$KANZI_KEYSTORE_PASSWORD" -alias "$KANZI_KEY_ALIAS" >/dev/null
          echo "KANZI_KEYSTORE_PATH=$RUNNER_TEMP/kanzi-signing.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          KANZI_KEYSTORE_PASSWORD: ${{ secrets.KANZI_KEYSTORE_PASSWORD }}
          KANZI_KEY_ALIAS: ${{ secrets.KANZI_KEY_ALIAS }}
          KANZI_KEY_PASSWORD: ${{ secrets.KANZI_KEY_PASSWORD || secrets.KANZIKEYPASSWORD || secrets.KANZI_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --no-parallel --max-workers=2 --stacktrace assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          # Re-sign with the original 99-build keystore and explicitly enable BOTH V1 and V2.
          # This avoids relying on AGP defaults, which produced a V2-only APK in build 101.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign \
            --ks "$KANZI_KEYSTORE_PATH" \
            --ks-key-alias "$KANZI_KEY_ALIAS" \
            --ks-pass "env:KANZI_KEYSTORE_PASSWORD" \
            --key-pass "env:KANZI_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$RUNNER_TEMP/app-release-dual-signed.apk" \
            "$APK"
          mv "$RUNNER_TEMP/app-release-dual-signed.apk" "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/certificate-check.txt"
          "$APKSIGNER" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature-check.txt"
          grep -q "Verified using v1 scheme (JAR signing): true" "$RUNNER_TEMP/signature-check.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/signature-check.txt"
          grep -qi "V2 Signer: certificate SHA-256 digest: bb39562d03f819bcad66902404ed7a5839d6ea781d21f0294fc174ad375e8422" "$RUNNER_TEMP/certificate-check.txt"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -v 4 "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/apk-manifest.txt"
          grep -q "package: name='com.vobichngan.kanzi' versionCode='18' versionName='0.7.2'" "$RUNNER_TEMP/apk-manifest.txt"
          grep -q "sdkVersion:'26'" "$RUNNER_TEMP/apk-manifest.txt"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SIZE=$(stat -c%s "$APK") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "PP-OCRv6 tiny, original V1+V2 signatures, certificate, package/version/minSdk and zipalign checks passed." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanzi-assistant-0.7.0-ppocrv6-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish public test download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: 看字助手测试版 0.7.2 PP-OCRv6 双签修复 (${{ github.run_number }})
          prerelease: true
          files: app/build/outputs/apk/release/app-release.apk
