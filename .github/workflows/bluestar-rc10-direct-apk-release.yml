name: Publish Verified RC10 Low-Cost Visual Model APK
on:
  push:
    branches: [fix/bluestar-109-37flash-keep-plus-20261107]
    paths: ['.github/workflows/bluestar-rc10-direct-apk-release.yml']

permissions:
  actions: read
  contents: write

jobs:
  publish-verified-rc10:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Verify original RC10 source and full CI success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=42330421372
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.conclusion')"
          source="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha')"
          test "$state" = success
          test "$source" = 1362d7f7e48effd31c55034e3813828e73ec0a39
      - name: Download original successful RC10 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download 42330421372 \
            --repo "$GITHUB_REPOSITORY" \
            --name blue-star-guide-1-0-9-rc10-arm64 \
            --dir verified
          test -s verified/BlueStar_Guide_1.0.9_RC10_arm64.apk
          test -s verified/SHA256SUMS.txt
          test -s verified/badging.txt
      - name: Verify original APK bytes, content and signature identity
        run: |
          set -euo pipefail
          cd verified
          sha256sum -c SHA256SUMS.txt
          echo "cd2e063f504b57ebfe0aa4bcc18287e2c0aa4d2acb478a1232527f7f4f27c814  BlueStar_Guide_1.0.9_RC10_arm64.apk" | sha256sum -c -
          test "$(stat -c%s BlueStar_Guide_1.0.9_RC10_arm64.apk)" = 8567984
          unzip -tq BlueStar_Guide_1.0.9_RC10_arm64.apk >/dev/null
          unzip -Z1 BlueStar_Guide_1.0.9_RC10_arm64.apk | grep -Fx 'lib/arm64-v8a/libUVCCamera.so'
          unzip -Z1 BlueStar_Guide_1.0.9_RC10_arm64.apk | grep -Fx 'res/raw/c_metal_clack_ding.mp3'
          unzip -Z1 BlueStar_Guide_1.0.9_RC10_arm64.apk | grep -Fx 'res/raw/voice_send_whoosh.wav'
          grep -Fq "package: name='com.vobich.bluestar.rc10'" badging.txt
          grep -Fq "versionName='1.0.9-rc10'" badging.txt
          grep -Fq "application-label:'Blue Star Guide'" badging.txt
      - name: Publish verified original APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=blue-star-guide-cloud-rc10-20261107
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing replacement." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "verified/BlueStar_Guide_1.0.9_RC10_arm64.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target 1362d7f7e48effd31c55034e3813828e73ec0a39 \
            --title "Blue Star Guide 1.0.9 RC10 - Qwen3.7-Flash Budget Vision Comparison" \
            --notes "Direct ARM64 APK for hands-on comparison. RC10 adds native vision qwen3.7-flash as the new low-cost selectable model, alongside qwen3.8-flash (still default), qwen3-vl-plus (kept until real phone A/B is complete), and manual qwen3.8-max. The existing menu/OCR/target finding and voice-driven scene capture remain; default OCR qwen-vl-ocr, ASR qwen3-asr-flash and text-only followups using qwen3.8-flash remain untouched. No automatic model switching, no additional paid call on model selection: the 64x64 model probe is manual and counts actual provider tokens. The use ledger now displays qwen3.7-flash separately. Existing compact opaque dark-blue UI, USB native camera, globe icon and click/whoosh sounds retained. Source CI run 42330421372 completed success (source 1362d7f7e48effd31c55034e3813828e73ec0a39). Original CI-built APK has SHA256 cd2e063f504b57ebfe0aa4bcc18287e2c0aa4d2acb478a1232527f7f4f27c814, size 8567984 bytes, applicationId com.vobich.bluestar.rc10, versionCode 19; published without rebuild or re-signing. Separate RC10 install needs Beijing Bailian standard API Key re-entered. Previous reports about cancel finding and draggable task grid are deferred. Model access and recognition quality need real vivo X200 Pro validation." \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'BlueStar_Guide_1.0.9_RC10_arm64.apk'
          echo "Public direct APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BlueStar_Guide_1.0.9_RC10_arm64.apk" >> "$GITHUB_STEP_SUMMARY"
