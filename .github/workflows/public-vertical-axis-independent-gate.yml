name: Independent public vertical OCR axis safety gate HOLDOUT (NO Android APK)
on:
  push:
    branches: [test/phone-ocr-single-frame-diagnostic-20261103]
    paths: ['.github/workflows/public-vertical-axis-independent-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heldout-fixed-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated inference and image dependencies
        run: |
          python3 -m pip install --quiet 'numpy==1.26.4' 'opencv-python-headless==4.10.0.84' 'Pillow==11.1.0' 'PyYAML==6.0.2' 'requests==2.32.3' 'onnxruntime==1.21.1'
      - name: Download public benchmark and SHA-pinned unchanged Small model
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/weights" "$RUNNER_TEMP/data"
          curl -fL --retry 4 --max-time 450 'https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/main/inference.onnx' -o "$RUNNER_TEMP/weights/small_rec.onnx"
          curl -fL --retry 4 --max-time 90 'https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/main/inference.yml' -o "$RUNNER_TEMP/weights/small_rec.yml"
          echo "5435fd747c9e0efe15a96d0b378d5bd157e9492ed8fd80edf08f30d02fa24634  $RUNNER_TEMP/weights/small_rec.onnx" | sha256sum -c -
          echo "ab078671bb49f06228eadccd34f1bb501e157f7a047095ffb943ba81512c77d1  $RUNNER_TEMP/weights/small_rec.yml" | sha256sum -c -
          curl -fL --retry 4 --max-time 900 'https://huggingface.co/datasets/AlroWilde/vertical_annotations/resolve/main/vertical_annotations.zip' -o "$RUNNER_TEMP/data/vertical.zip"
      - name: Evaluate frozen policy on UNSEEN tilted pages 321..480 (no scene retest)
        run: |
          set -euo pipefail
          python3 -u scripts/public_axis_guard_heldout_benchmark.py \
            --rec "$RUNNER_TEMP/weights/small_rec.onnx" \
            --yml "$RUNNER_TEMP/weights/small_rec.yml" \
            --vertical-zip "$RUNNER_TEMP/data/vertical.zip" \
            --vertical-limit 791 \
            --vertical-tilt-start 321 \
            --vertical-tilt-limit 160 \
            --no-scenes \
            --max-rec-affected 240 \
            --out "$RUNNER_TEMP/axis-independent" \
            | tee "$RUNNER_TEMP/holdout.log"
          grep -q '^HOLDOUT_CROP_AXIS_AB_COMPLETE ' "$RUNNER_TEMP/holdout.log"
          python3 - <<'PY'
          import os,json
          r=json.load(open(os.environ["RUNNER_TEMP"]+"/axis-independent/summary.json"))
          t=r["totals"]
          print("INDEPENDENT_HOLDOUT_GATE",json.dumps(t,ensure_ascii=False),flush=True)
          assert t["vertical_tilted_cases"]==160
          assert t["with_annotation_transcripts"]>30
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Independent holdout: not used to choose the frozen gate\n")
              f.write("Simulated camera shear of public vertical pages 321–480, not natural phone images.\n\n")
              f.write("Rule: original <=3 recognized characters, candidate >=10, candidate confidence >=0.8.\n\n")
              f.write("| Metric | Value |\n|---|---:|\n")
              for k,v in t.items():f.write(f"| {k} | {v} |\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-independent-vertical-guard-holdout-results
          path: ${{ runner.temp }}/axis-independent/
          retention-days: 10
          if-no-files-found: warn
