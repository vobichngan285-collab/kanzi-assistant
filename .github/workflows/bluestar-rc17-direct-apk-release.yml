name: Publish verified RC17 separate text-recognition models APK
on:
  push:
    branches: [feat/bluestar-116-independent-ocr-model-choice-20261107]
    paths: ['.github/workflows/bluestar-rc17-direct-apk-release.yml']

permissions:
  actions: read
  contents: write

jobs:
  publish-verified-rc17:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Require exact successful RC17 Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=42362900151
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha')" = c6c00aa170b8a081d8260b500fb184f6df11755f
      - name: Download official original CI APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download 42362900151 \
            --repo "$GITHUB_REPOSITORY" \
            --name blue-star-guide-1-0-16-rc17-arm64 --dir verified
          test -s verified/BlueStar_Guide_1.0.16_RC17_arm64.apk
          test -s verified/SHA256SUMS.txt
          test -s verified/badging.txt
          test -s verified/apk-entries.txt
      - name: Verify unchanged APK bytes native UVC audio app ID and version
        run: |
          set -euo pipefail
          cd verified
          sha256sum -c SHA256SUMS.txt
          unzip -tq BlueStar_Guide_1.0.16_RC17_arm64.apk >/dev/null
          unzip -Z1 BlueStar_Guide_1.0.16_RC17_arm64.apk | grep -Fxq 'lib/arm64-v8a/libUVCCamera.so'
          unzip -Z1 BlueStar_Guide_1.0.16_RC17_arm64.apk | grep -Fxq 'res/raw/c_metal_clack_ding.mp3'
          unzip -Z1 BlueStar_Guide_1.0.16_RC17_arm64.apk | grep -Fxq 'res/raw/voice_send_whoosh.wav'
          grep -Fq "package: name='com.vobich.bluestar.rc17'" badging.txt
          grep -Fq "versionCode='26'" badging.txt
          grep -Fq "versionName='1.0.16-rc17'" badging.txt
          grep -Fq "application-label:'Blue Star Guide'" badging.txt
          grep -q 'application-icon-' badging.txt
          if grep -Ei 'inference\.onnx|paddle|ppocr|sherpa|layout.*onnx' apk-entries.txt; then
            echo "Unexpected on-device OCR model found" >&2
            exit 1
          fi
          echo "APK_SIZE_BYTES=$(stat -c%s BlueStar_Guide_1.0.16_RC17_arm64.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SHA256=$(sha256sum BlueStar_Guide_1.0.16_RC17_arm64.apk | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only verified CI APK without rebuilding or resigning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=blue-star-guide-cloud-rc17-20261107
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing RC17 Release; refuse overwrite." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "verified/BlueStar_Guide_1.0.16_RC17_arm64.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target c6c00aa170b8a081d8260b500fb184f6df11755f \
            --title "Blue Star Guide 1.0.16 RC17 - Independent OCR Models" \
            --notes "RC17 standalone Android ARM64 debug test APK adds an independent text recognition model selector under Settings > Cloud AI, preserving the existing three-choice visual analysis model selector. Text recognition supports qwen-vl-ocr as the default, plus qwen3.7-flash, qwen3.8-flash and qwen3.8-max only when explicitly selected. On tapping the existing Read Text task (or voice READ_TEXT), app automatically captures one image, sends the user-approved concise task instruction '识别图片中清晰可见的文字，按正确阅读顺序原样输出，不解释、不补充、不猜测。', and directly speaks the one response through the existing OCR/TTS route. No manually entered instruction, no automatic model fallback, no duplicate uploads or new polling. Default system OCR task instruction is exact; existing user-customized task instruction is respected if they choose to edit it. Visual menu/hospital/shop/product and target searching remain on separately selected visual model; text-only followups remain on original inexpensive Flash. Flash/Max OCR disables hidden thinking; OCR stays non-streamed and preserves original readable response gate. Empty and failed OCR usage is attributed to the actual selected model. Real cloud accuracy and costs must be tested by the user; application does not guarantee generic models produce perfect verbatim OCR. This release does not modify RC16 USB native 60..61fps preference and compatibility fallback, direct TextureView, camera permissions/USB auto launch, RC13 32-way JPEG image orientation, RC14 UVC picture controls, sounds, ASR/TTS, task grid or icons. Source build SHA c6c00aa170b8a081d8260b500fb184f6df11755f, successful GitHub Actions 42362900151 with RC17 four-choice tests, original USB and voice/task regressions and full ARM64 native/Android build. Release verifies and uploads the unchanged original CI APK without rebuild or resign. Separate package com.vobich.bluestar.rc17, versionCode26, versionName1.0.16-rc17; users must reconfigure API key and individual preferences. Vivo true UVC FPS retention and four model availability remain for device validation." \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'BlueStar_Guide_1.0.16_RC17_arm64.apk'
          echo "Direct browser URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BlueStar_Guide_1.0.16_RC17_arm64.apk" >> "$GITHUB_STEP_SUMMARY"
