name: Visual layout real-photo diagnostic - NO APK
on:
  push:
    branches: [test/visual-layout-vs-dual-rec-20261103]
    paths:
      - scripts/layout_realphoto_diagnostic.py
      - .github/workflows/visual-layout-realphotos.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-photo-layout:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only diagnostic dependencies
        run: python3 -m pip install --quiet 'numpy==1.26.4' 'onnxruntime==1.21.1' 'opencv-python-headless==4.10.0.84' 'Pillow==11.1.0' requests
      - name: Download pinned layout ONNX (no APK)
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://huggingface.co/stefanj0/PP-DocLayout-S-ONNX/resolve/main/pp_doclayout_s.onnx' -o /tmp/pp_doclayout_s.onnx
          echo '33688dbee1c23e34b81777e97cb428eb40f24b242c02b5f623484959e830aec8  /tmp/pp_doclayout_s.onnx' | sha256sum -c -
          python3 scripts/verify_layout_model.py /tmp/pp_doclayout_s.onnx
      - name: Run layout model on independent real photos
        run: |
          set -euo pipefail
          mkdir -p /tmp/layout-diagnostic
          python3 -u scripts/layout_realphoto_diagnostic.py --model /tmp/pp_doclayout_s.onnx --out /tmp/layout-diagnostic | tee /tmp/layout-diagnostic/run.log
          grep -q 'LAYOUT_FIRST_STAGE_COMPLETED' /tmp/layout-diagnostic/run.log
          cat /tmp/layout-diagnostic/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo 'Preliminary layout region center coverage only; not OCR accuracy or Small DET improvement.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save numeric results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-layout-realphotos-diagnostic
          path: /tmp/layout-diagnostic/
          retention-days: 10
          if-no-files-found: warn
