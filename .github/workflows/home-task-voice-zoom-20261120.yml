name: Blue Star v1.0.63 Home Tasks Voice and C110 Zoom
on:
  push:
    branches: [ 'exp/home-task-voice-zoom-20261120' ]
    paths:
      - 'cloud-vision-app/app/**'
      - 'cloud-vision-app/tests/**'
      - 'cloud-vision-app/docs/HOME_TASK_VOICE_ZOOM_20261120.md'
      - '.github/workflows/home-task-voice-zoom-20261120.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verified-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: cloud-vision-app/third_party/AndroidUSBCamera
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test task ordering zoom photo policy and voice prompt behavior
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-test
          javac -d /tmp/bluestar-test "$BASE/TaskOrder.java" cloud-vision-app/tests/TaskOrderTest.java
          java -cp /tmp/bluestar-test com.vobich.bluestar.cloudprobe.TaskOrderTest
          javac -d /tmp/bluestar-test "$BASE/FollowupPrompt.java" cloud-vision-app/tests/FollowupPromptTest.java
          java -cp /tmp/bluestar-test com.vobich.bluestar.cloudprobe.FollowupPromptTest
          javac -d /tmp/bluestar-test "$BASE/C110ZoomGeometry.java" cloud-vision-app/tests/C110ZoomGeometryTest.java
          java -cp /tmp/bluestar-test com.vobich.bluestar.cloudprobe.C110ZoomGeometryTest
          javac -d /tmp/bluestar-test "$BASE/C110PhotoPolicy.java" cloud-vision-app/tests/C110PhotoPolicyTest.java
          java -cp /tmp/bluestar-test com.vobich.bluestar.cloudprobe.C110PhotoPolicyTest
          python3 - <<'PY'
          from pathlib import Path
          root=Path("cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe")
          read=lambda n:(root/n).read_text()
          h=read("HomeActivity.java")
          desktop=read("TaskDesktopOverlay.java")
          catalog=read("TaskCatalog.java")
          reader=read("C110FrameReader.java")
          capture=read("MainActivity.java")
          c110=read("C110CameraActivity.java")
          voice=read("HomeVoiceAssistant.java")
          memory=read("RecentPhotoSession.java")
          asr=read("CloudAsrClient.java")
          quick=read("C110QuickShotController.java")
          fw=read("C110WifiCamera.java")
          ctrl=read("C110DeviceControls.java")
          build=Path("cloud-vision-app/app/build.gradle").read_text()
          manifest=Path("cloud-vision-app/app/src/main/AndroidManifest.xml").read_text()
          bridge=Path("cloud-vision-app/boyuebridge/src/main/java/com/vobich/bluestar/boyuebridge/LaunchActivity.java").read_text()
          assert 'option(content,"✦","AI 视觉分析"' not in h
          for name in ("快捷拍照","C110+ 实时预览","朗读任务","阅读模式","设置"):
              assert name in h,name
          assert h.index('option(content,"▦","阅读模式"')<h.index('option(content,"⚙","设置"')
          assert 'Button talk=nav("🎙\\n按住AI"' in h
          assert 'homeVoice.handleTouch(v,event)' in h
          assert 'TaskDesktopOverlay.show(this' in h
          assert 'private static final int COLUMNS=4,PAGE_SIZE=12' in desktop
          assert 'listener.edit(task)' in desktop
          assert 'TaskCatalog.saveDisplayOrder' in desktop
          assert 'TaskCatalog.hidePreset' in desktop and 'TaskCatalog.remove' in desktop
          assert 'TaskCatalog.updatePreset(this' in h and 'TaskCatalog.upsert(this' in h
          assert 'void edit(TaskCatalog.Task task)' in desktop
          assert 'VoiceRecorder recorder=new VoiceRecorder()' in voice
          assert 'CloudAsrClient.recognize(wav,key,network)' in voice
          assert 'RecentPhotoSession.latest()' in voice
          assert 'CloudVisionClient.recognize(' in voice and 'shot.jpeg,key,followup' in voice
          assert 'CloudVisionClient.recognizeText(' in voice
          assert 'app_tts_engine_package' in voice
          assert 'RecentPhotoSession.captured(jpeg,current.cloudNetwork,task.name)' in capture
          assert 'RecentPhotoSession.captured(jpeg,cellular,task.name)' in reader
          assert 'RecentPhotoSession.analyzed(jpeg,result.text)' in capture
          assert 'RecentPhotoSession.analyzed(jpeg,lastText)' in reader
          assert 'if(photo==jpeg)' in memory
          assert 'cloudNetwork.openConnection(new URL(ENDPOINT))' in asr
          assert 'C110WifiCamera.requireCellular(activity)' in voice
          assert 'zoomSeek=new SeekBar(this)' in c110
          assert 'setZoom(1f+progress/10f)' in c110
          assert 'C110ZoomFrames.cropNativeJpeg' in reader
          assert 'frameReader.recognizeOriginalJpeg(' in c110
          assert 'photoCamera.shootAfterLivePreview(this)' in c110
          assert 'photoButton=footerButton("◎  高清拍照"' in c110
          assert 'bottomControls.setVisibility(View.VISIBLE)' in c110
          assert 'deviceControls.showSettings();' in c110
          assert 'reader.releaseSpeechForOtherScreen()' in quick
          assert 'tts.setLanguage(Locale.SIMPLIFIED_CHINESE)' in reader
          assert 'new TextToSpeech(activity,ready,engine)' in reader
          assert 'new C110QuickShotController(this,this::quickStatusChanged)' in h
          assert 'camera.shootAfterLivePreview(owner)' in quick
          assert 'cmd=1001' in fw
          assert 'cmd==9011||cmd==9038' in ctrl
          assert 'cmd=4003' not in ctrl and 'cmd=1002' not in ctrl
          assert '--network-caching=150' in c110 and '--live-caching=150' in c110
          assert 'C110ResolutionLabActivity' not in manifest
          assert manifest.count("android.intent.category.LAUNCHER")==1
          assert 'com.vobich.bluestar.cloudprobe.action.QUICK_SHOT' in bridge
          assert "applicationIdSuffix '.c110plusquick159'" in build
          assert "versionCode 72" in build
          assert "versionName '1.0.63-home-task-voice-zoom'" in build
          assert 'android.permission.RECORD_AUDIO' in manifest
          print("PASS: all new flows and old C110 Wi-Fi, OEM, LibVLC, voice & companion invariants")
          PY
      - name: Apply original pinned UVC patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_usbmonitor.py cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/java/com/jiangdg/usb/USBMonitor.java
          python3 cloud-vision-app/scripts/patch_pinned_uvc.py
          grep -q BSG_CLOUD_RAW5_GATED cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/jni/UVCCamera/UVCPreview.cpp
          grep -q BSG_CLOUD_CLOSE_BARRIER cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/camera/CameraUVC.kt
      - name: Generate real Blue Star launcher assets
        run: |
          cd cloud-vision-app
          java scripts/GenerateLauncherIcons.java
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-$density/ic_launcher.png"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile complete Android arm64 application
        shell: bash
        run: |
          set -euo pipefail
          cd cloud-vision-app
          gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug
      - name: Verify APK resources signature target version and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp cloud-vision-app/app/build/outputs/apk/debug/app-debug.apk out/BlueStar_Guide_C110_Tasks_AI_Zoom_1.0.63.apk
          APK=out/BlueStar_Guide_C110_Tasks_AI_Zoom_1.0.63.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          unzip -Z1 "$APK" >out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libUVCCamera.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlc.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlcjni.so' out/entries.txt
          grep -Fxq 'res/raw/c_metal_clack_ding.mp3' out/entries.txt
          grep -Fxq 'res/raw/voice_send_whoosh.wav' out/entries.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" >out/badging.txt
          grep -Fq "package: name='com.vobich.bluestar.c110plusquick159'" out/badging.txt
          grep -Fq "versionName='1.0.63-home-task-voice-zoom'" out/badging.txt
          grep -Fq "launchable-activity: name='com.vobich.bluestar.cloudprobe.HomeActivity'" out/badging.txt
          test "$(grep -c '^launchable-activity:' out/badging.txt)" -eq 1
          (cd out && sha256sum BlueStar_Guide_C110_Tasks_AI_Zoom_1.0.63.apk >SHA256SUMS.txt)
          cat out/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: BlueStar_Guide_C110_Tasks_AI_Zoom_1.0.63
          path: out/*
          retention-days: 14
      - name: Publish only after every check and full APK build succeeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=bluestar-home-task-voice-zoom-20261120-v0163
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing Release cannot be overwritten" >&2
            exit 1
          fi
          gh release create "$TAG" out/BlueStar_Guide_C110_Tasks_AI_Zoom_1.0.63.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Blue Star v1.0.63 Task Grid, Photo AI and Clean C110 Zoom" \
            --notes "v1.0.63 isolated update based on v1.0.62. Original vertical Home remains. Removed redundant AI visual entry; moved Settings into the vertical Home list. Home bottom right is press-and-hold voice chat with the existing microphone recorder, same encrypted API Key and selected vision model, against the latest actual phone, USB or C110 photo in process memory; C110 ASR/vision use cellular when local camera Wi-Fi is present. Task selector reuses existing drag reorder and hide/delete with compact four-column tiles and task editing. C110 preview shows minimal controls, a single live zoom slider and one native photo shutter, sending only its corresponding full-quality JPEG crop to the cloud. Existing Boyue bridge package, C110 1001/OEM, LibVLC 150ms, grtts voice, phone/USB sources and light/sound controls preserved. Automated tests and Android compile passed; device verification of voice and preview on vivo remains required."
