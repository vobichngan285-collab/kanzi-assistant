name: Gemma 560 stock CPU recovery APK
on:
  push:
    branches: [exp/gemma4-560-hybrid-20261126]
    paths: ['.github/workflows/gemma-560-hybrid.yml', 'gemma-vision-lab/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Recover verified assets from v0.1.5
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/${{ github.repository }}/releases/download/bluestar-gemma-v015-560-hybrid-20261126/BlueStar_Gemma_560_Hybrid_0.1.5.apk -o previous.apk
          echo "1f3f74948dcefabb68e40e2f2d90bfeedb70e2e3784c1484e94227a0347df9d4  previous.apk" | sha256sum -c -
          unzip -q previous.apk assets/adapter.tflite assets/encoder.tflite assets/header.bin assets/metadata.bin assets/model.properties -d gemma-vision-lab/app/src/main
      - name: Verify immutable corrected model assets
        run: |
          cd gemma-vision-lab/app/src/main/assets
          echo "6b8caf8e6d95837eb8f0d82ae9aefbe88313e0bb8b23be253822adcfda85dd92  encoder.tflite" | sha256sum -c -
          grep -Fx "sha256=fb4159987f3cd30aba817ded3b83a04c81a4a09991d88fafee31d1325490c2f8" model.properties
      - name: Test and build independent APK
        working-directory: gemma-vision-lab
        run: gradle --no-daemon --max-workers=2 :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify signature, identity, offline permission and native runtime
        run: |
          set -euo pipefail
          APK=gemma-vision-lab/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | tee badging.txt
          grep -F "package: name='com.vobich.bluestar.gemmalab.vision560.recovery' versionCode='7' versionName='0.1.6'" badging.txt
          grep -F "launchable-activity: name='com.vobich.bluestar.gemmalab.MainActivity'" badging.txt
          ! grep -F "android.permission.INTERNET" badging.txt
          unzip -Z1 "$APK" > archive.txt
          grep -E '^lib/arm64-v8a/.*litert.*\.so$' archive.txt
          ! grep -E '^lib/(x86|x86_64|armeabi-v7a)/' archive.txt
          python - <<'PY'
          import zipfile,hashlib,pathlib
          apk=pathlib.Path("gemma-vision-lab/app/build/outputs/apk/release/app-release.apk")
          assert apk.stat().st_size<1_900_000_000
          with zipfile.ZipFile(apk) as z:
              with z.open("lib/arm64-v8a/liblitertlm_jni.so") as jni:
                  assert hashlib.file_digest(jni,"sha256").hexdigest()=="cf4c55139c6fc86425ecfe75f8a907e6193ca665ecc19fbabcaba7ab361bdc43"
          with zipfile.ZipFile(apk) as z:
              for p in pathlib.Path("gemma-vision-lab/app/src/main/assets").iterdir():
                  with z.open("assets/"+p.name) as f, p.open("rb") as src:
                      assert hashlib.file_digest(f,"sha256").digest()==hashlib.file_digest(src,"sha256").digest(),p
          PY
          mkdir -p release
          cp "$APK" release/BlueStar_Gemma_560_Recovery_0.1.6.apk
          cp gemma-vision-lab/README.md release/
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: bluestar-gemma-v016
          path: release/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bluestar-gemma-v016
          path: release
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS.txt)
          TAG=bluestar-gemma-v016-560-recovery-20261126
          retry() { for i in 1 2 3 4; do "$@" && return 0; sleep $((i*3)); done; return 1; }
          if ! gh release view "$TAG" --json targetCommitish >/dev/null 2>&1; then
            retry gh release create "$TAG" --target "$GITHUB_SHA" --title "蓝星 Gemma 560 CPU 恢复验证 v0.1.6" --notes-file release/README.md --prerelease --draft
          fi
          gh release view "$TAG" --json targetCommitish | jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha'
          retry gh release upload "$TAG" release/* --clobber
          retry gh release edit "$TAG" --draft=false --prerelease
