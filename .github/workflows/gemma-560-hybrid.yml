name: Gemma 560 hybrid vision native build and APK
on:
  push:
    branches: [exp/gemma4-560-hybrid-20261126]
    paths: ['.github/workflows/gemma-560-hybrid.yml', 'gemma-vision-lab/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve exact official Android AAR before expensive native compile
        run: |
          set -euo pipefail
          REL=com/google/ai/edge/litertlm/litertlm-android/0.18.1/litertlm-android-0.18.1
          for BASE in https://dl.google.com/dl/android/maven2 https://maven.google.com https://repo.maven.apache.org/maven2 https://maven-central.storage-download.googleapis.com/maven2; do
            if curl -fL --retry 2 "$BASE/$REL.aar" -o stock.aar && curl -fL --retry 2 "$BASE/$REL.pom" -o stock.pom; then
              echo "Resolved official AAR from $BASE"
              break
            fi
            rm -f stock.aar stock.pom
          done
          test -s stock.aar && test -s stock.pom
          python - <<'PY'
          import zipfile,xml.etree.ElementTree as ET
          with zipfile.ZipFile("stock.aar") as z:
              assert z.namelist().count("jni/arm64-v8a/liblitertlm_jni.so")==1
              assert z.read("jni/arm64-v8a/liblitertlm_jni.so")[:4]==b"\x7fELF"
          p=ET.parse("stock.pom").getroot()
          assert p.find("{*}groupId").text=="com.google.ai.edge.litertlm"
          assert p.find("{*}artifactId").text=="litertlm-android"
          assert p.find("{*}version").text=="0.18.1"
          PY
          sha256sum stock.aar stock.pom
      - uses: actions/download-artifact@v4
        with:
          name: hybrid-compiled-jni
          run-id: 45725894735
          github-token: ${{ github.token }}
          path: native-output
      - name: Verify compiled JNI and obtain pinned official constraint provider
        run: |
          set -euo pipefail
          echo "f0dcf741d49a9a87a0b893513153c0e522d95b1fc679eb0fd54500c2061dafa5  native-output/liblitertlm_jni.so" | sha256sum -c -
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --branch v0.18.1 https://github.com/google-ai-edge/LiteRT-LM.git upstream
          test "$(git -C upstream rev-parse HEAD)" = bda624851d74be34d4e1f7fac1fc4155939539c7
          git -C upstream lfs pull --include="prebuilt/android_arm64/libGemmaModelConstraintProvider.so"
          cp upstream/prebuilt/android_arm64/libGemmaModelConstraintProvider.so native-output/
          echo "c7c7188b831ae75fcc7ec6fe613118365b311995805423a4ca265372f07f4783  native-output/libGemmaModelConstraintProvider.so" | sha256sum -c -
      - name: Verify JNI compatibility and package required pinned provider
        run: |
          set -euo pipefail
          python gemma-vision-lab/tests/repack_hybrid_aar.py stock.aar native-output/liblitertlm_jni.so stock.pom hybrid-maven/com/google/ai/edge/litertlm/litertlm-android/0.18.1 native-output/libGemmaModelConstraintProvider.so | tee jni-verify.log
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-maven
          path: hybrid-maven/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-native-diagnostics
          path: |
            jni-verify.log
          if-no-files-found: ignore
  build:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: gemma560-patch
          run-id: 45719718456
          github-token: ${{ github.token }}
          path: gemma-vision-lab/app/src/main/assets
      - uses: actions/download-artifact@v4
        with:
          name: hybrid-maven
          path: gemma-vision-lab/hybrid-maven
      - name: Verify immutable corrected model assets
        run: |
          cd gemma-vision-lab/app/src/main/assets
          echo "6b8caf8e6d95837eb8f0d82ae9aefbe88313e0bb8b23be253822adcfda85dd92  encoder.tflite" | sha256sum -c -
          grep -Fx "sha256=fb4159987f3cd30aba817ded3b83a04c81a4a09991d88fafee31d1325490c2f8" model.properties
      - name: Test and build independent APK
        working-directory: gemma-vision-lab
        run: gradle --no-daemon --max-workers=2 :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify signature, identity, offline permission and native runtime
        run: |
          set -euo pipefail
          APK=gemma-vision-lab/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | tee badging.txt
          grep -F "package: name='com.vobich.bluestar.gemmalab.vision560.hybrid' versionCode='5' versionName='0.1.4'" badging.txt
          grep -F "launchable-activity: name='com.vobich.bluestar.gemmalab.MainActivity'" badging.txt
          ! grep -F "android.permission.INTERNET" badging.txt
          unzip -Z1 "$APK" > archive.txt
          grep -E '^lib/arm64-v8a/.*litert.*\.so$' archive.txt
          ! grep -E '^lib/(x86|x86_64|armeabi-v7a)/' archive.txt
          python - <<'PY'
          import zipfile,hashlib,pathlib
          apk=pathlib.Path("gemma-vision-lab/app/build/outputs/apk/release/app-release.apk")
          assert apk.stat().st_size<1_900_000_000
          expected=next(pathlib.Path("gemma-vision-lab/hybrid-maven").rglob("hybrid-jni.sha256")).read_text().strip()
          with zipfile.ZipFile(apk) as z:
              data=z.read("lib/arm64-v8a/liblitertlm_jni.so")
              assert hashlib.sha256(data).hexdigest()==expected and b"BLUESTAR_VISION_HYBRID_014" in data
              assert hashlib.sha256(z.read("lib/arm64-v8a/libGemmaModelConstraintProvider.so")).hexdigest()=="c7c7188b831ae75fcc7ec6fe613118365b311995805423a4ca265372f07f4783"
          with zipfile.ZipFile(apk) as z:
              for p in pathlib.Path("gemma-vision-lab/app/src/main/assets").iterdir():
                  with z.open("assets/"+p.name) as f, p.open("rb") as src:
                      assert hashlib.file_digest(f,"sha256").digest()==hashlib.file_digest(src,"sha256").digest(),p
          PY
          mkdir -p release
          cp "$APK" release/BlueStar_Gemma_560_Hybrid_0.1.4.apk
          cp gemma-vision-lab/README.md release/
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: bluestar-gemma-v014
          path: release/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bluestar-gemma-v014
          path: release
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS.txt)
          TAG=bluestar-gemma-v014-560-hybrid-20261126
          retry() { for i in 1 2 3 4; do "$@" && return 0; sleep $((i*3)); done; return 1; }
          if ! gh release view "$TAG" --json targetCommitish >/dev/null 2>&1; then
            retry gh release create "$TAG" --target "$GITHUB_SHA" --title "蓝星 Gemma 560 混合视觉实验 v0.1.4" --notes-file release/README.md --prerelease --draft
          fi
          gh release view "$TAG" --json targetCommitish | jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha'
          retry gh release upload "$TAG" release/* --clobber
          retry gh release edit "$TAG" --draft=false --prerelease
