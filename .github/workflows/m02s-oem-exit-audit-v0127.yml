name: Blue Star M02S OEM Exit State Audit v0.1.27 (no APK release)
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-oem-exit-audit-v0127-20261115']
    paths:
      - 'experiments/m02s-wifi-only-lab/**'
      - '.github/workflows/m02s-oem-exit-audit-v0127.yml'
permissions:
  contents: read

jobs:
  audit-test-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Audit source safety boundaries and validate state machine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('experiments/m02s-wifi-only-lab/app/src')
          java=root/'main/java/com/vobichngan/bluestar/m02slab'
          test=root/'test/java/com/vobichngan/bluestar/m02slab'
          wire=(java/'M02sApWire.java').read_text()
          starter=(java/'M02sApStarter.java').read_text()
          main=(java/'MainActivity.java').read_text()
          evidence=(java/'M02sSessionEvidence.java').read_text()
          evidence_test=(test/'M02sSessionEvidenceTest.java').read_text()
          assert 'byte[] AP_REQUEST' in wire
          assert 'Arrays.equals(AP_REQUEST, bytes)' in wire
          assert '0x02, 0x64, 0x64' in wire
          for forbidden in ('partialOneFinishRequest', 'authorizedPartialOneFinish',
                            'requestPartialOneFinish', 'PartialFinishCallback',
                            'WIFI_FILE_DOWNLOAD', 'FINISH_NOT_CLEAR'):
              assert forbidden not in wire+starter+main, forbidden
          assert '0x44, 0x30, 0x00' not in wire+starter
          assert 'void deviceImportStateObserved(int flag)' in starter
          assert 'callback.deviceImportStateObserved(importFlag)' in starter
          assert 'sessionEvidence.onPhoneNetworkReleased(success);' in main
          assert 'sessionEvidence.onRawOemList(list.entriesObserved, list.eligibleImages)' in main
          assert 'M02sSessionEvidence.theoreticalOemBranch' in evidence_test
          assert 'allOem44FinishCommandsAreRejectedByAuditProtocol' in (
              test/'M02sApWireTest.java').read_text()
          assert 'M02sSessionEvidence.OemFinishBranch' in evidence_test
          assert '镜端退出未确认' in evidence
          assert 'starter.requestPhotoTransfer()' in main
          assert main.count('starter.requestPhotoTransfer()') == 1
          event=main.split('@Override public void photoActionEnded()',1)[1].split(
              '@Override public void deviceImportStateObserved',1)[0]
          assert 'startPhotoTransfer(' not in event
          assert 'requestPhotoTransfer(' not in event
          assert 'new M02sSessionEvidence()' in main
          assert 'setSsidPattern(new PatternMatcher(' in starter
          assert 'builder.setBssid(MacAddress.fromString(freshBssid))' in starter
          assert 'scanRequestedAtUs = bleCommandAtMs * 1000L' in starter
          print('PASS: no BLE 0x44 sender in audit, OEM count vs photo count separate, no auto AP')
          PY
          gradle -p experiments/m02s-wifi-only-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Validate test package and APK without publishing it
        shell: bash
        run: |
          set -euo pipefail
          APK=experiments/m02s-wifi-only-lab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02sexitaudit27' versionCode='28' versionName='0.1.27-audit'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or photo storage permission' >&2
            exit 1
          fi
          unzip -t "$APK" | tail -n 2
          echo "Audit source commit $GITHUB_SHA; NO APK release is created." >> "$GITHUB_STEP_SUMMARY"
      - name: Save unit test results only
        uses: actions/upload-artifact@v4
        with:
          name: M02S-Exit-Audit-v0127-Unit-Tests
          path: experiments/m02s-wifi-only-lab/app/build/test-results/testDebugUnitTest
          if-no-files-found: error
          retention-days: 15
