name: Publish Verified RC11 Stop Finding and Task Drag APK
on:
  push:
    branches: [fix/bluestar-110-stop-finding-drag-grid-20261107]
    paths: ['.github/workflows/bluestar-rc11-direct-apk-release.yml']

permissions:
  actions: read
  contents: write

jobs:
  publish-verified-rc11:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Verify original RC11 source and full CI success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=42332177046
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.conclusion')"
          source="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha')"
          test "$state" = success
          test "$source" = cfe016f87b9477f438216c83ac2ab0f9eb9d3b48
      - name: Download original successful RC11 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download 42332177046 \
            --repo "$GITHUB_REPOSITORY" \
            --name blue-star-guide-1-0-10-rc11-arm64 \
            --dir verified
          test -s verified/BlueStar_Guide_1.0.10_RC11_arm64.apk
          test -s verified/SHA256SUMS.txt
          test -s verified/badging.txt
      - name: Verify original APK bytes, content and signature identity
        run: |
          set -euo pipefail
          cd verified
          sha256sum -c SHA256SUMS.txt
          echo "3801e557b140201f9ed7608777a3c7347e438be4b09a51b0773ce0e42f89a137  BlueStar_Guide_1.0.10_RC11_arm64.apk" | sha256sum -c -
          test "$(stat -c%s BlueStar_Guide_1.0.10_RC11_arm64.apk)" = 8567980
          unzip -tq BlueStar_Guide_1.0.10_RC11_arm64.apk >/dev/null
          unzip -Z1 BlueStar_Guide_1.0.10_RC11_arm64.apk | grep -Fx 'lib/arm64-v8a/libUVCCamera.so'
          unzip -Z1 BlueStar_Guide_1.0.10_RC11_arm64.apk | grep -Fx 'res/raw/c_metal_clack_ding.mp3'
          unzip -Z1 BlueStar_Guide_1.0.10_RC11_arm64.apk | grep -Fx 'res/raw/voice_send_whoosh.wav'
          grep -Fq "package: name='com.vobich.bluestar.rc11'" badging.txt
          grep -Fq "versionName='1.0.10-rc11'" badging.txt
          grep -Fq "application-label:'Blue Star Guide'" badging.txt
      - name: Publish verified original APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=blue-star-guide-cloud-rc11-20261107
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing replacement." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "verified/BlueStar_Guide_1.0.10_RC11_arm64.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target cfe016f87b9477f438216c83ac2ab0f9eb9d3b48 \
            --title "Blue Star Guide 1.0.10 RC11 - Fix Voice Cancel and Drag Task Grid" \
            --notes "Direct ARM64 APK for real phone verification. RC11 fixes the original bug where cancel looking for the door only got a spoken yes but left the active search chip unchanged: natural local stop commands and conservative ASR homophone handling when searching for 门 now call setFindingTarget immediately, update persistent state and badge, then speak confirmation without a vision call. RC11 also implements actual 480ms hold-to-drag Android DragEvent drop for all six task tiles including the create-task entry, saves stable task-ID order and restores it on reopening, keeps click-to-select and swipe paging, supports adjacent-page transfers via pager arrows. Tested multi-target replacement, negated stop commands, status questions, stale custom IDs, cross-page ordering and JVM regressions. Four visual choices remain: qwen3.7-flash (cheap), qwen3.8-flash (default), qwen3-vl-plus (retained until user A/B tests), qwen3.8-max (manual). Existing USB/Camera2, cloud ASR/OCR, text-only followups, TTS, sounds, icons and opaque compact settings preserved. Final Android CI run 42332177046 completed success from exact source cfe016f87b9477f438216c83ac2ab0f9eb9d3b48. APK SHA256 3801e557b140201f9ed7608777a3c7347e438be4b09a51b0773ce0e42f89a137, size 8567980 bytes, com.vobich.bluestar.rc11 versionCode20. This is the original CI-built APK, not rebuilt or resigned. Independent RC11 installation does not inherit RC10 API Key or local custom task database; configure the Beijing Bailian Key and any tasks again. Actual vivo X200 Pro touch-drag and speech tests still required." \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'BlueStar_Guide_1.0.10_RC11_arm64.apk'
          echo "Public direct APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BlueStar_Guide_1.0.10_RC11_arm64.apk" >> "$GITHUB_STEP_SUMMARY"
