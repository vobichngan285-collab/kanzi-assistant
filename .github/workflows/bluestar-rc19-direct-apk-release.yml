name: Publish verified RC19 eye-scene voice auto-capture fix APK
on:
  push:
    branches: [fix/bluestar-118-voice-eye-scene-auto-capture-20261107]
    paths: ['.github/workflows/bluestar-rc19-direct-apk-release.yml']

permissions:
  actions: read
  contents: write

jobs:
  publish-verified-rc19:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Require exact successful RC19 Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=42366341112
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha')" = 2b329b0ef5ae7a93637bd27621b8f2a3bc9d0c9e
      - name: Download official original CI APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download 42366341112 \
            --repo "$GITHUB_REPOSITORY" \
            --name blue-star-guide-1-0-18-rc19-arm64 --dir verified
          test -s verified/BlueStar_Guide_1.0.18_RC19_arm64.apk
          test -s verified/SHA256SUMS.txt
          test -s verified/badging.txt
          test -s verified/apk-entries.txt
      - name: Verify unchanged APK bytes native UVC audio app ID and version
        run: |
          set -euo pipefail
          cd verified
          sha256sum -c SHA256SUMS.txt
          unzip -tq BlueStar_Guide_1.0.18_RC19_arm64.apk >/dev/null
          unzip -Z1 BlueStar_Guide_1.0.18_RC19_arm64.apk | grep -Fxq 'lib/arm64-v8a/libUVCCamera.so'
          unzip -Z1 BlueStar_Guide_1.0.18_RC19_arm64.apk | grep -Fxq 'res/raw/c_metal_clack_ding.mp3'
          unzip -Z1 BlueStar_Guide_1.0.18_RC19_arm64.apk | grep -Fxq 'res/raw/voice_send_whoosh.wav'
          grep -Fq "package: name='com.vobich.bluestar.rc19'" badging.txt
          grep -Fq "versionCode='28'" badging.txt
          grep -Fq "versionName='1.0.18-rc19'" badging.txt
          grep -Fq "application-label:'Blue Star Guide'" badging.txt
          grep -q 'application-icon-' badging.txt
          if grep -Ei 'inference\.onnx|paddle|ppocr|sherpa|layout.*onnx' apk-entries.txt; then
            echo "Unexpected on-device OCR model found" >&2
            exit 1
          fi
          echo "APK_SIZE_BYTES=$(stat -c%s BlueStar_Guide_1.0.18_RC19_arm64.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SHA256=$(sha256sum BlueStar_Guide_1.0.18_RC19_arm64.apk | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only verified CI APK without rebuilding or resigning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=blue-star-guide-cloud-rc19-20261107
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing RC19 Release; refuse overwrite." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "verified/BlueStar_Guide_1.0.18_RC19_arm64.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target 2b329b0ef5ae7a93637bd27621b8f2a3bc9d0c9e \
            --title "Blue Star Guide 1.0.18 RC19 - Voice scene intent camera fix" \
            --notes "Blue Star Guide RC19 v1.0.18 is a narrowly scoped speech-intent regression fix after RC18: spoken requests including '我眼前是什么', '眼前是什么', '前面是什么', and '眼前是啥' are now classified as OBSERVE_SCENE. The existing MainActivity route immediately takes a fresh phone Camera2 or native UVC photo and sends it to the user-selected visual AI model, then directly speaks the result. RC18 previously misclassified these short expressions as generic text QUESTION, and its new text-only web chat had no image so answered that it could not see. This release adds exact-utterance and paraphrase regression tests. Previous-photo questions such as '刚才我眼前是什么' remain text conversations and do not silently take new pictures; READ_TEXT retains separate dedicated or user-selected OCR models; general news/search queries still take the RC18 web chat path and can use one search-enabled request only when chosen. Target-finding, media recording, camera/USB orientation, native UVC 60..61fps negotiation, JPEG upload, hardware picture controls, ASR, TTS, audio effects, task grid and display logic are unchanged. Main branch and older RC18 remain intact. GitHub Actions 42366341112 success and exact source SHA 2b329b0ef5ae7a93637bd27621b8f2a3bc9d0c9e include voice flow, RC17 four OCR-model options, RC18 search policy and followup, RC13 32-case USB JPEG orientation, RC14 camera controls, RC15 USB auto switching, native ARM64 Android compilation and resource checks. This release publishes only the same sha256-verified official CI-built APK without rebuilding or re-signing. Isolated Android package com.vobich.bluestar.rc19 versionCode28 versionName1.0.18-rc19, which requires its own API key and USB settings. True speech-to-text/camera operation still requires user testing on vivo X200 Pro." \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'BlueStar_Guide_1.0.18_RC19_arm64.apk'
          echo "Direct browser URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BlueStar_Guide_1.0.18_RC19_arm64.apk" >> "$GITHUB_STEP_SUMMARY"
