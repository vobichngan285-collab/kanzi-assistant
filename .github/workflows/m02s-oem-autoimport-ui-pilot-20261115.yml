name: M02S OEM Foreground Auto Import UI Pilot
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-oem-autoimport-ui-pilot-20261115']
    paths:
      - 'experiments/m02s-oem-autoimport-helper/**'
      - '.github/workflows/m02s-oem-autoimport-ui-pilot-20261115.yml'
permissions:
  contents: write
jobs:
  build-test-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and unsigned debug build
        run: |
          gradle -p experiments/m02s-oem-autoimport-helper --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Safety invariants, permissions, and APK signature
        shell: bash
        run: |
          set -euo pipefail
          ROOT="experiments/m02s-oem-autoimport-helper"
          SRC="$ROOT/app/src/main/java/com/vobichngan/bluestar/oemautoimport"
          grep -Fq 'public static final String OEM_PACKAGE = "com.starglasses.app";' "$SRC/AutoImportPolicy.java"
          grep -Fq 'if (!AutoImportPolicy.isOemPackage(event.getPackageName()))' "$SRC/OemAutoImportService.java" || grep -Fq '!AutoImportPolicy.isOemPackage(event.getPackageName())' "$SRC/OemAutoImportService.java"
          grep -Fq 'observedAbsentInOemAlbum' "$SRC/OemAutoImportService.java"
          grep -Fq 's.pendingCount > 1' "$SRC/OemAutoImportService.java"
          grep -Fq 'STABLE_UI_MS = 950L' "$SRC/OemAutoImportService.java"
          grep -Fq 'AccessibilityNodeInfo.ACTION_CLICK' "$SRC/OemAutoImportService.java"
          grep -Fq 'android:packageNames="com.starglasses.app"' "$ROOT/app/src/main/res/xml/oem_autoimport_accessibility.xml"
          grep -Fq 'getLaunchIntentForPackage(' "$SRC/MainActivity.java"
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/sig.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/sig.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='com.vobichngan.bluestar.oemautoimport' versionCode='1' versionName='0.1.0-ui-pilot'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" > "$RUNNER_TEMP/perms.txt"
          if grep -qE 'android.permission.(INTERNET|BLUETOOTH|NEARBY_WIFI_DEVICES|ACCESS_WIFI_STATE|CHANGE_WIFI_STATE|ACCESS_FINE_LOCATION|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|CAMERA|SYSTEM_ALERT_WINDOW)' "$RUNNER_TEMP/perms.txt"; then
            echo 'Forbidden data/network/control permission in UI-only lab' >&2
            exit 1
          fi
          grep -Fq 'android.permission.BIND_ACCESSIBILITY_SERVICE' "$ROOT/app/src/main/AndroidManifest.xml"
          if grep -Fq 'M02sBleWire' "$SRC/OemAutoImportService.java" || grep -Fq 'delete(' "$SRC/OemAutoImportService.java"; then
            echo 'Unexpected direct BLE/delete operation' >&2; exit 1
          fi
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_OEM_AutoImport_UI_Pilot_0.1.0.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-OEM-Foreground-AutoImport-UI-Pilot
          path: release/BlueStar_M02S_OEM_AutoImport_UI_Pilot_0.1.0.apk
          retention-days: 30
          if-no-files-found: error
      - name: Release standalone UI-only helper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.txt" <<'EOF'
          M02S OEM photo auto-import *foreground UI pilot*, not a patched/modified OEM APK.
          Based on user's uploaded 1.0.24-c com.starglasses.app binary, which defines AlbumFragment, dp.getUnImportNumLiveData, dp.connectP2pWifitoReceivePhoto, dp.startDownLoadPhotoByWifi, and UI resources "发现%1$s个文件", "导入".
          This standalone test helper never replaces the original app. It requires voluntary Android Accessibility enable + its own opt-in switch. Only while OEM album is foreground, after observing no pending import and later exactly one new item with a clickable "导入" button, it clicks once. No blind retries and never taps clear/delete.
          Does not have INTERNET, Bluetooth, Wi-Fi, camera, or files permissions. All actual media import operations still run inside OEM. This does not guarantee that the OEM's own normal import cleanup does not delete downloaded content on glasses. No background or screen-off support. Needs real-device validation and may not work if controls are not exposed through accessibility.
          Original OEM APK/signature are never modified or redistributed; no functionality of RC25, Windows OCR or original APK was changed.
          EOF
          gh release create bluestar-m02s-oem-autoimport-ui-pilot-20261115 \
            release/BlueStar_M02S_OEM_AutoImport_UI_Pilot_0.1.0.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "M02S OEM Foreground Auto-Import Pilot v0.1.0 (separate helper, not OEM patch)" \
            --prerelease --notes-file "$RUNNER_TEMP/notes.txt"
      - name: Verify live Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bluestar-m02s-oem-autoimport-ui-pilot-20261115 \
            --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,url,assets \
            --jq '{isDraft,isPrerelease,url,assets:[.assets[]|{name:.name,size:.size,url:.url}]}'
