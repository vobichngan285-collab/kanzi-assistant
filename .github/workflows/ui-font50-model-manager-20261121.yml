name: Blue Star v1.0.72 Font50 and Model Manager
on:
  push:
    branches: [ 'exp/ui-font50-model-manager-20261121' ]
    paths:
      - 'cloud-vision-app/app/**'
      - 'cloud-vision-app/tests/**'
      - 'cloud-vision-app/docs/UI_FONT50_MODEL_MANAGER_20261121.md'
      - '.github/workflows/ui-font50-model-manager-20261121.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validated-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ernestp/AndroidUSBCamera
          ref: 3.6.0
          path: cloud-vision-app/third_party/AndroidUSBCamera
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify strict UI layout scope and cloud parameter boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe")
          def source(name): return (root/name).read_text()
          m=source("MainActivity.java")
          ui=source("BlueStarSettingsScreen.java")
          store=source("CloudProviderStore.java")
          cv=source("CloudVisionClient.java")
          policy=source("CloudThinkingPolicy.java")
          opts=source("CloudModelOptions.java")
          font=source("BlueStarFontScale.java")
          cam=source("C110CameraActivity.java")
          home=source("HomeActivity.java")
          task=source("TaskDesktopActivity.java")
          layout=source("LayoutParsingClient.java")
          manifest=Path("cloud-vision-app/app/src/main/AndroidManifest.xml").read_text()
          gradle=Path("cloud-vision-app/app/build.gradle").read_text()
          assert 'copy.fontScale=copy.fontScale*0.5f;' in font
          for activity in (m,home,task,cam):
              assert activity.count('BlueStarFontScale.wrap(base)')==1
          assert home.count('快捷拍照')>0 and home.count('实时预览')>0
          assert 'new Intent(this,C110CameraActivity.class)' in home
          assert 'TaskDesktopActivity.class' in home
          assert 'row("云服务器管理"' in ui and 'private void cloudServers()' in ui
          assert 'private void serverActions(String spec)' in ui
          assert 'setOnLongClickListener(v->{held.run();return true;})' in ui
          assert 'private void modelPrompt(String spec)' in ui
          selection=ui.split('    private void providerRole(',1)[1].split('    private EditText providerInput(',1)[0]
          assert 'row("编辑配置' not in selection and 'action("＋ 新建' not in selection
          assert 'app.testCloudProvider(role,profileId,model)' in ui
          assert 'input.setOnFocusChangeListener((v,focused)->{' in ui
          assert 'if(focused)input.setHint("")' in ui
          assert 'CloudKeyStore.saveNamed(ctx,id,key)' in store
          assert 'CloudKeyStore.loadNamed(ctx,chosen.id)' in store
          assert 'CloudModelOptions.get(ctx,role,chosen.id,chosen.model)' in store
          assert 'CloudModelOptions.clearProfile(ctx,id)' in store
          assert 'cfg.ocrPrompt!=null&&!cfg.ocrPrompt.isEmpty()' in cv
          assert '"ocr".equals(task.id)' in cv
          assert 'CloudThinkingPolicy.QWEN.equals(cfg.thinkingStyle)' in cv
          assert 'CloudThinkingPolicy.ZHIPU.equals(cfg.thinkingStyle)' in cv
          assert 'cfg.thinking?"enabled":"disabled"' in cv
          assert 'delta.optString("content","")' in cv
          assert 'optString("reasoning_content"' not in cv
          assert 'CloudProviderStore.LAYOUT.equals(cfg.protocol)' in cv
          assert 'return LayoutParsingClient.recognize(jpeg,cfg,cloudNetwork)' in cv
          assert '.put("file","data:image/jpeg;base64,"+' in layout
          assert 'CloudThinkingPolicy' not in layout
          assert 'CloudProviderPolicy.zhipuFastVisualOcr(url,model)' in policy
          assert '"dashscope.aliyuncs.com".equalsIgnoreCase(host)' in policy
          assert '"custom|"+profileId+"|"+model' in opts
          assert '"builtin|"+model' in opts
          assert 'photoCamera.shootAfterLivePreview(this)' in cam
          assert '--network-caching=150' in cam
          assert 'captureC110OneShot()' in m
          assert 'cloudBusy' in m
          assert "versionCode 81" in gradle
          assert "versionName '1.0.72-font50-model-manager'" in gradle
          assert "applicationIdSuffix '.c110plusquick159'" in gradle
          assert manifest.count('android.intent.category.LAUNCHER')==1
          assert 'org.videolan.android:libvlc-all:3.6.5' in gradle
          assert "implementation project(':libausbc')" in gradle
          assert "implementation project(':libuvc')" in gradle
          print("PASS: font 50%, original home flow, isolated model options and OEM/TTS/SSE safeguards")
          PY
          git fetch --no-tags origin +refs/heads/exp/lean-cleanup-20261121:refs/remotes/origin/exp/lean-cleanup-20261121
          git diff --name-only refs/remotes/origin/exp/lean-cleanup-20261121 HEAD >/tmp/changed.txt
          python3 - <<'PY'
          from pathlib import Path
          r="cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe/"
          expected={r+x for x in (
              "BlueStarFontScale.java","BlueStarSettingsScreen.java",
              "HomeActivity.java","MainActivity.java","TaskDesktopActivity.java",
              "C110CameraActivity.java","CloudModelOptions.java",
              "CloudProviderStore.java","CloudThinkingPolicy.java",
              "CloudVisionClient.java")}
          expected.update({
              "cloud-vision-app/app/build.gradle",
              "cloud-vision-app/docs/UI_FONT50_MODEL_MANAGER_20261121.md",
              "cloud-vision-app/tests/CloudThinkingPolicyTest.java",
              ".github/workflows/ui-font50-model-manager-20261121.yml"})
          actual=set(Path("/tmp/changed.txt").read_text().splitlines())
          assert actual==expected,f"Unexpected={actual-expected}; missing={expected-actual}"
          print("PASS: 14-file strict v1.0.71 base scope")
          PY
      - name: Run vendor allow-list, task and C110 pure Java regressions
        shell: bash
        run: |
          set -euo pipefail
          BASE=cloud-vision-app/app/src/main/java/com/vobich/bluestar/cloudprobe
          mkdir -p /tmp/bluestar-tests
          javac -d /tmp/bluestar-tests "$BASE/CloudProviderPolicy.java" cloud-vision-app/tests/CloudProviderPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudProviderPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/CloudProviderPolicy.java" "$BASE/CloudThinkingPolicy.java" cloud-vision-app/tests/CloudThinkingPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.CloudThinkingPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/TaskOrder.java" cloud-vision-app/tests/TaskOrderTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.TaskOrderTest
          javac -d /tmp/bluestar-tests "$BASE/FollowupPrompt.java" cloud-vision-app/tests/FollowupPromptTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.FollowupPromptTest
          javac -d /tmp/bluestar-tests "$BASE/C110ZoomGeometry.java" cloud-vision-app/tests/C110ZoomGeometryTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.C110ZoomGeometryTest
          javac -d /tmp/bluestar-tests "$BASE/C110PhotoPolicy.java" cloud-vision-app/tests/C110PhotoPolicyTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.C110PhotoPolicyTest
          javac -d /tmp/bluestar-tests "$BASE/OcrLineChunks.java" "$BASE/OcrSpeedExperiment.java" cloud-vision-app/tests/OcrSpeedExperimentTest.java
          java -cp /tmp/bluestar-tests com.vobich.bluestar.cloudprobe.OcrSpeedExperimentTest
      - name: Apply already-proven pinned UVC patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_usbmonitor.py cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/java/com/jiangdg/usb/USBMonitor.java
          python3 cloud-vision-app/scripts/patch_pinned_uvc.py
          grep -q BSG_CLOUD_RAW5_GATED cloud-vision-app/third_party/AndroidUSBCamera/libuvc/src/main/jni/UVCCamera/UVCPreview.cpp
          grep -q BSG_CLOUD_CLOSE_BARRIER cloud-vision-app/third_party/AndroidUSBCamera/libausbc/src/main/java/com/jiangdg/ausbc/camera/CameraUVC.kt
      - name: Generate unchanged Blue Star launcher assets
        run: |
          set -euo pipefail
          cd cloud-vision-app
          java scripts/GenerateLauncherIcons.java
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-$density/ic_launcher.png"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile full Android arm64 app
        shell: bash
        run: |
          set -euo pipefail
          cd cloud-vision-app
          gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug
      - name: Verify APK actual package, launcher, native libraries, sound and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp cloud-vision-app/app/build/outputs/apk/debug/app-debug.apk out/BlueStar_Guide_UI_Font50_Model_Manager_1.0.72.apk
          APK=out/BlueStar_Guide_UI_Font50_Model_Manager_1.0.72.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          unzip -Z1 "$APK" >out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libUVCCamera.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlc.so' out/entries.txt
          grep -Fxq 'lib/arm64-v8a/libvlcjni.so' out/entries.txt
          grep -Fxq 'res/raw/c_metal_clack_ding.mp3' out/entries.txt
          grep -Fxq 'res/raw/voice_send_whoosh.wav' out/entries.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" >out/badging.txt
          grep -Fq "package: name='com.vobich.bluestar.c110plusquick159'" out/badging.txt
          grep -Fq "versionName='1.0.72-font50-model-manager'" out/badging.txt
          grep -Fq "launchable-activity: name='com.vobich.bluestar.cloudprobe.HomeActivity'" out/badging.txt
          test "$(grep -c '^launchable-activity:' out/badging.txt)" -eq 1
          (cd out && sha256sum BlueStar_Guide_UI_Font50_Model_Manager_1.0.72.apk >SHA256SUMS.txt)
          cat out/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          BYTES=$(stat -c%s "$APK")
          echo "New v1.0.72 APK bytes: $BYTES" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline v1.0.71 APK bytes: 53499962" >> "$GITHUB_STEP_SUMMARY"
          echo "Compared to v1.0.71: $((BYTES-53499962)) bytes (negative means smaller)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: BlueStar_Guide_UI_Font50_Model_Manager_1.0.72
          path: out/*
          retention-days: 14
      - name: Publish ONLY if every test and package verification passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=bluestar-ui-font50-model-manager-20261121-v0172
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release" >&2
            exit 1
          fi
          gh release create "$TAG" out/BlueStar_Guide_UI_Font50_Model_Manager_1.0.72.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Blue Star v1.0.72 Font50 and Model Manager" \
            --notes "v1.0.72 exact half-font UI across Home, Preview, Task and C110. No layout/geometry changes. Unified cloud server management is under speech settings, model selection is selection-only, custom profiles have edit/delete in one submenu, built-in models cannot be deleted. Supported Qwen and GLM models have independent default-off thinking switches and optional OCR-only instructions. Unknown APIs and Layout Parsing do not receive unsupported fields. Old Qwen/GLM SSE, TTS, C110 OEM, USB and KeyStore preserved. Android CI cannot replace vivo real-device validation."
