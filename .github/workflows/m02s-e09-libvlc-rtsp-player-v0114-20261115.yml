name: Blue Star M02S E09 OEM LibVLC RTSP Player v0.1.14
on:
  workflow_dispatch:
  push:
    branches: ['exp/m02s-e09-libvlc-rtsp-player-v0114-20261115']
    paths:
      - 'experiments/m02s-wifi-lab/**'
      - '.github/workflows/m02s-e09-libvlc-rtsp-player-v0114-20261115.yml'
permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and standalone Android build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p experiments/m02s-wifi-lab --no-daemon --no-parallel --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify manual 0x95 hardware live support query, original BLE export and RTSP unchanged
        shell: bash
        run: |
          set -euo pipefail
          SRC="experiments/m02s-wifi-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/MainActivity.java"
          grep -Fq 'button("保存刚收到的蓝牙JPEG到手机相册（原始画质）", this::exportE09BleJpeg)' "$SRC"
          grep -Fq 'lastE09PhotoForExport = jpeg;' "$SRC"
          grep -Fq 'final byte[] jpeg = lastE09PhotoForExport.clone();' "$SRC"
          grep -Fq 'out.write(jpeg);' "$SRC"
          grep -Fq 'MediaStore.Images.Media.IS_PENDING' "$SRC"
          grep -Fq 'Environment.DIRECTORY_PICTURES + "/BlueStarE09"' "$SRC"
          grep -Fq 'if (lastE09PhotoForExport == null' "$SRC"
          grep -Fq 'button("E09 RTSP直播建连", this::startE09Live)' "$SRC"
          grep -Fq 'button("播放RTSP画面", this::playE09Preview)' "$SRC"
          grep -Fq 'M02sBleWire.e09BlePhoto()' "$SRC"
          ! grep -Fq 'Bitmap.compress(' "$SRC"
          # Compare the immutable Git blob from the user's tested v0.1.12 base.
          test "$(git hash-object experiments/m02s-wifi-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/M02sE09PhotoAssembler.java)" = "3be7b6c1b485d1766a9f0ebb5c65cbce2a0df0df"
          grep -Fq 'button("检测眼镜直播功能支持位（只读 BLE 0x95）", this::probeE09LiveSupport)' "$SRC"
          grep -Fq 'private void probeE09LiveSupport()' "$SRC"
          grep -Fq 'M02sBleWire.e09ReadCapabilities()' "$SRC"
          grep -Fq 'parsed.e09CapabilityMaskOrNull()' "$SRC"
          grep -Fq 'e09CapabilityPending' "$SRC"
          grep -Fq 'bit0 supportLive=' "$SRC"
          WIRE="experiments/m02s-wifi-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/M02sBleWire.java"
          grep -Fq 'public static byte[] e09ReadCapabilities() { return frame(0x95, 0x00); }' "$WIRE"
          grep -Fq 'payload.length != 4' "$WIRE"
          grep -Fq 'Arrays.equals(bytes, e09ReadCapabilities())' "$WIRE"
          # Preserve unchanged RTSP protocol/socket probe from user's v0.1.12 base.
          test "$(git hash-object experiments/m02s-wifi-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/M02sE09RtspProbe.java)" = "bec97b0f0ca5099e9fcfa4babd466409187c3097"
          # The ONLY connection experiment is Vivo's APP_LIVE first request:
          # public OEM WifiApConnector uses literal-pattern SSID with the
          # fresh scanned target BSSID, rather than our old SSID-only request.
          grep -Fq 'new PatternMatcher(' "$SRC"
          grep -Fq 'targetWifiSsid, PatternMatcher.PATTERN_LITERAL' "$SRC"
          grep -Fq 'builder.setBssid(MacAddress.fromString(apFreshFirstBssid));' "$SRC"
          grep -Fq 'M02sE09OemMatchPolicy.choose(' "$SRC"
          grep -Fq 'e09LiveRequested, Build.BRAND, currentTargetApScan()' "$SRC"
          grep -Fq 'if (strategy == M02sE09OemMatchPolicy.Choice.TARGET_NOT_READY)' "$SRC"
          grep -Fq 'button("普通AP相册连接（非直播）"' "$SRC"
          POLICY="experiments/m02s-wifi-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/M02sE09OemMatchPolicy.java"
          grep -Fq '!"vivo".equalsIgnoreCase(deviceBrand)' "$POLICY"
          grep -Fq 'M02sApReadinessPolicy.canConnect(' "$POLICY"
          ! grep -qE 'for *\(.*requestNetwork|while *\(.*requestNetwork' "$SRC"
          # Preserve the exact v0.1.13 OEM AP first-request fix that succeeded
          # on M02S-3584 / Vivo Android16; only the player may change.
          test "$(git hash-object experiments/m02s-wifi-lab/app/src/main/java/com/vobichngan/bluestar/m02slab/M02sE09OemMatchPolicy.java)" = "810a1c983a32a2365f89224dedde686b5d594479"
          ! grep -Fq 'import android.media.MediaPlayer;' "$SRC"
          grep -Fq 'import org.videolan.libvlc.LibVLC;' "$SRC"
          grep -Fq 'import org.videolan.libvlc.MediaPlayer;' "$SRC"
          grep -Fq 'IVLCVout vout = player.getVLCVout();' "$SRC"
          grep -Fq 'vout.attachViews();' "$SRC"
          grep -Fq 'media.addOption(":rtsp-tcp");' "$SRC"
          grep -Fq 'media.addOption(":network-caching=1000");' "$SRC"
          grep -Fq 'media.addOption(":file-caching=1000");' "$SRC"
          grep -Fq 'media.addOption(":live-caching=100");' "$SRC"
          grep -Fq 'media.addOption(":drop-late-frames=true");' "$SRC"
          grep -Fq 'media.addOption(":skip-frames=true");' "$SRC"
          grep -Fq 'player.setEventListener(event -> {' "$SRC"
          grep -Fq 'e09VlcSession' "$SRC"
          grep -Fq 'connectivity.bindProcessToNetwork(apNetwork)' "$SRC"
          grep -Fq 'vout.detachViews();' "$SRC"
          grep -Fq 'lib.release();' "$SRC"
          grep -Fq "implementation 'org.videolan.android:libvlc-all:3.7.7'" experiments/m02s-wifi-lab/app/build.gradle
          grep -Fq "abiFilters 'arm64-v8a'" experiments/m02s-wifi-lab/app/build.gradle
          test -s experiments/m02s-wifi-lab/app/src/main/assets/LICENSE-LGPL-2.1.txt
          test -s experiments/m02s-wifi-lab/app/src/main/assets/LIBVLC_THIRD_PARTY_NOTICE.txt
          echo "OEM BLE/AP/RTSP probe retained; player is native LibVLC 3.7.7 with RTSP TCP and license notices"

      - name: Verify independent APK, permissions, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="experiments/m02s-wifi-lab/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$TOOL/zipalign" -c -v 4 "$APK"
          "$TOOL/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.vobichngan.bluestar.m02se09vlc' versionCode='17' versionName='0.1.14'" "$RUNNER_TEMP/badging.txt"
          "$TOOL/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.BLUETOOTH_SCAN' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.NEARBY_WIFI_DEVICES' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.CHANGE_WIFI_STATE' "$RUNNER_TEMP/permissions.txt"
          if grep -qE 'android.permission.(CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected camera or media access in transport-only lab' >&2; exit 1
          fi
          unzip -Z1 "$APK" | grep -Fq 'lib/arm64-v8a/libvlc.so'
          unzip -Z1 "$APK" | grep -Fq 'lib/arm64-v8a/libvlcjni.so'
          if unzip -Z1 "$APK" | grep -qE '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo 'Unexpected ABI shipped; this experimental APK must be ARM64 only' >&2; exit 1
          fi
          unzip -Z1 "$APK" | grep -Fq 'assets/LICENSE-LGPL-2.1.txt'
          unzip -Z1 "$APK" | grep -Fq 'assets/LIBVLC_THIRD_PARTY_NOTICE.txt'
          unzip -t "$APK" | tail -n 2
          mkdir -p release
          cp "$APK" release/BlueStar_M02S_E09_LibVLC_RTSP_0.1.14_arm64.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-M02S-E09-LibVLC-RTSP-v0114-APK
          path: release/BlueStar_M02S_E09_LibVLC_RTSP_0.1.14_arm64.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct-browser APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/note.txt" <<'EOF'
          M02S E09 LibVLC RTSP playback-only experiment v0.1.14 (ARM64).
          User's real M02S-3584/vivo Android16 v0.1.13 test confirmed AA14 E09 APP_LIVE 0x67 response, 0x25 SSID, Android private AP onAvailable, route gateway, RTSP OPTIONS200 and DESCRIBE200 and SDP video, 75ms probe. Android framework MediaPlayer subsequently failed twice (what=1 extra=-2147483648), with no true video playback confirmed.
          This version REPLACES ONLY android.media.MediaPlayer playback with official VideoLAN LibVLC Android 3.7.7 and the public OEM EyevueTLiveActivity RTSP-over-TCP and cache/drop-late-frame options. Video playback still requires real-device verification; RTSP SDP or VLC Playing/Vout alone does not prove visible continuous frames.
          The proven v0.1.13 Vivo OEM-first LiteralPattern+BSSID Wi-Fi matcher, all BLE command/AA14/AA15 parsing, exact original JPEG assembler, 0x95 live capability read, gallery exporter, private gateway verification and RTSP OPTIONS/DESCRIBE probe are not rewritten. No automatic reconnect, recording, eye-glasses file deletion, OTA or cloud.
          LibVLC code is dynamically shipped from VideoLAN's official Maven Central LGPL-2.1 3.7.7 artifact, only arm64-v8a ABI, with complete LGPL-2.1 text and upstream-source notice embedded in the APK. The original E09 MIT attribution remains in this repo.
          Independent package com.vobichngan.bluestar.m02se09vlc versionName 0.1.14 does not replace prior installs.
          User action: after BLE LE1M, AA14 notifications and a working RTSP probe in Section 6, tap 播放RTSP画面 once, observe LibVLC Opening/Playing/Vout/video resolution or EncounteredError and physically verify frames. Use 停止直播并安全退出 to release LibVLC.
          EOF
          gh release create bluestar-m02s-e09-libvlc-rtsp-player-v0114-20261115 \
            release/BlueStar_M02S_E09_LibVLC_RTSP_0.1.14_arm64.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blue Star M02S E09 LibVLC RTSP Player v0.1.14" \
            --prerelease --notes-file "$RUNNER_TEMP/note.txt"
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bluestar-m02s-e09-libvlc-rtsp-player-v0114-20261115 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,url \
            --jq '{isDraft,isPrerelease,url,assets: [.assets[] | {name: .name, size: .size, url: .url}]}'
