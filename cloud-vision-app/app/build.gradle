plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.vobich.bluestar.cloudprobe'
    compileSdk 36
    defaultConfig {
        applicationId 'com.vobich.bluestar'
        minSdk 26
        targetSdk 35
        versionCode 92
        versionName '1.0.83-phone1440-c110-original-toggle'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug { minifyEnabled false; applicationIdSuffix '.c110plusquick159' }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { pickFirsts += ['**/libc++_shared.so'] } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation project(':libausbc')
    // USBMonitor.UsbControlBlock is a public callback type from libuvc.
    implementation project(':libuvc')
    // Media3 ExoPlayer/RTSP/UI were not referenced by this app. Preserve proven LibVLC 3.6.5.
    implementation 'org.videolan.android:libvlc-all:3.6.5'
}
