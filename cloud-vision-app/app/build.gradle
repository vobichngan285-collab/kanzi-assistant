plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.vobich.bluestar.cloudprobe'
    compileSdk 36
    defaultConfig {
        applicationId 'com.vobich.bluestar'
        minSdk 26
        targetSdk 35
        versionCode 30
        versionName '1.0.20-rc21'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug { minifyEnabled false; applicationIdSuffix '.rc21' }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { pickFirsts += ['**/libc++_shared.so'] } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation project(':libausbc')
    // USBMonitor.UsbControlBlock is a public callback type from libuvc.
    implementation project(':libuvc')
}
