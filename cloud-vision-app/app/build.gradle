plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.vobich.bluestar.cloudprobe'
    compileSdk 36
    defaultConfig {
        applicationId 'com.vobich.bluestar'
        minSdk 26
        targetSdk 35
        versionCode 61
        versionName '1.0.52-c110plus-home-key-preview'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug { minifyEnabled false; applicationIdSuffix '.c110plushome152' }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { pickFirsts += ['**/libc++_shared.so'] } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation project(':libausbc')
    // USBMonitor.UsbControlBlock is a public callback type from libuvc.
    implementation project(':libuvc')
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'org.videolan.android:libvlc-all:3.6.5'
}
