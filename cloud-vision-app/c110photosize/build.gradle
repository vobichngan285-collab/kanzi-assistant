plugins { id 'com.android.application' }
android {
    namespace 'com.vobich.bluestar.c110photosize'
    compileSdk 36
    defaultConfig {
        applicationId 'com.vobich.bluestar.c110photosize'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-c110-photo-native-size-lab'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
