plugins { id 'com.android.application' }
android {
    namespace 'com.vobich.bluestar.c110tone'
    compileSdk 36
    defaultConfig {
        applicationId 'com.vobich.bluestar.c110lights'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1-sound-lights'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
