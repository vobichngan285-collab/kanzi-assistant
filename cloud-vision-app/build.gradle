buildscript {
    repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10'
    }
}
allprojects {
    repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
}
ext {
    versionNameString = '3.6.0'
    versionCode = 129
    versionCompiler = 36
    versionTarget = 35
    minSdkVersion = 26
    javaSourceCompatibility = JavaVersion.VERSION_1_8
    javaTargetCompatibility = JavaVersion.VERSION_1_8
    androidXVersion = '1.7.1'
    ndkVersion = '28.1.13356709'
    kotlinCoreVersion = '1.3.2'
    kotlinCoroutines = '1.10.2'
    coreKtx = '1.18.0'
    materialVersion = '1.13.0'
    constraintlayoutVersion = '2.2.1'
    lifecycle_version = '2.10.0'
    quick_version = '2.9.50'
    dialog_version = '3.3.0'
    bugly_version = '4.1.9.3'
    bugly_native_version = '3.9.0'
}
