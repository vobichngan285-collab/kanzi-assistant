plugins { id 'com.android.application' }

android {
    namespace 'com.vobichngan.bluestar.photowatch'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vobichngan.bluestar.photowatch'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
