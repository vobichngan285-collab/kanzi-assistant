plugins { id 'com.android.application' }
android {
    namespace 'com.vobichngan.bluestar.oemautoimport'
    compileSdk 36
    defaultConfig {
        applicationId 'com.vobichngan.bluestar.oemautoimport'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.1.1-ui-pilot'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
