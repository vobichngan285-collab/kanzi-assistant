plugins { id 'com.android.application' }

android {
    namespace 'com.vobichngan.bluestar.m02slab'
    compileSdk 36
    defaultConfig {
        applicationId 'com.vobichngan.bluestar.m02se09vlc'
        minSdk 29
        targetSdk 35
        versionCode 17
        versionName '0.1.14'
        // This APK targets the user's vivo X200 Pro (ARM64 only). Avoid
        // shipping all VLC ABI binaries in this single-device lab.
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
}

dependencies {
    // Official VideoLAN Maven Central stable LibVLC Android AAR (LGPL-2.1).
    implementation 'org.videolan.android:libvlc-all:3.7.7'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
